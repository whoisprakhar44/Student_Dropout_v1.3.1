<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AP Citizen 360 — Live Runtime Logs</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'JetBrains Mono', 'Fira Code', Consolas, Menlo, monospace;
    }
    body {
      background: #0B0F19;
      color: #E2E8F0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    /* Top Navigation Toolbar */
    .top-toolbar {
      background: #111827;
      border-bottom: 1px solid #1F2937;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      z-index: 10;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .brand-title {
      font-size: 14px;
      font-weight: 700;
      color: #F8FAFC;
      letter-spacing: 0.3px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34D399;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10B981;
      box-shadow: 0 0 8px #10B981;
      animation: pulse-green 2s infinite;
    }
    @keyframes pulse-green {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }
    .status-badge.paused {
      background: rgba(245, 158, 11, 0.12);
      border-color: rgba(245, 158, 11, 0.3);
      color: #FBBF24;
    }
    .status-badge.paused .status-dot {
      background: #F59E0B;
      box-shadow: 0 0 8px #F59E0B;
      animation: none;
    }

    /* Control Actions & Filter Bar */
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-box input {
      background: #1E293B;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 6px 12px 6px 30px;
      color: #F8FAFC;
      font-size: 12px;
      outline: none;
      width: 220px;
      transition: all 0.2s;
    }
    .search-box input:focus {
      border-color: #3B82F6;
      width: 260px;
    }
    .search-icon {
      position: absolute;
      left: 9px;
      color: #64748B;
      pointer-events: none;
    }
    
    /* Level Filter Buttons */
    .level-filters {
      display: flex;
      background: #1E293B;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 2px;
    }
    .level-btn {
      background: transparent;
      border: none;
      color: #94A3B8;
      padding: 4px 9px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .level-btn:hover {
      color: #F8FAFC;
    }
    .level-btn.active {
      background: #3B82F6;
      color: #FFFFFF;
    }

    /* Tool Buttons */
    .btn {
      background: #1E293B;
      border: 1px solid #334155;
      color: #E2E8F0;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s;
    }
    .btn:hover {
      background: #334155;
      border-color: #475569;
    }
    .btn.active {
      background: rgba(59, 130, 246, 0.2);
      border-color: #3B82F6;
      color: #60A5FA;
    }
    .btn-danger {
      color: #F87171;
    }
    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.15);
      border-color: #EF4444;
    }

    /* Terminal Window */
    .terminal-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: auto;
      padding: 14px 18px;
      font-size: 12.5px;
      line-height: 1.65;
      background: #0B0F19;
      scroll-behavior: smooth;
    }
    .terminal-container::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    .terminal-container::-webkit-scrollbar-track {
      background: #0B0F19;
    }
    .terminal-container::-webkit-scrollbar-thumb {
      background: #1F2937;
      border-radius: 4px;
    }

    /* Log Entry Lines */
    .log-line {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 2px 6px;
      border-radius: 4px;
      white-space: pre-wrap;
      word-break: break-word;
      transition: background 0.1s;
    }
    .log-line:hover {
      background: rgba(255, 255, 255, 0.03);
    }
    .log-id {
      color: #475569;
      font-size: 11px;
      min-width: 36px;
      user-select: none;
      text-align: right;
    }
    .log-time {
      color: #64748B;
      font-size: 11.5px;
      min-width: 140px;
      user-select: none;
    }
    .log-level {
      font-weight: 700;
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 4px;
      min-width: 58px;
      text-align: center;
      user-select: none;
    }
    .log-level.INFO {
      color: #38BDF8;
      background: rgba(56, 189, 248, 0.1);
    }
    .log-level.WARNING, .log-level.WARN {
      color: #FBBF24;
      background: rgba(251, 191, 36, 0.12);
    }
    .log-level.ERROR, .log-level.CRITICAL {
      color: #F87171;
      background: rgba(248, 113, 113, 0.15);
    }
    .log-level.DEBUG {
      color: #A78BFA;
      background: rgba(167, 139, 250, 0.1);
    }
    .log-msg {
      flex: 1;
      color: #E2E8F0;
    }
    .log-msg.highlight-sql {
      color: #34D399;
    }
    .log-msg.highlight-time {
      color: #F472B6;
    }

    /* Bottom Status Bar */
    .bottom-bar {
      background: #111827;
      border-top: 1px solid #1F2937;
      padding: 6px 18px;
      font-size: 11.5px;
      color: #64748B;
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .stats {
      display: flex;
      gap: 16px;
    }
    .stats span {
      color: #94A3B8;
    }
    .stats strong {
      color: #F8FAFC;
    }
  </style>
</head>
<body>

  <!-- Top Toolbar -->
  <header class="top-toolbar">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="4 17 10 11 4 5"/>
        <line x1="12" x2="20" y1="19" y2="19"/>
      </svg>
      <span class="brand-title">AP Citizen 360 Logs</span>
      <span id="streamStatus" class="status-badge">
        <span class="status-dot"></span>
        <span id="streamStatusText">Connected • Live</span>
      </span>
    </div>

    <!-- Controls -->
    <div class="controls">
      <!-- Search -->
      <div class="search-box">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.3-4.3"/>
        </svg>
        <input type="text" id="searchInput" placeholder="Search logs (regex or text)..." autocomplete="off">
      </div>

      <!-- Level Filter -->
      <div class="level-filters">
        <button class="level-btn active" data-level="ALL">ALL</button>
        <button class="level-btn" data-level="INFO">INFO</button>
        <button class="level-btn" data-level="WARNING">WARN</button>
        <button class="level-btn" data-level="ERROR">ERROR</button>
        <button class="level-btn" data-level="DEBUG">DEBUG</button>
      </div>

      <!-- Autoscroll Toggle -->
      <button id="autoScrollBtn" class="btn active" title="Toggle Auto-Scroll">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14"/>
          <path d="m19 12-7 7-7-7"/>
        </svg>
        <span>Auto-Scroll</span>
      </button>

      <!-- Pause / Resume -->
      <button id="pauseBtn" class="btn" title="Pause / Resume Live Stream">
        <svg id="pauseIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="4" height="16" x="6" y="4"/>
          <rect width="4" height="16" x="14" y="4"/>
        </svg>
        <span id="pauseText">Pause</span>
      </button>

      <!-- Copy -->
      <button id="copyBtn" class="btn" title="Copy visible logs">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
          <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
        </svg>
        <span>Copy</span>
      </button>

      <!-- Export .log -->
      <button id="exportBtn" class="btn" title="Download log file">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" x2="12" y1="15" y2="3"/>
        </svg>
        <span>Export</span>
      </button>

      <!-- Clear -->
      <button id="clearBtn" class="btn btn-danger" title="Clear logs view">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18"/>
          <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
          <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
        </svg>
        <span>Clear</span>
      </button>

      <!-- Logout -->
      <a href="?logout=1" class="btn" title="Logout" style="text-decoration:none;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" x2="9" y1="12" y2="12"/>
        </svg>
      </a>
    </div>
  </header>

  <!-- Terminal Display -->
  <main id="terminal" class="terminal-container"></main>

  <!-- Bottom Bar -->
  <footer class="bottom-bar">
    <div class="stats">
      <span>Total Logs: <strong id="totalCount">0</strong></span>
      <span>Visible: <strong id="visibleCount">0</strong></span>
      <span>Filter: <strong id="currentFilterText">ALL</strong></span>
    </div>
    <div style="color: #64748B;">AP Citizen 360 • FastAPI Runtime</div>
  </footer>

  <script>
    let allLogs = [];
    let activeLevel = 'ALL';
    let searchQuery = '';
    let autoScroll = true;
    let isPaused = false;
    let evtSource = null;

    const terminal = document.getElementById('terminal');
    const searchInput = document.getElementById('searchInput');
    const autoScrollBtn = document.getElementById('autoScrollBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const pauseIcon = document.getElementById('pauseIcon');
    const pauseText = document.getElementById('pauseText');
    const copyBtn = document.getElementById('copyBtn');
    const exportBtn = document.getElementById('exportBtn');
    const clearBtn = document.getElementById('clearBtn');
    const streamStatus = document.getElementById('streamStatus');
    const streamStatusText = document.getElementById('streamStatusText');
    const totalCount = document.getElementById('totalCount');
    const visibleCount = document.getElementById('visibleCount');
    const currentFilterText = document.getElementById('currentFilterText');
    const levelBtns = document.querySelectorAll('.level-btn');

    function escapeHtml(text) {
      return String(text || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function highlightContent(msg) {
      let escaped = escapeHtml(msg);
      // Highlight SQL statements
      escaped = escaped.replace(/(SELECT\s+[\s\S]*?FROM\s+[\s\S]*?)(;|\n|$)/gi, '<span style="color:#34D399;font-weight:600;">$1$2</span>');
      // Highlight timings (e.g., 0.45s or 1.25s)
      escaped = escaped.replace(/(\b\d+\.\d+\s*(?:s|ms|seconds)\b)/gi, '<span style="color:#F472B6;font-weight:600;">$1</span>');
      // Highlight Request IDs & Session UUIDs
      escaped = escaped.replace(/(req_[a-zA-Z0-9_-]+|sess_[a-zA-Z0-9_-]+|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/gi, '<span style="color:#818CF8;font-weight:600;">$1</span>');
      return escaped;
    }

    function createLogLineElement(entry) {
      const div = document.createElement('div');
      div.className = 'log-line';
      div.dataset.id = entry.id;
      div.dataset.level = (entry.level || 'INFO').toUpperCase();
      div.dataset.raw = entry.formatted || entry.message || '';

      const level = (entry.level || 'INFO').toUpperCase();
      div.innerHTML = `
        <span class="log-id">#${entry.id}</span>
        <span class="log-time">${escapeHtml(entry.timestamp || '')}</span>
        <span class="log-level ${level}">${level}</span>
        <span class="log-msg">${highlightContent(entry.message || entry.formatted)}</span>
      `;
      return div;
    }

    function matchesFilter(entry) {
      const lvl = (entry.level || 'INFO').toUpperCase();
      if (activeLevel !== 'ALL' && lvl !== activeLevel) {
        if (activeLevel === 'WARNING' && lvl !== 'WARN' && lvl !== 'WARNING') return false;
        if (activeLevel !== 'WARNING') return false;
      }
      if (searchQuery) {
        const raw = (entry.formatted || entry.message || '').toLowerCase();
        if (!raw.includes(searchQuery.toLowerCase())) return false;
      }
      return true;
    }

    function renderAllLogs() {
      terminal.innerHTML = '';
      let rendered = 0;
      const fragment = document.createDocumentFragment();

      allLogs.forEach(entry => {
        if (matchesFilter(entry)) {
          fragment.appendChild(createLogLineElement(entry));
          rendered++;
        }
      });

      terminal.appendChild(fragment);
      visibleCount.textContent = rendered;
      totalCount.textContent = allLogs.length;

      if (autoScroll) {
        terminal.scrollTop = terminal.scrollHeight;
      }
    }

    function appendSingleLog(entry) {
      allLogs.push(entry);
      if (allLogs.length > 2000) allLogs.shift();
      totalCount.textContent = allLogs.length;

      if (isPaused) return;

      if (matchesFilter(entry)) {
        const el = createLogLineElement(entry);
        terminal.appendChild(el);
        visibleCount.textContent = parseInt(visibleCount.textContent || 0) + 1;

        if (autoScroll) {
          terminal.scrollTop = terminal.scrollHeight;
        }
      }
    }

    // SSE Connection Setup
    function connectSSE() {
      if (evtSource) {
        evtSource.close();
      }

      streamStatus.className = 'status-badge';
      streamStatusText.textContent = 'Connecting...';

      const baseEndpoint = window.location.pathname.replace(/\/+$/, '') || '/logs';
      evtSource = new EventSource(baseEndpoint + '?action=logs_stream');

      evtSource.onopen = () => {
        streamStatus.className = 'status-badge';
        streamStatusText.textContent = 'Connected • Live';
      };

      evtSource.onmessage = (event) => {
        try {
          const entry = JSON.parse(event.data);
          appendSingleLog(entry);
        } catch (err) {
          console.error('Failed to parse log event', err);
        }
      };

      evtSource.onerror = () => {
        streamStatus.className = 'status-badge paused';
        streamStatusText.textContent = 'Reconnecting...';
      };
    }

    // Level Filter Handlers
    levelBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        levelBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeLevel = btn.dataset.level;
        currentFilterText.textContent = activeLevel;
        renderAllLogs();
      });
    });

    // Search input
    let searchDebounce = null;
    searchInput.addEventListener('input', (e) => {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(() => {
        searchQuery = e.target.value.trim();
        renderAllLogs();
      });
    });

    // Autoscroll toggle
    autoScrollBtn.addEventListener('click', () => {
      autoScroll = !autoScroll;
      autoScrollBtn.classList.toggle('active', autoScroll);
      if (autoScroll) {
        terminal.scrollTop = terminal.scrollHeight;
      }
    });

    // Pause toggle
    pauseBtn.addEventListener('click', () => {
      isPaused = !isPaused;
      pauseBtn.classList.toggle('active', isPaused);
      pauseText.textContent = isPaused ? 'Resume' : 'Pause';
      if (isPaused) {
        streamStatus.className = 'status-badge paused';
        streamStatusText.textContent = 'Stream Paused';
      } else {
        streamStatus.className = 'status-badge';
        streamStatusText.textContent = 'Connected • Live';
        renderAllLogs();
      }
    });

    // Copy logs
    copyBtn.addEventListener('click', () => {
      const lines = Array.from(terminal.querySelectorAll('.log-line'))
        .map(el => el.dataset.raw)
        .join('\n');
      navigator.clipboard.writeText(lines).then(() => {
        const orig = copyBtn.querySelector('span').textContent;
        copyBtn.querySelector('span').textContent = 'Copied!';
        setTimeout(() => copyBtn.querySelector('span').textContent = orig, 1500);
      });
    });

    // Export .log
    exportBtn.addEventListener('click', () => {
      const lines = allLogs.map(e => e.formatted || e.message).join('\n');
      const blob = new Blob([lines], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `citizen360_logs_${new Date().toISOString().replace(/[:.]/g, '-')}.log`;
      a.click();
      URL.revokeObjectURL(url);
    });

    // Clear logs
    clearBtn.addEventListener('click', () => {
      allLogs = [];
      terminal.innerHTML = '';
      totalCount.textContent = '0';
      visibleCount.textContent = '0';
    });

    // Initialize
    connectSSE();
  </script>
</body>
</html>
