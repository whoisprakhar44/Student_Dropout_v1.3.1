<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Curated Datamodels Chat App</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* Sidebar Styling */
        .sidebar {
            width: 320px;
            background-color: #070a10;
            border-right: 1px solid #1e293b;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid #1e293b;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar-logo {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -5px;
        }
        .config-panel {
            padding: 20px 24px;
            border-bottom: 1px solid #1e293b;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .config-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #94a3b8;
        }
        .config-input-group {
            display: flex;
            gap: 8px;
        }
        .input-text {
            background-color: #111827;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 10px 14px;
            color: #f8fafc;
            font-size: 13px;
            flex-grow: 1;
            transition: all 0.2s;
        }
        .input-text:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }
        .btn {
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            user-select: none;
        }
        .btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }
        .btn-secondary {
            background: #1f2937;
            border: 1px solid #374151;
            color: #f8fafc;
        }
        .btn-secondary:hover {
            background: #374151;
        }
        .btn-danger {
            background: #991b1b;
        }
        .btn-danger:hover {
            background: #b91c1c;
        }
        .sessions-list-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 16px 20px;
        }
        .session-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 8px;
            transition: all 0.2s;
            border: 1px solid transparent;
            background: rgba(30, 41, 59, 0.2);
        }
        .session-item:hover {
            background: rgba(30, 41, 59, 0.4);
            border-color: #334155;
        }
        .session-item.active {
            background: rgba(99, 102, 241, 0.15);
            border-color: #4f46e5;
        }
        .session-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
            flex-grow: 1;
        }
        .session-title {
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .session-date {
            font-size: 11px;
            color: #64748b;
        }
        .btn-delete {
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: all 0.2s;
        }
        .session-item:hover .btn-delete {
            opacity: 1;
        }
        .btn-delete:hover {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }
        /* Chat Area Styling */
        .chat-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background-color: #0f172a;
        }
        .chat-header {
            padding: 20px 24px;
            border-bottom: 1px solid #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(10px);
        }
        .chat-title-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .chat-title {
            font-size: 15px;
            font-weight: 600;
        }
        .chat-subtitle {
            font-size: 11px;
            color: #94a3b8;
            font-family: var(--font-mono);
        }
        .messages-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 30px 40px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .message-row {
            display: flex;
            width: 100%;
        }
        .message-row.user {
            justify-content: flex-end;
        }
        .message-row.assistant {
            justify-content: flex-start;
        }
        .bubble {
            max-width: 80%;
            border-radius: 16px;
            padding: 16px 20px;
            line-height: 1.5;
            font-size: 14px;
        }
        .message-row.user .bubble {
            background-color: #312e81;
            color: #f8fafc;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .message-row.assistant .bubble {
            background-color: #1e293b;
            color: #f8fafc;
            border-bottom-left-radius: 4px;
            border: 1px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .bubble-text {
            white-space: pre-wrap;
        }
        /* Collapsible Accordions */
        details {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.2s;
            width: 100%;
        }
        details[open] {
            border-color: #4f46e5;
        }
        summary {
            padding: 12px 16px;
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 8px;
            outline: none;
            transition: background 0.2s;
        }
        summary:hover {
            background: rgba(255, 255, 255, 0.02);
            color: #f8fafc;
        }
        .code-block {
            padding: 16px;
            background: #090d16;
            border-top: 1px solid #334155;
            font-family: var(--font-mono);
            font-size: 12px;
            color: #38bdf8;
            overflow-x: auto;
            white-space: pre-wrap;
        }
        /* Results Table */
        .results-container {
            border-top: 1px solid #334155;
            overflow-x: auto;
            max-height: 250px;
            overflow-y: auto;
        }
        .results-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            text-align: left;
        }
        .results-table th {
            background-color: #070a10;
            color: #94a3b8;
            font-weight: 600;
            padding: 10px 14px;
            border-bottom: 2px solid #334155;
            position: sticky;
            top: 0;
        }
        .results-table td {
            padding: 10px 14px;
            border-bottom: 1px solid #1e293b;
            color: #e2e8f0;
        }
        .results-table tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }
        .error-card {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #fca5a5;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        /* Input Panel Styling */
        .input-panel {
            position: relative;
            padding: 16px 40px 24px 40px;
            border-top: 1px solid #1e293b;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
        }
        .quick-suggestions-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 8px;
            scrollbar-width: none;
        }
        .quick-suggestions-bar::-webkit-scrollbar {
            display: none;
        }
        .quick-chip {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(51, 65, 85, 0.8);
            border-radius: 9999px;
            padding: 5px 12px;
            font-size: 11px;
            color: #94a3b8;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .quick-chip:hover {
            background: rgba(99, 102, 241, 0.18);
            border-color: #6366f1;
            color: #f1f5f9;
            transform: translateY(-1px);
        }
        .suggestions-dropdown {
            position: absolute;
            bottom: calc(100% - 6px);
            left: 40px;
            right: 40px;
            background: #0d1322;
            border: 1px solid #334155;
            border-radius: 12px;
            box-shadow: 0 20px 35px -5px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.05);
            max-height: 300px;
            overflow-y: auto;
            z-index: 100;
            display: flex;
            flex-direction: column;
            padding: 8px;
            gap: 4px;
        }
        .suggestions-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #64748b;
            border-bottom: 1px solid #1e293b;
            margin-bottom: 4px;
        }
        .suggestion-item {
            padding: 9px 12px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            color: #cbd5e1;
            font-size: 13px;
            transition: all 0.15s ease;
        }
        .suggestion-item:hover, .suggestion-item.selected {
            background: rgba(99, 102, 241, 0.18);
            color: #ffffff;
            border-left: 3px solid #6366f1;
            padding-left: 9px;
        }
        .suggestion-text {
            flex-grow: 1;
            line-height: 1.4;
        }
        .suggestion-text mark {
            background: rgba(99, 102, 241, 0.35);
            color: #c7d2fe;
            padding: 1px 3px;
            border-radius: 3px;
            font-weight: 600;
        }
        .suggestion-badge {
            font-size: 10px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 6px;
            background: #1e293b;
            color: #94a3b8;
            white-space: nowrap;
        }
        .suggestion-item.selected .suggestion-badge {
            background: rgba(99, 102, 241, 0.3);
            color: #c7d2fe;
        }
        .input-form {
            display: flex;
            gap: 12px;
        }
        .input-chat {
            background-color: #111827;
            border: 1px solid #374151;
            border-radius: 12px;
            padding: 16px 20px;
            color: #f8fafc;
            font-size: 14px;
            flex-grow: 1;
            resize: none;
            height: 54px;
            transition: all 0.2s;
        }
        .input-chat:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }
        /* Loader and Status */
        .loader {
            border: 3px solid #334155;
            border-top: 3px solid #6366f1;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-state {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            color: #94a3b8;
            font-size: 13px;
        }
        .empty-chat {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #64748b;
            text-align: center;
            gap: 16px;
        }
        .empty-icon {
            font-size: 48px;
            color: #334155;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">⚡ dropout.ai</div>
        </div>
        <div class="config-panel">
            <div class="config-label">Username (Scoping)</div>
            <div class="config-input-group">
                <input type="text" id="usernameInput" class="input-text" placeholder="e.g. test_user" value="test_user">
                <button class="btn btn-secondary" onclick="loadHistory()">Load</button>
            </div>
            <button class="btn" style="margin-top: 8px;" onclick="startNewSession()">+ New Session</button>
        </div>
        <div class="sessions-list-container" id="sessionsList">
            <!-- Session items will populate here -->
        </div>
        <div class="config-panel" style="border-top: 1px solid #1e293b; border-bottom: none;">
            <button class="btn btn-secondary btn-danger" onclick="clearAllHistory()">Clear All History</button>
        </div>
    </div>
    
    <div class="chat-area">
        <div class="chat-header">
            <div class="chat-title-group">
                <div class="chat-title" id="chatTitle">Select or Start a Chat Session</div>
                <div class="chat-subtitle" id="chatSubtitle">No Active Session</div>
            </div>
        </div>
        
        <div class="messages-container" id="messagesContainer">
            <div class="empty-chat">
                <div class="empty-icon">💬</div>
                <div>Enter a username on the left, then click "Load" to start browsing sessions or submit a query.</div>
            </div>
        </div>
        
        <div class="input-panel">
            <!-- Quick Suggestion Chips -->
            <div class="quick-suggestions-bar" id="quickSuggestionsBar">
                <!-- Dynamically populated chips -->
            </div>

            <!-- Autocomplete Suggestions Dropdown -->
            <div id="suggestionsDropdown" class="suggestions-dropdown" style="display: none;">
                <div class="suggestions-header">
                    <span>Suggested Questions</span>
                    <span style="font-size: 10px; color: #475569;">Use ↑ ↓ arrows & Enter</span>
                </div>
                <div id="suggestionsItemsList" style="display: flex; flex-direction: column; gap: 3px;"></div>
            </div>

            <form class="input-form" onsubmit="submitQuestion(event)">
                <textarea id="questionInput" class="input-chat" placeholder="Ask a question or type to see few-shot suggestions..." onkeydown="handleInputKeyDown(event)" oninput="handleInputChange(event)" onfocus="handleInputFocus()"></textarea>
                <button class="btn" type="submit" id="sendBtn" style="height: 54px; width: 80px;">Send</button>
            </form>
        </div>
    </div>

    <script>
        let currentUsername = "";
        let currentSessionId = "";
        let sessionsMap = new Map(); // session_id -> session object
        window.__chartData = {}; // msgId -> result data

        // Suggestions state
        let cachedSuggestions = [];
        let currentRenderedSuggestions = [];
        let currentActiveSuggestionIndex = -1;
        let suggestionDebounceTimer = null;

        // Helper to generate UUIDv4
        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        // On document load, configure username and fetch history & fewshot suggestions
        window.addEventListener('DOMContentLoaded', () => {
            const savedUsername = localStorage.getItem('chat_username') || 'test_user';
            document.getElementById('usernameInput').value = savedUsername;
            loadHistory();
            loadSuggestions();

            // Close dropdown when clicking outside
            document.addEventListener('click', (e) => {
                const dropdown = document.getElementById('suggestionsDropdown');
                const input = document.getElementById('questionInput');
                if (dropdown && !dropdown.contains(e.target) && e.target !== input) {
                    hideSuggestionsDropdown();
                }
            });
        });

        // ─────────────────────────────────────────────────────────────────────────────
        // Suggestions & Embeddings Loading & Matching
        // ─────────────────────────────────────────────────────────────────────────────

        async function loadSuggestions() {
            try {
                // 1. Check server cache timestamp / version first
                const metaResp = await fetch('/suggestions/meta');
                let serverMeta = null;
                if (metaResp.ok) {
                    serverMeta = await metaResp.json();
                }

                const localUpdatedAt = localStorage.getItem('fewshot_cache_updated_at');
                const localCached = localStorage.getItem('fewshot_suggestions_cache');

                // 2. If client cache is up-to-date, use local data immediately (0 network download)
                if (serverMeta && localUpdatedAt === serverMeta.updated_at && localCached) {
                    try {
                        const parsed = JSON.parse(localCached);
                        if (Array.isArray(parsed) && parsed.length > 0) {
                            cachedSuggestions = parsed;
                            renderQuickChips(cachedSuggestions);
                            return;
                        }
                    } catch (e) {
                        console.warn("Failed to parse cached suggestions from localStorage", e);
                    }
                }

                // 3. Otherwise, fetch all suggestions (limit=-1) and save to localStorage
                const response = await fetch('/suggestions?limit=-1');
                if (!response.ok) throw new Error("Suggestions fetch failed");
                const data = await response.json();
                if (data.suggestions && Array.isArray(data.suggestions)) {
                    cachedSuggestions = data.suggestions;
                    localStorage.setItem('fewshot_suggestions_cache', JSON.stringify(cachedSuggestions));
                    if (data.updated_at) {
                        localStorage.setItem('fewshot_cache_updated_at', data.updated_at);
                    }
                    renderQuickChips(cachedSuggestions);
                }
            } catch (err) {
                console.error("Could not fetch fewshot suggestions:", err);
                // Fallback to local cache if offline
                const localCached = localStorage.getItem('fewshot_suggestions_cache');
                if (localCached) {
                    try {
                        cachedSuggestions = JSON.parse(localCached);
                        renderQuickChips(cachedSuggestions);
                    } catch (e) {}
                }
            }
        }

        function renderQuickChips(suggestions) {
            const bar = document.getElementById('quickSuggestionsBar');
            if (!bar || !suggestions || suggestions.length === 0) return;
            bar.innerHTML = '';
            
            // Pick a diverse set of 6 sample questions for the quick chips
            const sample = suggestions.slice(0, 6);
            sample.forEach(item => {
                const chip = document.createElement('div');
                chip.className = 'quick-chip';
                chip.innerHTML = `<span>✨</span> <span>${escapeHtml(item.question.length > 55 ? item.question.substring(0, 52) + '...' : item.question)}</span>`;
                chip.title = item.question;
                chip.onclick = () => applySuggestion(item.question, false);
                bar.appendChild(chip);
            });
        }

        function handleInputFocus() {
            const input = document.getElementById('questionInput');
            const query = input.value.trim();
            if (query) {
                filterAndRenderSuggestions(query);
            }
        }

        function handleInputChange(event) {
            const query = event.target.value.trim();
            clearTimeout(suggestionDebounceTimer);
            if (!query) {
                hideSuggestionsDropdown();
                return;
            }
            suggestionDebounceTimer = setTimeout(() => {
                filterAndRenderSuggestions(query);
            }, 50);
        }

        function handleInputKeyDown(event) {
            const dropdown = document.getElementById('suggestionsDropdown');
            const isOpen = dropdown && dropdown.style.display !== 'none';

            if (isOpen) {
                if (event.key === 'ArrowDown') {
                    event.preventDefault();
                    navigateSuggestions(1);
                    return;
                } else if (event.key === 'ArrowUp') {
                    event.preventDefault();
                    navigateSuggestions(-1);
                    return;
                } else if (event.key === 'Enter' && !event.shiftKey) {
                    if (currentActiveSuggestionIndex >= 0 && currentRenderedSuggestions[currentActiveSuggestionIndex]) {
                        event.preventDefault();
                        applySuggestion(currentRenderedSuggestions[currentActiveSuggestionIndex].question, true);
                        return;
                    }
                } else if (event.key === 'Escape') {
                    event.preventDefault();
                    hideSuggestionsDropdown();
                    return;
                }
            }

            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                hideSuggestionsDropdown();
                submitQuestion(event);
            }
        }

        function navigateSuggestions(delta) {
            if (!currentRenderedSuggestions || currentRenderedSuggestions.length === 0) return;
            currentActiveSuggestionIndex += delta;
            if (currentActiveSuggestionIndex < 0) currentActiveSuggestionIndex = currentRenderedSuggestions.length - 1;
            if (currentActiveSuggestionIndex >= currentRenderedSuggestions.length) currentActiveSuggestionIndex = 0;

            const items = document.querySelectorAll('.suggestion-item');
            items.forEach((el, idx) => {
                if (idx === currentActiveSuggestionIndex) {
                    el.classList.add('selected');
                    el.scrollIntoView({ block: 'nearest' });
                } else {
                    el.classList.remove('selected');
                }
            });
        }

        function filterAndRenderSuggestions(query) {
            if (!cachedSuggestions || cachedSuggestions.length === 0) {
                hideSuggestionsDropdown();
                return;
            }

            const qLower = query.toLowerCase();
            const qTokens = qLower.split(/\s+/).filter(t => t.length > 1);

            // Score each suggestion
            const scored = [];
            for (let i = 0; i < cachedSuggestions.length; i++) {
                const s = cachedSuggestions[i];
                const qText = s.question.toLowerCase();
                let score = 0;

                // 1. Prefix match boost
                if (qText.startsWith(qLower)) {
                    score += 3.0;
                } else if (qText.includes(qLower)) {
                    score += 1.5;
                }

                if (qTokens.length > 0) {
                    let matches = 0;
                    for (const tok of qTokens) {
                        if (qText.includes(tok)) matches++;
                    }
                    score += (matches / qTokens.length) * 1.2;
                }

                if (score > 0.3) {
                    scored.push({ score, item: s });
                }
            }

            scored.sort((a, b) => b.score - a.score);
            const topMatches = scored.slice(0, 8).map(x => x.item);

            renderSuggestionsDropdown(topMatches, query);
        }

        function renderSuggestionsDropdown(items, query) {
            const dropdown = document.getElementById('suggestionsDropdown');
            const listContainer = document.getElementById('suggestionsItemsList');
            if (!dropdown || !listContainer) return;

            if (!items || items.length === 0) {
                hideSuggestionsDropdown();
                return;
            }

            currentRenderedSuggestions = items;
            currentActiveSuggestionIndex = -1;
            listContainer.innerHTML = '';

            items.forEach((item, idx) => {
                const row = document.createElement('div');
                row.className = 'suggestion-item';
                row.onclick = () => applySuggestion(item.question, false);

                // Highlight matched query in text
                const highlighted = highlightQueryInText(item.question, query);
                const tag = item.intent || item.topic || (item.difficulty ? `${item.difficulty}` : 'few-shot');

                row.innerHTML = `
                    <div class="suggestion-text">
                        <span>💬</span> ${highlighted}
                    </div>
                    <div class="suggestion-badge">${escapeHtml(tag)}</div>
                `;
                listContainer.appendChild(row);
            });

            dropdown.style.display = 'flex';
        }

        function highlightQueryInText(text, query) {
            if (!query) return escapeHtml(text);
            const escapedText = escapeHtml(text);
            const tokens = query.trim().split(/\s+/).filter(t => t.length > 0).map(t => escapeRegExp(t));
            if (tokens.length === 0) return escapedText;

            try {
                const regex = new RegExp(`(${tokens.join('|')})`, 'gi');
                return escapedText.replace(regex, '<mark>$1</mark>');
            } catch (e) {
                return escapedText;
            }
        }

        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function hideSuggestionsDropdown() {
            const dropdown = document.getElementById('suggestionsDropdown');
            if (dropdown) dropdown.style.display = 'none';
            currentActiveSuggestionIndex = -1;
        }

        function applySuggestion(questionText, autoSubmit = false) {
            const input = document.getElementById('questionInput');
            input.value = questionText;
            hideSuggestionsDropdown();
            input.focus();
            if (autoSubmit) {
                submitQuestion(new Event('submit'));
            }
        }

        function handleEnter(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                submitQuestion(event);
            }
        }

        async function loadHistory(autoSelect = true) {
            const usernameInput = document.getElementById('usernameInput');
            currentUsername = usernameInput.value.trim();
            if (!currentUsername) {
                alert("Please enter a username.");
                return;
            }
            localStorage.setItem('chat_username', currentUsername);
            
            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'history',
                        username: currentUsername
                    })
                });
                if (!response.ok) throw new Error("Failed to load history");
                
                const sessions = await response.json();
                sessionsMap.clear();
                
                const listContainer = document.getElementById('sessionsList');
                listContainer.innerHTML = '';
                
                sessions.forEach(session => {
                    sessionsMap.set(session.id, session);
                    
                    const item = document.createElement('div');
                    item.className = `session-item ${session.id === currentSessionId ? 'active' : ''}`;
                    item.id = `session-${session.id}`;
                    item.onclick = () => selectSession(session.id);
                    
                    const formattedDate = new Date(session.updated_at).toLocaleString();
                    
                    item.innerHTML = `
                        <div class="session-info">
                            <div class="session-title">${escapeHtml(session.title)}</div>
                            <div class="session-date">${formattedDate}</div>
                        </div>
                        <button class="btn-delete" onclick="deleteSession(event, '${session.id}')">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        </button>
                    `;
                    listContainer.appendChild(item);
                });
                
                if (autoSelect) {
                    if (currentSessionId && sessionsMap.has(currentSessionId)) {
                        await selectSession(currentSessionId);
                    } else if (sessions.length > 0) {
                        await selectSession(sessions[0].id);
                    } else {
                        startNewSession();
                    }
                }
            } catch (err) {
                console.error("Error retrieving history:", err);
                if (autoSelect) {
                    startNewSession();
                }
            }
        }

        async function selectSession(sessionId) {
            currentSessionId = sessionId;
            document.querySelectorAll('.session-item').forEach(el => el.classList.remove('active'));
            const activeEl = document.getElementById(`session-${sessionId}`);
            if (activeEl) activeEl.classList.add('active');
            
            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'history_session',
                        username: currentUsername,
                        session_id: sessionId
                    })
                });
                if (!response.ok) throw new Error("Failed to fetch session messages");
                const session = await response.json();
                
                document.getElementById('chatTitle').innerText = session.title || "Chat Session";
                document.getElementById('chatSubtitle').innerText = `Session ID: ${session.id}`;
                
                // Render session messages
                const container = document.getElementById('messagesContainer');
                container.innerHTML = '';
                
                if (session.messages && session.messages.length > 0) {
                    session.messages.forEach(msg => {
                        renderMessage(msg.role, msg.content, msg.sql, msg.result);
                    });
                } else {
                    container.innerHTML = `
                        <div class="empty-chat">
                            <div class="empty-icon">💬</div>
                            <div>No messages in this session yet.</div>
                        </div>
                    `;
                }
                scrollToBottom();
            } catch (err) {
                console.error("Error loading session:", err);
            }
        }

        function startNewSession() {
            currentSessionId = generateUUID();
            document.querySelectorAll('.session-item').forEach(el => el.classList.remove('active'));
            
            document.getElementById('chatTitle').innerText = "New Chat Session";
            document.getElementById('chatSubtitle').innerText = `Session ID: ${currentSessionId}`;
            
            const container = document.getElementById('messagesContainer');
            container.innerHTML = `
                <div class="empty-chat">
                    <div class="empty-icon">💬</div>
                    <div>This is a new conversation thread. Type your question below to begin.</div>
                </div>
            `;
            scrollToBottom();
        }

        async function deleteSession(event, sessionId) {
            event.stopPropagation();
            if (!confirm("Are you sure you want to delete this session?")) return;
            
            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'delete_session',
                        username: currentUsername,
                        session_id: sessionId
                    })
                });
                if (!response.ok) throw new Error("Delete failed");
                
                if (currentSessionId === sessionId) {
                    currentSessionId = "";
                }
                loadHistory();
            } catch (err) {
                alert("Failed to delete session.");
            }
        }

        async function clearAllHistory() {
            if (!confirm("Are you sure you want to clear ALL session history for this user? This cannot be undone.")) return;
            
            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'clear_history',
                        username: currentUsername
                    })
                });
                if (!response.ok) throw new Error("Clear failed");
                currentSessionId = "";
                loadHistory();
            } catch (err) {
                alert("Failed to clear history.");
            }
        }

        async function generateChart(msgId) {
            const data = window.__chartData[msgId];
            if (!data) return;
            
            const select = document.getElementById(`chart-type-${msgId}`);
            const type = select.value;
            const container = document.getElementById(`chart-container-${msgId}`);
            
            container.innerHTML = `<span class="loader" style="width: 20px; height: 20px; display: inline-block;"></span> <span>Generating ${type} chart...</span>`;
            
            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'chart',
                        username: currentUsername,
                        chart_type: type,
                        data: data
                    })
                });
                
                if (!response.ok) throw new Error("Chart generation failed");
                const resJson = await response.json();
                
                if (resJson.status === 'success' && resJson.svg) {
                    container.innerHTML = resJson.svg;
                } else {
                    container.innerHTML = `<div style="color: #ef4444;">Error: ${resJson.error || 'Unknown error'}</div>`;
                }
            } catch (err) {
                container.innerHTML = `<div style="color: #ef4444;">Failed to generate chart.</div>`;
            }
        }

        function renderMessage(role, text, sql = null, result = null) {
            const container = document.getElementById('messagesContainer');
            const msgId = 'msg_' + Date.now() + Math.random().toString(36).substr(2, 5);
            
            // Remove empty chat state if present
            const emptyState = container.querySelector('.empty-chat');
            if (emptyState) emptyState.remove();
            
            const row = document.createElement('div');
            row.className = `message-row ${role === 'user' ? 'user' : 'assistant'}`;
            
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            
            const textDiv = document.createElement('div');
            textDiv.className = 'bubble-text';
            textDiv.innerHTML = formatMarkdown(text);
            bubble.appendChild(textDiv);
            
            // If it is assistant and has SQL/Results, append details accordions
            if (role === 'assistant') {
                if (sql) {
                    const sqlDetails = document.createElement('details');
                    sqlDetails.innerHTML = `
                        <summary>
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
                            Generated SQL
                        </summary>
                        <div class="code-block">${escapeHtml(sql)}</div>
                    `;
                    bubble.appendChild(sqlDetails);
                }
                
                if (result) {
                    const resultDetails = document.createElement('details');
                    const isError = result.length > 0 && (result[0].status === 'failed' || result[0].status === 'cancelled');
                    
                    let resultHtml = "";
                    if (isError) {
                        const errorTitle = result[0].status === 'cancelled' ? 'Request Cancelled' : 'Execution Failure';
                        const cardStyle = result[0].status === 'cancelled' ? 'border-color: #f59e0b; color: #fcd34d; background: rgba(245, 158, 11, 0.1);' : '';
                        resultHtml = `
                            <summary style="color: #fca5a5;">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                                ${errorTitle}
                            </summary>
                            <div class="error-card" style="${cardStyle}">
                                <strong>Status:</strong> ${escapeHtml(result[0].error || 'Query execution failed')}
                            </div>
                        `;
                    } else {
                        resultHtml = `
                            <summary>
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line><line x1="3" y1="9" x2="21" y2="9"></line><line x1="3" y1="15" x2="21" y2="15"></line></svg>
                                Query Results (${result.length} rows)
                            </summary>
                            <div class="results-container">
                                ${renderTable(result)}
                            </div>
                        `;
                        
                        // Add chart UI for successful results
                        window.__chartData[msgId] = result;
                        resultHtml += `
                            <div style="margin-top: 12px; padding: 12px; background: rgba(15, 23, 42, 0.4); border-radius: 8px; border: 1px solid #334155;">
                                <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 12px;">
                                    <span style="font-size: 12px; color: #94a3b8;">Visualize:</span>
                                    <select id="chart-type-${msgId}" style="background: #111827; color: #f8fafc; border: 1px solid #374151; border-radius: 4px; padding: 4px 8px; font-size: 12px;">
                                        <option value="bar">Bar Chart</option>
                                        <option value="line">Line Chart</option>
                                        <option value="pie">Pie Chart</option>
                                        <option value="scatter">Scatter Plot</option>
                                    </select>
                                    <button onclick="generateChart('${msgId}')" class="btn btn-secondary" style="padding: 4px 10px; font-size: 11px;">Show Chart</button>
                                </div>
                                <div id="chart-container-${msgId}" style="display: flex; justify-content: center; overflow-x: auto; background: white; border-radius: 4px;"></div>
                            </div>
                        `;
                    }
                    resultDetails.innerHTML = resultHtml;
                    bubble.appendChild(resultDetails);
                }
            }
            
            row.appendChild(bubble);
            container.appendChild(row);
            scrollToBottom();
        }

        async function submitQuestion(event) {
            event.preventDefault();
            const inputEl = document.getElementById('questionInput');
            const question = inputEl.value.trim();
            if (!question) return;
            
            inputEl.value = '';
            
            if (!currentSessionId) {
                currentSessionId = generateUUID();
            }
            
            // Render user query bubble immediately
            renderMessage('user', question);
            
            const reqId = "req_" + Date.now();
            
            // Render loader spinner
            const container = document.getElementById('messagesContainer');
            const loadingRow = document.createElement('div');
            loadingRow.className = 'message-row assistant';
            loadingRow.id = 'loadingStateRow';
            loadingRow.innerHTML = `
                <div class="loading-state">
                    <span class="loader"></span>
                    <span>AI Agent is thinking and executing database tools...</span>
                    <button class="btn btn-secondary btn-danger" style="padding: 6px 12px; font-size: 11px; margin-left: 10px;" onclick="triggerCancel('${reqId}')">Cancel</button>
                </div>
            `;
            container.appendChild(loadingRow);
            scrollToBottom();
            
            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'ask',
                        question: question,
                        username: currentUsername,
                        session_id: currentSessionId,
                        request_id: reqId
                    })
                });
                
                if (!response.ok) throw new Error("Ask failed");
                
                // Read streaming response
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = "";
                
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                }
                
                // Clean up loader
                const loader = document.getElementById('loadingStateRow');
                if (loader) loader.remove();
                
                buffer = buffer.trim();
                const data = JSON.parse(buffer);
                
                // Render assistant response directly into the conversation
                let explanation = data.summary || "Here is the result of your query.";
                if (data.result && data.result.length > 0) {
                    if (data.result[0].status === 'failed') {
                        explanation = data.result[0].error || "The query execution failed.";
                    } else if (data.result[0].status === 'cancelled') {
                        explanation = "The request was cancelled.";
                    }
                }
                renderMessage('assistant', explanation, data.sql, data.result);
                
                // Refresh sidebar session list without wiping the active chat view
                await loadHistory(false);
                
            } catch (err) {
                console.error(err);
                const loader = document.getElementById('loadingStateRow');
                if (loader) loader.remove();
                renderMessage('assistant', "An error occurred while communicating with the agent server.", null, [{status: 'failed', error: err.message}]);
            }
        }

        async function triggerCancel(reqId) {
            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'cancel',
                        username: currentUsername,
                        request_id: reqId
                    })
                });
                const result = await response.json();
                console.log("Cancel triggered response:", result);
            } catch (err) {
                console.error("Failed to call /cancel:", err);
            }
        }

        function renderTable(rows) {
            if (!rows || rows.length === 0) return "<div style='padding: 12px; font-style: italic; color: #64748b;'>Empty results set</div>";
            
            const keys = Object.keys(rows[0]);
            let html = "<table class='results-table'><thead><tr>";
            keys.forEach(k => {
                html += `<th>${escapeHtml(k)}</th>`;
            });
            html += "</tr></thead><tbody>";
            
            rows.forEach(row => {
                html += "<tr>";
                keys.forEach(k => {
                    let val = row[k];
                    if (typeof val === 'object' && val !== null) {
                        val = JSON.stringify(val);
                    } else if (val === null) {
                        val = "<span style='color: #475569;'>NULL</span>";
                    }
                    html += `<td>${val}</td>`;
                });
                html += "</tr>";
            });
            html += "</tbody></table>";
            return html;
        }

        function scrollToBottom() {
            const container = document.getElementById('messagesContainer');
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(str) {
            if (typeof str !== 'string') return str;
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function formatMarkdown(text) {
            if (!text) return "";
            let escaped = escapeHtml(text);
            
            // Format bold text
            escaped = escaped.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
            escaped = escaped.replace(/\*(.*?)\*/g, "<em>$1</em>");
            
            // Format inline code
            escaped = escaped.replace(/`(.*?)`/g, "<code style='font-family: var(--font-mono); background-color: #090d16; padding: 2px 6px; border-radius: 4px; color: #38bdf8;'>$1</code>");
            
            return escaped;
        }
    </script>
</body>
</html>
