database: ap_community360
table: dim_facility_identifier
department: ap_community360
description: Crosswalk of every external code a facility is known by across source
  systems (UDISE+ code for a school, HMIS code for a hospital, AWC code for an anganwadi,
  ...). Kept separate from dim_facility instead of adding one column per source system,
  and separate from the per-type subtype tables since the same facility can accumulate
  identifiers from multiple systems over time, each with its own confidence/match
  provenance.
table_format: ICEBERG
location: hdfs://ap-datalake/CURATED/ap_community360/dim_facility_identifier
partitioned_by: null
tblproperties:
  engine.hive.enabled: 'true'
  external: 'true'
  parquet.compression: SNAPPY
  table_type: ICEBERG
  write.delete.mode: merge-on-read
  write.format.default: parquet
  write.merge.mode: merge-on-read
  write.update.mode: merge-on-read
source_file: ap_community360_canonical_schema.json
raw_ddl: "CREATE EXTERNAL TABLE `ap_community360`.`dim_facility_identifier`(\n  `facility_identifier_id`\
  \ BIGINT COMMENT 'Primary Key: identifier row.',\n  `canonical_facility_id` STRING\
  \ COMMENT 'FK to dim_facility.canonical_facility_id.',\n  `identifier_type` STRING\
  \ COMMENT 'What kind of identifier this is, e.g. \\'UDISE_CODE\\', \\'HMIS_CODE\\\
  ', \\'AWC_CODE\\'. [Value Examples: \\'UDISE_CODE\\', \\'HMIS_CODE\\', \\'AWC_CODE\\\
  ']',\n  `identifier_value_hash` STRING COMMENT 'Hashed identifier value \u2014 stored\
  \ hashed rather than plaintext since some source-system codes are treated as sensitive/internal.',\n\
  \  `id_class` STRING COMMENT 'Classification of the identifier, e.g. \\'govt\\'\
  \ | \\'internal\\' \u2014 informs which consumers are allowed to see/use it. [Value\
  \ Examples: \\'govt\\', \\'internal\\']',\n  `source_system` STRING COMMENT 'Upstream\
  \ system this identifier came from.',\n  `match_method` STRING COMMENT 'How this\
  \ identifier was linked to the facility, e.g. \\'exact\\' | \\'fuzzy\\' | \\'manual\\\
  ' \u2014 the entity-resolution method used. [Value Examples: \\'exact\\', \\'fuzzy\\\
  ', \\'manual\\']',\n  `confidence_score` DECIMAL(4,3) COMMENT 'Confidence (0-1)\
  \ that this identifier genuinely belongs to this facility, from the match_method\\\
  's resolution process.',\n  `valid_from` TIMESTAMP COMMENT 'Start of this identifier\
  \ mapping\\'s validity.',\n  `valid_to` TIMESTAMP COMMENT 'End of this identifier\
  \ mapping\\'s validity; NULL while active.',\n  `is_active` BOOLEAN COMMENT 'Boolean\
  \ flag. True if this identifier mapping is currently active.',\n  `source_batch_id`\
  \ STRING COMMENT 'Load batch that produced this identifier mapping.',\n  `load_ts`\
  \ TIMESTAMP COMMENT 'When this row was first written.',\n  `updated_ts` TIMESTAMP\
  \ COMMENT 'When this row was last updated.',\n  `record_status` STRING COMMENT 'Categorical\
  \ column. Distinct values: \\'Row lifecycle flag, e.g. \\'ACTIVE\\', \\'RETIRED\\\
  '.\\'. Row lifecycle flag, e.g. \\'ACTIVE\\' | \\'RETIRED\\'. [Value Examples: \\\
  'ACTIVE\\', \\'RETIRED\\']')\nROW FORMAT SERDE\n  'org.apache.iceberg.mr.hive.HiveIcebergSerDe'\n\
  STORED BY\n  'org.apache.iceberg.mr.hive.HiveIcebergStorageHandler'\n\nLOCATION\n\
  \  'hdfs://ap-datalake/CURATED/ap_community360/dim_facility_identifier'"
columns:
- name: facility_identifier_id
  type: BIGINT
  nullable: true
  description: 'Primary Key: identifier row.'
- name: canonical_facility_id
  type: STRING
  nullable: true
  description: FK to dim_facility.canonical_facility_id.
- name: identifier_type
  type: STRING
  nullable: true
  description: 'What kind of identifier this is, e.g. ''UDISE_CODE'', ''HMIS_CODE'',
    ''AWC_CODE''. [Value Examples: ''UDISE_CODE'', ''HMIS_CODE'', ''AWC_CODE'']'
  value_description: '[''UDISE_CODE'', ''AWC_CODE'']'
- name: identifier_value_hash
  type: STRING
  nullable: true
  description: "Hashed identifier value \u2014 stored hashed rather than plaintext\
    \ since some source-system codes are treated as sensitive/internal."
- name: id_class
  type: STRING
  nullable: true
  description: "Classification of the identifier, e.g. 'govt' | 'internal' \u2014\
    \ informs which consumers are allowed to see/use it. [Value Examples: 'govt',\
    \ 'internal']"
  value_description: '[''FACILITY'']'
- name: source_system
  type: STRING
  nullable: true
  description: Upstream system this identifier came from.
  value_description: '[''ap_citizen360.dim_school'', ''wcdsc_wdcw_schema_new.sp_anganwadi_master'']'
- name: match_method
  type: STRING
  nullable: true
  description: "How this identifier was linked to the facility, e.g. 'exact' | 'fuzzy'\
    \ | 'manual' \u2014 the entity-resolution method used. [Value Examples: 'exact',\
    \ 'fuzzy', 'manual']"
- name: confidence_score
  type: DECIMAL(4,3)
  nullable: true
  description: Confidence (0-1) that this identifier genuinely belongs to this facility,
    from the match_method's resolution process.
- name: valid_from
  type: TIMESTAMP
  nullable: true
  description: Start of this identifier mapping's validity.
- name: valid_to
  type: TIMESTAMP
  nullable: true
  description: End of this identifier mapping's validity; NULL while active.
- name: is_active
  type: BOOLEAN
  nullable: true
  description: Boolean flag. True if this identifier mapping is currently active.
  value_description: '[''True'']'
- name: source_batch_id
  type: STRING
  nullable: true
  description: Load batch that produced this identifier mapping.
- name: load_ts
  type: TIMESTAMP
  nullable: true
  description: When this row was first written.
- name: updated_ts
  type: TIMESTAMP
  nullable: true
  description: When this row was last updated.
- name: record_status
  type: STRING
  nullable: true
  description: 'Categorical column. Distinct values: ''Row lifecycle flag, e.g. ''ACTIVE'',
    ''RETIRED''.''. Row lifecycle flag, e.g. ''ACTIVE'' | ''RETIRED''. [Value Examples:
    ''ACTIVE'', ''RETIRED'']'
  value_description: '[''ACTIVE'']'
primary_key:
- facility_identifier_id
relationships:
- dim_facility_identifier.canonical_facility_id is a foreign key to dim_facility.canonical_facility_id.
business_terms:
- ap_community360
- facility_supertype
- dimension
- Hive
- Iceberg
- ICEBERG
common_operations:
- profile records in dim_facility_identifier
- join dim_facility_identifier to ap_community360.dim_geography via geography_id
- filter dim_facility_identifier by district_name or mandal_name
