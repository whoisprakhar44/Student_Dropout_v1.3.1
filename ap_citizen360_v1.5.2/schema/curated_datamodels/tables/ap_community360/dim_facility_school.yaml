database: ap_community360
table: dim_facility_school
department: ap_community360
description: School-specific attributes, aligned to the UDISE+ (Unified District Information System for Education Plus) national schema, so this table can be reconciled against the UDISE+ feed directly.
  One row per facility where dim_facility.facility_type_id resolves to the SCHOOL type; joined back to dim_facility on canonical_facility_id. Backs the school-medium/management critical filters in the Community
  360 UI.
table_format: ICEBERG
location: hdfs://ap-datalake/CURATED/ap_community360/dim_facility_school
partitioned_by: null
tblproperties:
  engine.hive.enabled: 'true'
  external: 'true'
  parquet.compression: SNAPPY
  table_type: ICEBERG
  write.delete.mode: merge-on-read
  write.format.default: parquet
  write.merge.mode: merge-on-read
  write.update.mode: merge-on-read
source_file: ap_community360_canonical_schema.json
raw_ddl: "CREATE EXTERNAL TABLE `ap_community360`.`dim_facility_school`(\n  `canonical_facility_id` STRING COMMENT 'Primary Key: FK to dim_facility.canonical_facility_id \u2014 one row per school facility.',\n\
  \  `udise_plus_code` STRING COMMENT 'National UDISE+ school code \u2014 the authoritative cross-system key for this school.',\n  `school_management` STRING COMMENT 'Who manages the school, e.g. \\'Government\\\
  ' | \\'Aided\\' | \\'Private Unaided\\' \u2014 one of the critical filter fields. [Value Examples: \\'Government\\', \\'Aided\\', \\'Private Unaided\\']',\n  `school_category` STRING COMMENT 'Categorical\
  \ column. Distinct values: \\'School category by level, e.g. \\'Primary\\', \\'High School\\'.\\'. School category by level, e.g. \\'Primary\\' | \\'High School\\'. [Value Examples: \\'Primary\\', \\\
  'High School\\']',\n  `lowest_class` INT COMMENT 'Categorical column. Distinct values: \\'Lowest class\\', \\'grade taught at this school.\\'. Lowest class/grade taught at this school.',\n  `highest_class`\
  \ INT COMMENT 'Categorical column. Distinct values: \\'Highest class\\', \\'grade taught at this school.\\'. Highest class/grade taught at this school.',\n  `board_affiliation` STRING COMMENT 'Examining\
  \ board the school is affiliated to, e.g. \\'State Board\\' | \\'CBSE\\'. [Value Examples: \\'State Board\\', \\'CBSE\\']',\n  `medium_of_instruction` STRING COMMENT 'Primary teaching language, e.g. \\\
  'Telugu\\' | \\'English\\' | \\'Urdu\\' | \\'Bilingual\\' \u2014 the other critical filter field. [Value Examples: \\'Telugu\\', \\'English\\', \\'Urdu\\', \\'Bilingual\\']',\n  `gender_type` STRING COMMENT\
  \ 'Categorical column. Distinct values: \\'Student intake policy: \\'Co-Ed\\', \\'Boys\\', \\'Girls\\'.\\'. Student intake policy: \\'Co-Ed\\' | \\'Boys\\' | \\'Girls\\'.',\n  `total_students` INT COMMENT\
  \ 'Total enrolled students.',\n  `total_boys` INT COMMENT 'Enrolled boys count.',\n  `total_girls` INT COMMENT 'Enrolled girls count.',\n  `total_teachers` INT COMMENT 'Teachers currently in position.',\n\
  \  `sanctioned_teachers` INT COMMENT 'Sanctioned teacher posts (may exceed total_teachers where there\\'s a staffing gap).',\n  `student_teacher_ratio` DECIMAL(6,2) COMMENT 'Categorical column. Distinct\
  \ values: \\'Students per teacher\\', \\'a standard school-quality indicator.\\'. Students per teacher \u2014 a standard school-quality indicator.',\n  `total_classrooms` INT COMMENT 'Total classrooms\
  \ in the building.',\n  `classrooms_good_condition` INT COMMENT 'Classrooms rated in good structural condition.',\n  `building_status` STRING COMMENT 'Categorical column. Distinct values: \\'Overall building\
  \ condition, e.g. \\'Good\\', \\'Needs Repair\\'.\\'. Overall building condition, e.g. \\'Good\\' | \\'Needs Repair\\'. [Value Examples: \\'Good\\', \\'Needs Repair\\']',\n  `has_electricity` BOOLEAN\
  \ COMMENT 'Boolean flag. True if the school has an electricity connection.',\n  `has_drinking_water` BOOLEAN COMMENT 'Boolean flag. True if safe drinking water is available.',\n  `has_boys_toilet` BOOLEAN\
  \ COMMENT 'Boolean flag. True if a boys\\' toilet facility exists.',\n  `has_girls_toilet` BOOLEAN COMMENT 'Boolean flag. True if a girls\\' toilet facility exists.',\n  `has_cwsn_toilet` BOOLEAN COMMENT\
  \ 'Boolean flag. True if a toilet accessible to children with special needs exists.',\n  `has_ramp` BOOLEAN COMMENT 'Boolean flag. True if a wheelchair ramp exists.',\n  `has_library` BOOLEAN COMMENT\
  \ 'Boolean flag. True if the school has a library.',\n  `has_computer_lab` BOOLEAN COMMENT 'Boolean flag. True if the school has a computer lab.',\n  `has_smart_classroom` BOOLEAN COMMENT 'Boolean flag.\
  \ True if at least one smart/digital classroom exists.',\n  `has_playground` BOOLEAN COMMENT 'Boolean flag. True if a playground exists.',\n  `has_boundary_wall` BOOLEAN COMMENT 'Boolean flag. True if\
  \ the campus has a boundary wall.',\n  `has_midday_meal` BOOLEAN COMMENT 'Boolean flag. True if the school serves the midday meal scheme.',\n  `internet_available` BOOLEAN COMMENT 'Boolean flag. True\
  \ if internet connectivity is available at the school.',\n  `academic_session` STRING COMMENT 'Academic year these figures were captured for, e.g. \\'2025-26\\'. [Value Examples: \\'2025-26\\']',\n  `source_system`\
  \ STRING COMMENT 'Upstream system this row was loaded from, e.g. \\'udise_plus\\', \\'hmis\\', \\'seed\\'. [Value Examples: \\'udise_plus\\', \\'hmis\\', \\'seed\\']',\n  `batch_id` STRING COMMENT 'Load\
  \ batch identifier \u2014 groups every row written by the same ingestion run, for reprocessing/rollback.',\n  `load_ts` TIMESTAMP COMMENT 'When this row was first written to the canonical table.',\n \
  \ `updated_ts` TIMESTAMP COMMENT 'Categorical column. Distinct values: \\'When this row was last updated (upsert\\', \\'merge timestamp).\\'. When this row was last updated (upsert/merge timestamp).',\n\
  \  `record_status` STRING COMMENT 'Row lifecycle flag, e.g. \\'ACTIVE\\' | \\'RETIRED\\' \u2014 soft-delete marker; rows are never hard-deleted. [Value Examples: \\'ACTIVE\\', \\'RETIRED\\']')\nROW FORMAT\
  \ SERDE\n  'org.apache.iceberg.mr.hive.HiveIcebergSerDe'\nSTORED BY\n  'org.apache.iceberg.mr.hive.HiveIcebergStorageHandler'\n\nLOCATION\n  'hdfs://ap-datalake/CURATED/ap_community360/dim_facility_school'"
