database: ap_citizen360
table: dim_student
department: ap_citizen360
description: One row per person PER education level reached (Primary/Secondary/Intermediate/Polytechnic/Degree/PostGraduate)
  — so a person's full education history is retrievable, not just their latest/highest
  level.
table_format: ICEBERG
location: hdfs://ap-datalake/CURATED/ap_citizen360/dim_student
tblproperties:
  engine.hive.enabled: 'true'
  external: 'true'
  parquet.compression: SNAPPY
  table_type: ICEBERG
  write.delete.mode: merge-on-read
  write.format.default: parquet
  write.merge.mode: merge-on-read
  write.update.mode: merge-on-read
source_file: citizen360_canonical_schema.json
raw_ddl: |
  CREATE EXTERNAL TABLE `ap_citizen360`.`dim_student`(
    `student_record_id` STRING,
    `person_id` STRING,
    `education_level` STRING,
    `highest_qualification` STRING,
    `institution_id` STRING,
    `institution_code` STRING,
    `school_name` STRING,
    `education_board` STRING,
    `class_currently_enrolled` INT,
    `academic_year` STRING,
    `is_current_level` BOOLEAN,
    `is_dropout` BOOLEAN,
    `dropout_reason` STRING,
    `medium_of_instruction` STRING,
    `aadhaar_seeded` BOOLEAN,
    `has_apaar_id` BOOLEAN,
    `apaar_id` STRING,
    `student_id` STRING,
    `aposs_id` STRING,
    `epass_id` STRING,
    `epass_amount` DECIMAL(10,2),
    `thalliki_vandanam` BOOLEAN,
    `ntr_vidya_deevena` BOOLEAN,
    `pre_matric_scholarship` BOOLEAN,
    `post_matric_scholarship` BOOLEAN,
    `digital_literacy_level` STRING,
    `updated_at` TIMESTAMP,
    `student_pen` STRING
  )
columns:
- name: student_record_id
  type: STRING
  nullable: true
  description: Canonical identifier for this education-level record.
- name: person_id
  type: STRING
  nullable: true
  description: Foreign key to dim_person.person_id.
- name: education_level
  type: STRING
  nullable: true
  description: 'Normalized education tier this record represents — Primary / Secondary
    / Intermediate / Polytechnic / Degree / PostGraduate. This is what eligibility
    filters match against (not highest_qualification). [Value Examples: ''Secondary'',
    ''Primary'', ''Intermediate'', ''NA'']'
  distinct:
  - Secondary
  - Primary
  - Intermediate
- name: highest_qualification
  type: STRING
  nullable: true
  description: 'Free-text specific qualification within this level, e.g. ''10th Class'',
    ''B.Tech (CSE)'', ''M.Tech'' — finer-grained detail than education_level. [Value
    Examples: ''13'', ''11'', ''10'', ''9'', ''8'', ''7'']'
  distinct:
  - '13'
  - '11'
  - '10'
  - '9'
  - '8'
  - '7'
  - '12'
  - '6'
  - '5'
  - '4'
  - '3'
  - '2'
  - '1'
  - '-2'
  - '-3'
  - '0'
- name: institution_id
  type: STRING
  nullable: true
  description: Canonical identifier of the educational institution attended.
- name: institution_code
  type: STRING
  nullable: true
  description: Government-assigned code for the institution (e.g. UDISE code for schools).
- name: school_name
  type: STRING
  nullable: true
  description: Name of the school/college/institution attended.
- name: education_board
  type: STRING
  nullable: true
  description: Examining board/university for this level, e.g. 'BSEAP', 'AP State
    Board'.
- name: class_currently_enrolled
  type: INT
  nullable: true
  description: 'Class/grade currently enrolled in, for ongoing levels. [Value Examples:
    ''10'', ''7'', ''8'', ''9'', ''6'', ''5'']'
  distinct:
  - '10'
  - '7'
  - '8'
  - '9'
  - '6'
  - '5'
  - '11'
  - '4'
  - '13'
  - '3'
  - '2'
  - '1'
  - '12'
  - '-2'
  - '-3'
  - '0'
- name: academic_year
  type: STRING
  nullable: true
  description: 'Academic year this record pertains to. [Value Examples: ''2026-27'',
    ''2025-26'', ''2024-25'', ''2023-24'', ''2022-23'', ''N'']'
  distinct:
  - 2026-27
  - 2025-26
  - 2024-25
  - 2023-24
  - 2022-23
  - N
- name: is_current_level
  type: BOOLEAN
  nullable: true
  description: 'True if this is the person''s currently active education level among
    possibly several historical records. [Value Examples: ''False'', ''True'']'
  distinct:
  - 'False'
  - 'True'
- name: is_dropout
  type: BOOLEAN
  nullable: true
  description: 'True if the person dropped out at this education level without completing
    it. [Value Examples: ''False'', ''True'']'
  distinct:
  - 'False'
  - 'True'
- name: dropout_reason
