primary_key:
- student_record_id
relationships:
- dim_student.person_id is a foreign key to dim_person.person_id.
business_terms:
- ap_citizen360
- education
- dimension
- Hive
- Iceberg
- ICEBERG
common_operations:
- profile records in dim_student
- join dim_student to dim_person via person_id
- filter dim_student by district_id or mandal_id
