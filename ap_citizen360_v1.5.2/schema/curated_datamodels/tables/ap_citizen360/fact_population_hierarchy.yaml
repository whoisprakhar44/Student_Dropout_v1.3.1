database: ap_citizen360
table: fact_population_hierarchy
department: ap_citizen360
description: "Pre-aggregated population pyramid cells \u2014 population, household,\
  \ and ration-card counts broken down by geography, gender, and social category.\
  \ Backs the Population Hierarchy / demographic pyramid views without aggregating\
  \ dim_person at query time."
table_format: ICEBERG
location: hdfs://ap-datalake/CURATED/ap_citizen360/fact_population_hierarchy
partitioned_by: null
tblproperties:
  engine.hive.enabled: 'true'
  external: 'true'
  parquet.compression: SNAPPY
  table_type: ICEBERG
  write.delete.mode: merge-on-read
  write.format.default: parquet
  write.merge.mode: merge-on-read
  write.update.mode: merge-on-read
source_file: citizen360_canonical_schema.json
raw_ddl: "CREATE EXTERNAL TABLE `ap_citizen360`.`fact_population_hierarchy`(\n  `geo_level`\
  \ STRING COMMENT 'Primary Key: state | district | mandal | village.',\n  `geo_id`\
  \ STRING COMMENT 'Primary Key: ap | district_id | mandal_id | village_name \u2014\
  \ the identifier appropriate to geo_level.',\n  `gender` STRING COMMENT 'Primary\
  \ Key: Male | Female | Others.',\n  `social_category` STRING COMMENT 'Primary Key:\
  \ OC | BC | SC | ST | Others.',\n  `population_count` BIGINT COMMENT 'Census population\
  \ for this geography/gender/category cell.',\n  `household_count` BIGINT COMMENT\
  \ 'Number of households headed by this gender/category in this geography.',\n  `ration_card_count`\
  \ BIGINT COMMENT 'NFSA ration card holders in this gender/category cell.')\nROW\
  \ FORMAT SERDE\n  'org.apache.iceberg.mr.hive.HiveIcebergSerDe'\nSTORED BY\n  'org.apache.iceberg.mr.hive.HiveIcebergStorageHandler'\n\
  \nLOCATION\n  'hdfs://ap-datalake/CURATED/ap_citizen360/fact_population_hierarchy'"
columns:
- name: geo_level
  type: STRING
  nullable: true
  description: 'Primary Key: state | district | mandal | village.'
  value_description: '[''village'', ''mandal'', ''district'', ''state'']'
- name: geo_id
  type: STRING
  nullable: true
  description: "Primary Key: ap | district_id | mandal_id | village_name \u2014 the\
    \ identifier appropriate to geo_level."
- name: gender
  type: STRING
  nullable: true
  description: 'Primary Key: Male | Female | Others.'
  value_description: '[''Female'', ''Male'', ''Others'']'
- name: social_category
  type: STRING
  nullable: true
  description: 'Primary Key: OC | BC | SC | ST | Others.'
  value_description: '[''Others'', ''BC'', ''SC'', ''OC'', ''ST'']'
- name: population_count
  type: BIGINT
  nullable: true
  description: Census population for this geography/gender/category cell.
- name: household_count
  type: BIGINT
  nullable: true
  description: Number of households headed by this gender/category in this geography.
- name: ration_card_count
  type: BIGINT
  nullable: true
  description: NFSA ration card holders in this gender/category cell.
primary_key:
- geo_level
- geo_id
- gender
- social_category
relationships: []
business_terms:
- ap_citizen360
- population_and_utility_trends
- fact
- Hive
- Iceberg
- ICEBERG
common_operations:
- aggregate measures in fact_population_hierarchy by geography and time period
- join fact_population_hierarchy with dimension tables via facility_id or person_id
- filter fact_population_hierarchy by district_id or period_date
