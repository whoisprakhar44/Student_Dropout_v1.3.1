database: ap_citizen360
table: dim_person
department: ap_citizen360
description: The core citizen record — one row per person. Every other dim_*/fact_*
  table that describes an individual (vehicles, land, health, education, ...) joins
  back to this table via person_id. Backs the Citizen 360 profile view and is the
  default-join target for every Citizen Dimension Data API lookup. Occupation type
  and sector live in dim_occupation (not denormalized here).
table_format: ICEBERG
location: hdfs://ap-datalake/CURATED/ap_citizen360/dim_person
partitioned_by: district_id
tblproperties:
  engine.hive.enabled: 'true'
  external: 'true'
  parquet.compression: SNAPPY
  table_type: ICEBERG
  write.delete.mode: merge-on-read
  write.format.default: parquet
  write.merge.mode: merge-on-read
  write.update.mode: merge-on-read
source_file: citizen360_canonical_schema.json
raw_ddl: |
  CREATE EXTERNAL TABLE `ap_citizen360`.`dim_person`(
    `person_id` STRING,
    `person_name` STRING,
    `age` INT,
    `date_of_birth` DATE,
    `gender` STRING,
    `social_category` STRING,
    `phone` STRING,
    `income_band` STRING,
    `dwelling_type` STRING,
    `address` STRING,
    `district_id` STRING,
    `mandal_id` STRING,
    `village_name` STRING,
    `household_id` STRING,
    `created_at` TIMESTAMP,
    `updated_at` TIMESTAMP,
    `religion` STRING,
    `caste_name` STRING,
    `caste_derived_flag` BOOLEAN,
    `caste_base_certificate_no` STRING,
    `door_no` STRING,
    `secretariat_code` STRING,
    `constituency_code` STRING,
    `rural_urban_flag` STRING,
    `cluster_id` STRING,
    `domicile_status` BOOLEAN,
    `marital_status` STRING,
    `govt_employment_type` STRING,
    `is_deceased` STRING,
    `father_name` STRING,
    `father_person_id` STRING,
    `mother_name` STRING,
    `mother_person_id` STRING,
    `husband_name` STRING,
    `husband_person_id` STRING,
    `ration_card_no` BIGINT,
    `disability_type` STRING,
    `disability_percentage` INT,
    `disability_status` STRING
  )
columns:
- name: person_id
  type: STRING
  nullable: true
  description: 'Canonical citizen identifier, persistent across all source updates.
    Primary source: Citizen Register of Andhra Pradesh (CR-AP); falls back to UIDAI
    Aadhaar seeding records when no CR-AP record exists.'
- name: person_name
  type: STRING
  nullable: true
  description: 'Full legal name. Primary source: CR-AP; falls back to UIDAI Aadhaar
    authentication response, then EPDS ration card beneficiary name.'
- name: age
  type: INT
  nullable: true
  description: Current age in years — derived from date_of_birth at query time, not
    stored as a static value.
- name: date_of_birth
  type: DATE
  nullable: true
  description: Date of birth, as registered in the birth certificate or Aadhaar record.
- name: gender
  type: STRING
  nullable: true
  description: 'Male / Female / Others. [Value Examples: ''Female'', ''Male'', ''Transgender'',
    ''Others'']'
  distinct:
  - Female
  - Male
  - Transgender
  - Others
- name: social_category
  type: STRING
  nullable: true
  description: 'Social category for reservation/welfare purposes — OC / BC / SC /
    ST / Others. [Value Examples: ''BC'', ''OC'', ''SC'', ''ST'']'
  distinct:
  - BC
  - OC
  - SC
  - ST
- name: phone
  type: STRING
  nullable: true
  description: Primary contact mobile number.
- name: income_band
  type: STRING
  nullable: true
  description: 'Household income bracket the person falls into (e.g. ''Below ₹1.5L'',
    ''₹1.5L – ₹3L'') — used for scheme eligibility filtering. [Value Examples: ''0–1L'',
    ''>?5L'', ''?1L–?3L'', ''?3L–?5L'', ''1L–3L'', ''?0–?1L'', ''3L–5L'', ''>5L'']'
- name: dwelling_type
  type: STRING
  nullable: true
  description: 'Housing tenure and construction quality, e.g. ''Own House – Pucca'',
    ''Rented Apartment''. [Value Examples: ''Puccahouse-Daba'', ''RCChouse'', ''Pakkahouse'',
    ''Foilhouse'', ''Kacchahouse'', ''Shells'']'
  distinct:
  - Puccahouse-Daba
  - RCChouse
  - Pakkahouse
  - Foilhouse
  - Kacchahouse
  - Shells
  - Flat
  - Duplexhouse
- name: address
  type: STRING
  nullable: true
  description: Free-text postal address.
- name: district_id
  type: STRING
  nullable: true
  description: Foreign key to dim_district.district_id — the person's current district
    of residence.
- name: mandal_id
  type: STRING
  nullable: true
  description: Foreign key to dim_mandal.mandal_id — the person's current mandal of
    residence.
- name: village_name
  type: STRING
  nullable: true
  description: The person's current village/habitation of residence (denormalized
    text, not a village_id FK).
- name: household_id
  type: STRING
  nullable: true
  description: Foreign key to dim_household.household_id — the household this person
    belongs to.
- name: created_at
  type: TIMESTAMP
  nullable: true
  description: Timestamp the canonical row was first created.
- name: updated_at
  type: TIMESTAMP
  nullable: true
  description: Timestamp the canonical row was last updated by any source — used for
    asOf incremental-sync filters.
- name: religion
  type: STRING
  nullable: true
  description: 'Religion as self-declared/registered. [Value Examples: ''Hindu'',
    ''Islam'', ''Christian'', ''Muslim'', ''No Religion'', ''Other Religion'']'
  distinct:
  - Hindu
  - Islam
  - Christian
  - Muslim
  - No Religion
  - Other Religion
  - Jain
  - Others
  - Sikh
  - Buddhist
  - Animist
  - Volunteer C15
