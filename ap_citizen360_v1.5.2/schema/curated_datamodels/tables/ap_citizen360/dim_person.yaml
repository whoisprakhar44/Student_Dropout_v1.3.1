- name: caste_derived_flag
  type: BOOLEAN
  nullable: true
  description: 'True if caste_name was derived/inferred rather than directly certified.
    [Value Examples: ''False'', ''True'']'
  distinct:
  - 'False'
  - 'True'
- name: caste_base_certificate_no
  type: STRING
  nullable: true
  description: Certificate number of the underlying caste certificate this record
    is based on.
- name: door_no
  type: STRING
  nullable: true
  description: Door/house number component of the residential address.
- name: secretariat_code
  type: STRING
  nullable: true
  description: Gram/Ward Sachivalayam administrative unit code — sits between mandal
    and village/habitation in AP's local-governance hierarchy.
- name: constituency_code
  type: STRING
  nullable: true
  description: Electoral assembly constituency code covering the person's residence.
- name: rural_urban_flag
  type: STRING
  nullable: true
  description: 'Whether the residence is classified Rural or Urban. [Value Examples:
    ''R'', ''U'']'
  distinct:
  - R
  - U
- name: cluster_id
  type: STRING
  nullable: true
  description: Local administrative cluster grouping (sub-mandal), used for some welfare-scheme
    targeting.
- name: domicile_status
  type: BOOLEAN
  nullable: true
  description: 'True if the person holds confirmed AP domicile status. [Value Examples:
    ''True'']'
  distinct:
  - 'True'
- name: marital_status
  type: STRING
  nullable: true
  description: 'Current marital status. Resolved by latest status_date across sources,
    with source priority as the tie-breaker on equal dates. [Value Examples: ''Married'',
    ''Single'', ''Unmarried'', ''Widowed'', ''Widow'', ''Widower'']'
  distinct:
  - Married
  - Single
  - Unmarried
  - Widowed
  - Widow
  - Widower
  - Divorced
  - Separated
  - Single woman
- name: govt_employment_type
  type: STRING
  nullable: true
  description: 'None | Active Govt Employee | Pensioner | Contractual — distinct from
    the broader employment_status field, specifically tracking government-sector employment
    for pension/benefit eligibility. [Value Examples: ''Regular'', ''Pensioner'',
    ''Contract'']'
  distinct:
  - Regular
  - Pensioner
  - Contract
- name: is_deceased
  type: STRING
  nullable: true
  description: 'Deceased flag as stored in production (STRING). Typical values: true/false
    or Y/N. [Value Examples: ''False'', ''True'']'
  distinct:
  - 'False'
  - 'True'
- name: father_name
  type: STRING
  nullable: true
  description: Father's name, as registered.
- name: father_person_id
  type: STRING
  nullable: true
  description: Foreign key to dim_person.person_id for the father, when the father
    is also a known canonical citizen.
- name: mother_name
  type: STRING
  nullable: true
  description: Mother's name, as registered.
- name: mother_person_id
  type: STRING
  nullable: true
  description: Foreign key to dim_person.person_id for the mother, when the mother
    is also a known canonical citizen.
- name: husband_name
  type: STRING
  nullable: true
  description: Husband's name, where applicable (e.g. for widow-pension eligibility
    checks).
- name: husband_person_id
  type: STRING
  nullable: true
  description: Foreign key to dim_person.person_id for the husband, when the husband
    is also a known canonical citizen.
- name: ration_card_no
  type: BIGINT
  nullable: true
  description: NFSA ration card number on dim_person (BIGINT). App reads ration card
    from dim_person.ration_card_no only — not dim_household.
- name: disability_type
  type: STRING
  nullable: true
  description: 'Disability type on the person record (also mirrored on dim_social_welfare
    where applicable). [Value Examples: ''Locomotor'', ''Visual Impairment'', ''Mental
    Retardness'', ''Hearing'', ''Mental Illness'', ''Multiple Illness'']'
  distinct:
  - Locomotor
  - Visual Impairment
  - Mental Retardness
  - Hearing
  - Mental Illness
  - Multiple Illness
- name: disability_percentage
  type: INT
  nullable: true
  description: Certified disability percentage (0–100).
- name: disability_status
  type: STRING
  nullable: true
  description: 'Disability certification status, e.g. Certified / Self-declared. [Value
    Examples: ''Permanent'', ''Temporary for 2'', ''Temporary for 1'', ''Temporary
    for 5'', ''Temporary for 3'', ''Temporary for 4'']'
  distinct:
  - Permanent
  - Temporary for 2
  - Temporary for 1
  - Temporary for 5
  - Temporary for 3
  - Temporary for 4
primary_key:
- person_id
relationships:
- dim_person.district_id is a foreign key to dim_district.district_id.
- dim_person.mandal_id is a foreign key to dim_mandal.mandal_id.
- dim_person.household_id is a foreign key to dim_household.household_id.
- dim_person.father_person_id is a foreign key to dim_person.person_id.
- dim_person.mother_person_id is a foreign key to dim_person.person_id.
- dim_person.husband_person_id is a foreign key to dim_person.person_id.
business_terms:
- ap_citizen360
- person___household___identity
- dimension
- Hive
- Iceberg
- ICEBERG
common_operations:
- profile records in dim_person
- join dim_person to dim_person via person_id
- filter dim_person by district_id or mandal_id
