database: ap_citizen360
table: dim_person
department: ap_citizen360
description: The core citizen record — one row per person. Every other dim_*/fact_* table that describes an individual (vehicles,
  land, health, education, ...) joins back to this table via person_id. Backs the Citizen 360 profile view and is the default-join
  target for every Citizen Dimension Data API lookup. Occupation type and sector live in dim_occupation (not denormalized
  here).
table_format: ICEBERG
location: hdfs://ap-datalake/CURATED/ap_citizen360/dim_person
partitioned_by: district_id
tblproperties:
  engine.hive.enabled: 'true'
  external: 'true'
  parquet.compression: SNAPPY
  table_type: ICEBERG
  write.delete.mode: merge-on-read
  write.format.default: parquet
  write.merge.mode: merge-on-read
  write.update.mode: merge-on-read
source_file: citizen360_canonical_schema.json
raw_ddl: "CREATE EXTERNAL TABLE `ap_citizen360`.`dim_person`(\n  `person_id` STRING COMMENT 'Canonical citizen identifier,\
  \ persistent across all source updates. Primary source: Citizen Register of Andhra Pradesh (CR-AP); falls back to UIDAI\
  \ Aadhaar seeding records when no CR-AP record exists.',\n  `person_name` STRING COMMENT 'Full legal name. Primary source:\
  \ CR-AP; falls back to UIDAI Aadhaar authentication response, then EPDS ration card beneficiary name.',\n  `age` INT COMMENT\
  \ 'Current age in years — derived from date_of_birth at query time, not stored as a static value.',\n  `date_of_birth` DATE\
  \ COMMENT 'Date of birth, as registered in the birth certificate or Aadhaar record.',\n  `gender` STRING COMMENT 'Male /\
  \ Female / Others. [Value Examples: \\'Female\\', \\'Male\\', \\'Transgender\\', \\'Others\\']',\n  `social_category` STRING\
  \ COMMENT 'Social category for reservation/welfare purposes — OC / BC / SC / ST / Others. [Value Examples: \\'BC\\', \\\
  'OC\\', \\'SC\\', \\'ST\\']',\n  `phone` STRING COMMENT 'Primary contact mobile number.',\n  `income_band` STRING COMMENT\
  \ 'Household income bracket the person falls into (e.g. \\'Below ₹1.5L\\', \\'₹1.5L – ₹3L\\') — used for scheme eligibility\
  \ filtering. [Value Examples: \\'0–1L\\', \\'>?5L\\', \\'?1L–?3L\\', \\'?3L–?5L\\', \\'1L–3L\\', \\'?0–?1L\\', \\'3L–5L\\\
  ', \\'>5L\\']',\n  `dwelling_type` STRING COMMENT 'Housing tenure and construction quality, e.g. \\'Own House – Pucca\\\
  ', \\'Rented Apartment\\'. [Value Examples: \\'Puccahouse-Daba\\', \\'RCChouse\\', \\'Pakkahouse\\', \\'Foilhouse\\', \\\
  'Kacchahouse\\', \\'Shells\\', \\'Flat\\', \\'Duplexhouse\\']',\n  `address` STRING COMMENT 'Free-text postal address.',\n\
  \  `district_id` STRING COMMENT 'Foreign key to dim_district.district_id — the person\\'s current district of residence.',\n\
  \  `mandal_id` STRING COMMENT 'Foreign key to dim_mandal.mandal_id — the person\\'s current mandal of residence.',\n  `village_name`\
  \ STRING COMMENT 'The person\\'s current village/habitation of residence (denormalized text, not a village_id FK).',\n \
  \ `household_id` STRING COMMENT 'Foreign key to dim_household.household_id — the household this person belongs to.',\n \
  \ `created_at` TIMESTAMP COMMENT 'Timestamp the canonical row was first created.',\n  `updated_at` TIMESTAMP COMMENT 'Timestamp\
  \ the canonical row was last updated by any source — used for asOf incremental-sync filters.',\n  `religion` STRING COMMENT\
  \ 'Religion as self-declared/registered. [Value Examples: \\'Hindu\\', \\'Islam\\', \\'Christian\\', \\'Muslim\\', \\'No\
  \ Religion\\', \\'Other Religion\\', \\'Jain\\', \\'Others\\', \\'Sikh\\', \\'Buddhist\\']',\n  `caste_name` STRING COMMENT\
  \ 'Specific caste/sub-caste detail, complementing the broader social_category (OC/BC/SC/ST) classification.',\n  `caste_derived_flag`\
  \ BOOLEAN COMMENT 'True if caste_name was derived/inferred rather than directly certified. [Value Examples: \\'False\\',\
  \ \\'True\\']',\n  `caste_base_certificate_no` STRING COMMENT 'Certificate number of the underlying caste certificate this\
  \ record is based on.',\n  `door_no` STRING COMMENT 'Door/house number component of the residential address.',\n  `secretariat_code`\
  \ STRING COMMENT 'Gram/Ward Sachivalayam administrative unit code — sits between mandal and village/habitation in AP\\'s\
  \ local-governance hierarchy.',\n  `constituency_code` STRING COMMENT 'Electoral assembly constituency code covering the\
  \ person\\'s residence.',\n  `rural_urban_flag` STRING COMMENT 'Whether the residence is classified Rural or Urban. [Value\
  \ Examples: \\'R\\', \\'U\\']',\n  `cluster_id` STRING COMMENT 'Local administrative cluster grouping (sub-mandal), used\
  \ for some welfare-scheme targeting.',\n  `domicile_status` BOOLEAN COMMENT 'True if the person holds confirmed AP domicile\
  \ status. [Value Examples: \\'True\\']',\n  `marital_status` STRING COMMENT 'Current marital status. Resolved by latest\
  \ status_date across sources, with source priority as the tie-breaker on equal dates. [Value Examples: \\'Married\\', \\\
  'Single\\', \\'Unmarried\\', \\'Widowed\\', \\'Widow\\', \\'Widower\\', \\'Divorced\\', \\'Separated\\', \\'Single woman\\\
  ']',\n  `govt_employment_type` STRING COMMENT 'None | Active Govt Employee | Pensioner | Contractual — distinct from the\
  \ broader employment_status field, specifically tracking government-sector employment for pension/benefit eligibility. [Value\
  \ Examples: \\'None\\', \\'Regular\\', \\'Pensioner\\', \\'Contract\\']',\n  `is_deceased` STRING COMMENT 'Deceased flag\
  \ as stored in production (STRING). Typical values: true/false or Y/N. [Value Examples: \\'False\\', \\'True\\']',\n  `father_name`\
  \ STRING COMMENT 'Father\\'s name, as registered.',\n  `father_person_id` STRING COMMENT 'Foreign key to dim_person.person_id\
  \ for the father, when the father is also a known canonical citizen.',\n  `mother_name` STRING COMMENT 'Mother\\'s name,\
  \ as registered.',\n  `mother_person_id` STRING COMMENT 'Foreign key to dim_person.person_id for the mother, when the mother\
  \ is also a known canonical citizen.',\n  `husband_name` STRING COMMENT 'Husband\\'s name, where applicable (e.g. for widow-pension\
  \ eligibility checks).',\n  `husband_person_id` STRING COMMENT 'Foreign key to dim_person.person_id for the husband, when\
  \ the husband is also a known canonical citizen.',\n  `ration_card_no` BIGINT COMMENT 'NFSA ration card number on dim_person\
  \ (BIGINT). App reads ration card from dim_person.ration_card_no only — not dim_household.',\n  `disability_type` STRING\
  \ COMMENT 'Disability type on the person record (also mirrored on dim_social_welfare where applicable). [Value Examples:\
  \ \\'Locomotor\\', \\'Visual Impairment\\', \\'Mental Retardness\\', \\'Hearing\\', \\'Mental Illness\\', \\'Multiple Illness\\\
  ']',\n  `disability_percentage` INT COMMENT 'Certified disability percentage (0–100).',\n  `disability_status` STRING COMMENT\
  \ 'Disability certification status, e.g. Certified / Self-declared. [Value Examples: \\'Permanent\\', \\'Temporary for 2\\\
  ', \\'Temporary for 1\\', \\'Temporary for 5\\', \\'Temporary for 3\\', \\'Temporary for 4\\']'\n)\nROW FORMAT SERDE\n \
  \ 'org.apache.iceberg.mr.hive.HiveIcebergSerDe'\nSTORED BY\n  'org.apache.iceberg.mr.hive.HiveIcebergStorageHandler'\nLOCATION\n\
  \  'hdfs://ap-datalake/CURATED/ap_citizen360/dim_person'\nPARTITIONED BY (district_id)"
