database: ap_citizen360
table: dim_vehicle
department: ap_citizen360
description: One row per vehicle owned — identity/registration details. 
  Compliance/regulatory status (insurance, fitness, permits, challans) is split 
  out into dim_vehicle_compliance to keep slow-changing compliance data separate
  from largely-static identity data.
table_format: ICEBERG
location: hdfs://ap-datalake/CURATED/ap_citizen360/dim_vehicle
tblproperties:
  engine.hive.enabled: 'true'
  external: 'true'
  parquet.compression: SNAPPY
  table_type: ICEBERG
  write.delete.mode: merge-on-read
  write.format.default: parquet
  write.merge.mode: merge-on-read
  write.update.mode: merge-on-read
source_file: citizen360_canonical_schema.json
raw_ddl: "CREATE EXTERNAL TABLE `ap_citizen360`.`dim_vehicle`(\n  `vehicle_id` STRING
  COMMENT 'Canonical vehicle identifier.',\n  `person_id` STRING COMMENT 'Foreign
  key to dim_person.person_id — the registered owner.',\n  `vehicle_type` STRING COMMENT
  'Type of vehicle, e.g. \\'Car\\', \\'Motorcycle\\', \\'Tractor\\'.',\n  `vehicle_class`
  STRING COMMENT 'RTO vehicle class, e.g. \\'Light Motor Vehicle\\', \\'Motor Cycle\\\
  ', \\'Non Transport\\'. [Value Examples: \\'TWO WHEELER(NT)\\', \\'LIGHT MOTOR VEHICLE\\\
  ', \\'THREE WHEELER(NT)\\', \\'THREE WHEELER(T)\\', \\'LIGHT\\', \\'LIGHT PASSENGER
  VEHICLE\\', \\'HEAVY PASSENGER VEHICLE\\', \\'MEDIUM MOTOR VEHICLE\\', \\'MEDIUM
  PASSENGER VEHICLE\\', \\'HEAVY MOTOR VEHICLE\\']',\n  `reg_no` STRING COMMENT 'Vehicle
  registration number plate.',\n  `make` STRING COMMENT 'Vehicle manufacturer/make.',\n\
  \  `model` STRING COMMENT 'Vehicle model name.',\n  `year_of_manufacture` INT COMMENT
  'Year the vehicle was manufactured.',\n  `fuel_type` STRING COMMENT 'Fuel type,
  e.g. \\'Petrol\\', \\'Diesel\\'. [Value Examples: \\'PETROL\\', \\'DIESEL\\', \\\
  'NOT APPLICABLE\\', \\'ELECTRIC(BOV)\\', \\'PETROL(E20)\\', \\'PETROL/LPG\\', \\\
  'PETROL/CNG\\', \\'PURE EV\\', \\'PETROL/HYBRID\\', \\'CNG ONLY\\']',\n  `chassis_no`
  STRING COMMENT 'Vehicle chassis (VIN) number.',\n  `engine_no` STRING COMMENT 'Vehicle
  engine number.',\n  `color` STRING COMMENT 'Vehicle color as registered.',\n  `seating_capacity`
  INT COMMENT 'Number of seats.',\n  `unladen_weight_kg` INT COMMENT 'Unladen (kerb)
  weight of the vehicle, in kilograms.',\n  `laden_weight_kg` INT COMMENT 'Gross/loaded
  weight of the vehicle, in kilograms — the counterpart to unladen_weight_kg (empty
  weight).',\n  `registration_date` DATE COMMENT 'Date the vehicle was first registered.',\n\
  \  `rto_office` STRING COMMENT 'Regional Transport Office that registered the vehicle.',\n\
  \  `owner_name` STRING COMMENT 'Registered owner\\'s name (denormalized for display
  without a join to dim_person).',\n  `owner_mobile_number` STRING COMMENT 'Registered
  owner\\'s contact mobile number on file with the RTO.',\n  `data_source` STRING
  COMMENT 'Source system this vehicle record was sourced from, e.g. \\'VAHAN\\'. [Value
  Examples: \\'Vahan\\']',\n  `updated_at` TIMESTAMP COMMENT 'Timestamp this vehicle
  record was last updated.'\n)\nROW FORMAT SERDE\n  'org.apache.iceberg.mr.hive.HiveIcebergSerDe'\n\
  STORED BY\n  'org.apache.iceberg.mr.hive.HiveIcebergStorageHandler'\nLOCATION\n\
  \  'hdfs://ap-datalake/CURATED/ap_citizen360/dim_vehicle'"
columns:
- name: vehicle_id
  type: STRING
  nullable: true
  description: Canonical vehicle identifier.
- name: person_id
  type: STRING
  nullable: true
  description: Foreign key to dim_person.person_id — the registered owner.
- name: vehicle_type
  type: STRING
  nullable: true
  description: "Type of vehicle, e.g. 'Car', 'Motorcycle', 'Tractor'. [Value Examples:
    'Motor Car', 'Three Wheeler (Passenger)', 'Goods Carrier', 'Agricultural Tractor',
    'Trailer (Commercial)', 'Tractor (Commercial)']"
- name: vehicle_class
  type: STRING
  nullable: true
  description: 'RTO vehicle class, e.g. ''Light Motor Vehicle'', ''Motor Cycle'',
    ''Non Transport''. [Value Examples: ''TWO WHEELER(NT)'', ''LIGHT MOTOR VEHICLE'',
    ''THREE WHEELER(NT)'', ''THREE WHEELER(T)'', ''LIGHT'', ''LIGHT PASSENGER VEHICLE'']'
  distinct:
  - TWO WHEELER(NT)
  - LIGHT MOTOR VEHICLE
  - THREE WHEELER(NT)
  - THREE WHEELER(T)
  - LIGHT
  - LIGHT PASSENGER VEHICLE
  - HEAVY PASSENGER VEHICLE
  - MEDIUM MOTOR VEHICLE
  - MEDIUM PASSENGER VEHICLE
  - HEAVY MOTOR VEHICLE
  - TWO WHEELER(T)
  - TWO WHEELER (Invalid Carriage)
  - FOUR WHEELER (Invalid Carriage)
- name: reg_no
  type: STRING
  nullable: true
  description: Vehicle registration number plate.
- name: make
  type: STRING
  nullable: true
  description: Vehicle manufacturer/make.
- name: model
  type: STRING
  nullable: true
  description: Vehicle model name.
- name: year_of_manufacture
  type: INT
  nullable: true
  description: Year the vehicle was manufactured.
- name: fuel_type
  type: STRING
  nullable: true
  description: 'Fuel type, e.g. ''Petrol'', ''Diesel''. [Value Examples: ''PETROL'',
    ''DIESEL'', ''NOT APPLICABLE'', ''ELECTRIC(BOV)'', ''PETROL(E20)'', ''PETROL/LPG'']'
  distinct:
  - PETROL
  - DIESEL
  - NOT APPLICABLE
  - ELECTRIC(BOV)
  - PETROL(E20)
  - PETROL/LPG
  - PETROL/CNG
  - PURE EV
  - PETROL/HYBRID
  - CNG ONLY
  - STRONG HYBRID EV
  - DIESEL/HYBRID
  - LPG ONLY
  - SOLAR
  - PLUG-IN HYBRID EV
- name: chassis_no
  type: STRING
  nullable: true
  description: Vehicle chassis (VIN) number.
- name: engine_no
  type: STRING
  nullable: true
  description: Vehicle engine number.
- name: color
  type: STRING
  nullable: true
  description: Vehicle color as registered.
- name: seating_capacity
  type: INT
  nullable: true
  description: Number of seats.
- name: unladen_weight_kg
  type: INT
  nullable: true
  description: Unladen (kerb) weight of the vehicle, in kilograms.
- name: laden_weight_kg
  type: INT
  nullable: true
  description: Gross/loaded weight of the vehicle, in kilograms — the 
    counterpart to unladen_weight_kg (empty weight).
- name: registration_date
  type: DATE
  nullable: true
  description: Date the vehicle was first registered.
- name: rto_office
  type: STRING
  nullable: true
  description: Regional Transport Office that registered the vehicle.
- name: owner_name
  type: STRING
  nullable: true
  description: Registered owner's name (denormalized for display without a join 
    to dim_person).
- name: owner_mobile_number
  type: STRING
  nullable: true
  description: Registered owner's contact mobile number on file with the RTO.
- name: data_source
  type: STRING
  nullable: true
  description: 'Source system this vehicle record was sourced from, e.g. ''VAHAN''.
    [Value Examples: ''Vahan'']'
  distinct:
  - Vahan
- name: updated_at
  type: TIMESTAMP
  nullable: true
  description: Timestamp this vehicle record was last updated.
primary_key:
- vehicle_id
relationships:
- dim_vehicle.person_id is a foreign key to dim_person.person_id.
- dim_vehicle.owner_name joins to dim_person (via owner_name).
business_terms:
- ap_citizen360
- assets_—_vehicles
- dimension
- Hive
- Iceberg
- ICEBERG
common_operations:
- profile records in dim_vehicle
- join dim_vehicle to dim_person via person_id
- filter dim_vehicle by district_id or mandal_id
- name: laden_weight_kg
  type: STRING
  nullable: true
  description: Added from metadata.
