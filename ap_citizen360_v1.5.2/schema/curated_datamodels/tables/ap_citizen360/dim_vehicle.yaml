database: ap_citizen360
table: dim_vehicle
department: ap_citizen360
description: One row per vehicle owned — identity/registration details. Compliance/regulatory status (insurance, fitness,
  permits, challans) is split out into dim_vehicle_compliance to keep slow-changing compliance data separate from largely-static
  identity data.
table_format: ICEBERG
location: hdfs://ap-datalake/CURATED/ap_citizen360/dim_vehicle
tblproperties:
  engine.hive.enabled: 'true'
  external: 'true'
  parquet.compression: SNAPPY
  table_type: ICEBERG
  write.delete.mode: merge-on-read
  write.format.default: parquet
  write.merge.mode: merge-on-read
  write.update.mode: merge-on-read
source_file: citizen360_canonical_schema.json
raw_ddl: "CREATE EXTERNAL TABLE `ap_citizen360`.`dim_vehicle`(\n  `vehicle_id` STRING COMMENT 'Canonical vehicle identifier.',\n\
  \  `person_id` STRING COMMENT 'Foreign key to dim_person.person_id — the registered owner.',\n  `vehicle_type` STRING COMMENT\
  \ 'Type of vehicle, e.g. \\'Car\\', \\'Motorcycle\\', \\'Tractor\\'.',\n  `vehicle_class` STRING COMMENT 'RTO vehicle class,\
  \ e.g. \\'Light Motor Vehicle\\', \\'Motor Cycle\\', \\'Non Transport\\'. [Value Examples: \\'TWO WHEELER(NT)\\', \\'LIGHT\
  \ MOTOR VEHICLE\\', \\'THREE WHEELER(NT)\\', \\'THREE WHEELER(T)\\', \\'LIGHT\\', \\'LIGHT PASSENGER VEHICLE\\', \\'HEAVY\
  \ PASSENGER VEHICLE\\', \\'MEDIUM MOTOR VEHICLE\\', \\'MEDIUM PASSENGER VEHICLE\\', \\'HEAVY MOTOR VEHICLE\\']',\n  `reg_no`\
  \ STRING COMMENT 'Vehicle registration number plate.',\n  `make` STRING COMMENT 'Vehicle manufacturer/make.',\n  `model`\
  \ STRING COMMENT 'Vehicle model name.',\n  `year_of_manufacture` INT COMMENT 'Year the vehicle was manufactured.',\n  `fuel_type`\
  \ STRING COMMENT 'Fuel type, e.g. \\'Petrol\\', \\'Diesel\\'. [Value Examples: \\'PETROL\\', \\'DIESEL\\', \\'NOT APPLICABLE\\\
  ', \\'ELECTRIC(BOV)\\', \\'PETROL(E20)\\', \\'PETROL/LPG\\', \\'PETROL/CNG\\', \\'PURE EV\\', \\'PETROL/HYBRID\\', \\'CNG\
  \ ONLY\\']',\n  `chassis_no` STRING COMMENT 'Vehicle chassis (VIN) number.',\n  `engine_no` STRING COMMENT 'Vehicle engine\
  \ number.',\n  `color` STRING COMMENT 'Vehicle color as registered.',\n  `seating_capacity` INT COMMENT 'Number of seats.',\n\
  \  `unladen_weight_kg` INT COMMENT 'Unladen (kerb) weight of the vehicle, in kilograms.',\n  `laden_weight_kg` INT COMMENT\
  \ 'Gross/loaded weight of the vehicle, in kilograms — the counterpart to unladen_weight_kg (empty weight).',\n  `registration_date`\
  \ DATE COMMENT 'Date the vehicle was first registered.',\n  `rto_office` STRING COMMENT 'Regional Transport Office that\
  \ registered the vehicle.',\n  `owner_name` STRING COMMENT 'Registered owner\\'s name (denormalized for display without\
  \ a join to dim_person).',\n  `owner_mobile_number` STRING COMMENT 'Registered owner\\'s contact mobile number on file with\
  \ the RTO.',\n  `data_source` STRING COMMENT 'Source system this vehicle record was sourced from, e.g. \\'VAHAN\\'. [Value\
  \ Examples: \\'Vahan\\']',\n  `updated_at` TIMESTAMP COMMENT 'Timestamp this vehicle record was last updated.'\n)\nROW FORMAT\
  \ SERDE\n  'org.apache.iceberg.mr.hive.HiveIcebergSerDe'\nSTORED BY\n  'org.apache.iceberg.mr.hive.HiveIcebergStorageHandler'\n\
  LOCATION\n  'hdfs://ap-datalake/CURATED/ap_citizen360/dim_vehicle'"
