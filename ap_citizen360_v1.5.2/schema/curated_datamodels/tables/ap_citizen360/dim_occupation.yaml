database: ap_citizen360
table: dim_occupation
department: ap_citizen360
description: Occupation history and current occupation — one row per person per occupation, since a citizen can hold more
  than one concurrently (e.g. farmer + seasonal MGNREGA labourer). Source of truth for occupation_type (including current
  via is_current); not denormalized onto dim_person.
table_format: ICEBERG
location: hdfs://ap-datalake/CURATED/ap_citizen360/dim_occupation
tblproperties:
  engine.hive.enabled: 'true'
  external: 'true'
  parquet.compression: SNAPPY
  table_type: ICEBERG
  write.delete.mode: merge-on-read
  write.format.default: parquet
  write.merge.mode: merge-on-read
  write.update.mode: merge-on-read
source_file: citizen360_canonical_schema.json
raw_ddl: "CREATE EXTERNAL TABLE `ap_citizen360`.`dim_occupation`(\n  `occupation_record_id` STRING COMMENT 'Canonical identifier\
  \ for this occupation record.',\n  `person_id` STRING COMMENT 'Foreign key to dim_person.person_id.',\n  `occupation_type`\
  \ STRING COMMENT 'Type of occupation, e.g. \\'Farmer\\', \\'Teacher\\', \\'MGNREGA Worker\\'.',\n  `occupation_sector` STRING\
  \ COMMENT 'Sector this occupation falls under, e.g. \\'Agriculture\\', \\'Government\\', \\'Private\\', \\'Informal\\'.\
  \ [Value Examples: \\'Public\\', \\'Private\\']',\n  `employer_name` STRING COMMENT 'Employer name for this occupation record,\
  \ where applicable.',\n  `designation` STRING COMMENT 'Job title/designation for this occupation record.',\n  `employment_status`\
  \ STRING COMMENT 'Status of this occupation record, e.g. \\'Active\\', \\'Seasonal\\', \\'Ended\\'. [Value Examples: \\\
  'Working\\', \\'1\\', \\'0\\', \\'Leave\\', \\'Suspension\\']',\n  `source` STRING COMMENT 'System/department that reported\
  \ this occupation record. [Value Examples: \\'UFS\\', \\'DEPT-EDU\\', \\'SERP\\', \\'Open\\', \\'DBT Schemes\\', \\'MEPMA\\\
  ', \\'HRMS\\', \\'APCOS\\']',\n  `occupation_year` STRING COMMENT 'Year (or year range) this occupation record pertains\
  \ to.',\n  `is_current` BOOLEAN COMMENT 'True if this is the person\\'s currently active occupation among possibly several\
  \ historical/concurrent records. [Value Examples: \\'True\\']',\n  `updated_at` TIMESTAMP COMMENT 'Timestamp this occupation\
  \ record was last updated.'\n)\nROW FORMAT SERDE\n  'org.apache.iceberg.mr.hive.HiveIcebergSerDe'\nSTORED BY\n  'org.apache.iceberg.mr.hive.HiveIcebergStorageHandler'\n\
  LOCATION\n  'hdfs://ap-datalake/CURATED/ap_citizen360/dim_occupation'"
