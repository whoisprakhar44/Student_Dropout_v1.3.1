database: ap_citizen360
table: dim_tax_profile
department: ap_citizen360
description: One row per person summarizing income-tax and GST liability — distinct
  from dim_property_tax, which covers municipal property tax rather than income/GST.
table_format: ICEBERG
location: hdfs://ap-datalake/CURATED/ap_citizen360/dim_tax_profile
partitioned_by: updated_at
tblproperties:
  engine.hive.enabled: 'true'
  external: 'true'
  parquet.compression: SNAPPY
  table_type: ICEBERG
  write.delete.mode: merge-on-read
  write.format.default: parquet
  write.merge.mode: merge-on-read
  write.update.mode: merge-on-read
source_file: citizen360_canonical_schema.json
raw_ddl: |
  CREATE EXTERNAL TABLE `ap_citizen360`.`dim_tax_profile`(
    `person_id` STRING,
    `gst_paid_annual` DECIMAL(38,2),
    `income_tax_paid` BOOLEAN,
    `updated_at` TIMESTAMP
  )
columns:
- name: person_id
  type: STRING
  nullable: true
  description: Foreign key to dim_person.person_id.
- name: gst_paid_annual
  type: DECIMAL(38,2)
  nullable: true
  description: Annual GST paid by the person (e.g. as a registered business owner),
    in INR.
- name: income_tax_paid
  type: BOOLEAN
  nullable: true
  description: True if the person has a record of having paid income tax in the relevant
    assessment period.
- name: updated_at
  type: TIMESTAMP
  nullable: true
  description: Timestamp this tax profile was last updated.
primary_key:
- person_id
relationships:
- dim_tax_profile.person_id is a foreign key to dim_person.person_id.
business_terms:
- ap_citizen360
- person___household___identity
- dimension
- Hive
- Iceberg
- ICEBERG
common_operations:
- profile records in dim_tax_profile
- join dim_tax_profile to dim_person via person_id
- filter dim_tax_profile by district_id or mandal_id
