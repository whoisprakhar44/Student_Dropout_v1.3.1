database: ap_citizen360
table: dim_tax_profile
department: ap_citizen360
description: One row per person summarizing income-tax and GST liability — distinct from dim_property_tax, which covers municipal
  property tax rather than income/GST.
table_format: ICEBERG
location: hdfs://ap-datalake/CURATED/ap_citizen360/dim_tax_profile
partitioned_by: updated_at
tblproperties:
  engine.hive.enabled: 'true'
  external: 'true'
  parquet.compression: SNAPPY
  table_type: ICEBERG
  write.delete.mode: merge-on-read
  write.format.default: parquet
  write.merge.mode: merge-on-read
  write.update.mode: merge-on-read
source_file: citizen360_canonical_schema.json
raw_ddl: "CREATE EXTERNAL TABLE `ap_citizen360`.`dim_tax_profile`(\n  `person_id` STRING COMMENT 'Foreign key to dim_person.person_id.',\n\
  \  `gst_paid_annual` DECIMAL(38,2) COMMENT 'Annual GST paid by the person (e.g. as a registered business owner), in INR.',\n\
  \  `income_tax_paid` BOOLEAN COMMENT 'True if the person has a record of having paid income tax in the relevant assessment\
  \ period.',\n  `updated_at` TIMESTAMP COMMENT 'Timestamp this tax profile was last updated.'\n)\nROW FORMAT SERDE\n  'org.apache.iceberg.mr.hive.HiveIcebergSerDe'\n\
  STORED BY\n  'org.apache.iceberg.mr.hive.HiveIcebergStorageHandler'\nLOCATION\n  'hdfs://ap-datalake/CURATED/ap_citizen360/dim_tax_profile'\n\
  PARTITIONED BY (updated_at)"
