database: ap_citizen360
table: dim_epfo_contribution
department: ap_citizen360
description: One row per person summarizing their Employees' Provident Fund Organisation contribution status — for formal-sector
  employees contributing to EPF/EPS.
table_format: ICEBERG
location: hdfs://ap-datalake/CURATED/ap_citizen360/dim_epfo_contribution
tblproperties:
  engine.hive.enabled: 'true'
  external: 'true'
  parquet.compression: SNAPPY
  table_type: ICEBERG
  write.delete.mode: merge-on-read
  write.format.default: parquet
  write.merge.mode: merge-on-read
  write.update.mode: merge-on-read
source_file: citizen360_canonical_schema.json
raw_ddl: "CREATE EXTERNAL TABLE `ap_citizen360`.`dim_epfo_contribution`(\n  `person_id` STRING COMMENT 'Foreign key to dim_person.person_id.',\n\
  \  `employee_contribution` DECIMAL(10,0) COMMENT 'Most recent employee-side EPF contribution amount, in INR.',\n  `employer_contribution`\
  \ DECIMAL(10,0) COMMENT 'Most recent employer-side EPF contribution amount, in INR.',\n  `eps_contribution` DECIMAL(10,0)\
  \ COMMENT 'Most recent Employees\\' Pension Scheme contribution amount, in INR.',\n  `latest_contribution_date` DATE COMMENT\
  \ 'Date of the most recent contribution.',\n  `secretariat_code` STRING COMMENT 'Gram/Ward Sachivalayam code associated\
  \ with the person\\'s registered address.',\n  `establishment_id` STRING COMMENT 'EPFO establishment (employer) code the\
  \ contributions were made through.',\n  `updated_at` TIMESTAMP COMMENT 'Timestamp this EPFO record was last updated.'\n\
  )\nROW FORMAT SERDE\n  'org.apache.iceberg.mr.hive.HiveIcebergSerDe'\nSTORED BY\n  'org.apache.iceberg.mr.hive.HiveIcebergStorageHandler'\n\
  LOCATION\n  'hdfs://ap-datalake/CURATED/ap_citizen360/dim_epfo_contribution'"
