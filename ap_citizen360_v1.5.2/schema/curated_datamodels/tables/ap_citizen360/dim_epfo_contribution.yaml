- name: employer_contribution
  type: DECIMAL(10,0)
  nullable: true
  description: 'Most recent employer-side EPF contribution amount, in INR. Unit: INR.'
- name: eps_contribution
  type: DECIMAL(10,0)
  nullable: true
  description: 'Most recent Employees'' Pension Scheme contribution amount, in INR.
    Unit: INR.'
- name: latest_contribution_date
  type: DATE
  nullable: true
  description: Date of the most recent contribution.
- name: secretariat_code
  type: STRING
  nullable: true
  description: Gram/Ward Sachivalayam code associated with the person's registered
    address.
  value_description: '[''21086388'', ''10690540'', ''10990020'', ''10690557'', ''21086409'',
