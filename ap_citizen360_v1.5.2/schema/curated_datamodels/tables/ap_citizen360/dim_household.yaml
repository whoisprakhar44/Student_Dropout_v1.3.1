database: ap_citizen360
table: dim_household
department: ap_citizen360
description: "One row per household \u2014 the family/ration-card unit that dim_person.household_id\
  \ and dim_family_member.household_id join against. Carries household-level (not\
  \ individual-level) attributes like ration card and income category."
table_format: ICEBERG
location: hdfs://ap-datalake/CURATED/ap_citizen360/dim_household
partitioned_by: null
tblproperties:
  engine.hive.enabled: 'true'
  external: 'true'
  parquet.compression: SNAPPY
  table_type: ICEBERG
  write.delete.mode: merge-on-read
  write.format.default: parquet
  write.merge.mode: merge-on-read
  write.update.mode: merge-on-read
source_file: citizen360_canonical_schema.json
raw_ddl: "CREATE EXTERNAL TABLE `ap_citizen360`.`dim_household`(\n  `household_id`\
  \ STRING COMMENT 'Primary Key: household identifier.',\n  `head_person_id` STRING\
  \ COMMENT 'Foreign Key: References dim_person.person_id. for the head of household.',\n\
  \  `head_name` STRING COMMENT 'Name of the head of household (denormalized for display\
  \ without a join).',\n  `head_gender` STRING COMMENT 'Gender of the head of household.',\n\
  \  `members_count` INT COMMENT 'Total number of members in the household.',\n  `social_category`\
  \ STRING COMMENT 'Household-level social category (typically the head\\'s), used\
  \ for some household-targeted welfare schemes.',\n  `ration_card_no` STRING COMMENT\
  \ 'NFSA ration card number issued to this household.',\n  `ration_card_type` STRING\
  \ COMMENT 'Categorical column. Distinct values: \\'AAY\\', \\'PHH\\', \\'NPHH \u2014\
  \ ration card priority category.\\'. AAY / PHH / NPHH \u2014 ration card priority\
  \ category.',\n  `income_band` STRING COMMENT 'Household income bracket (ranged,\
  \ e.g. \\'Below \u20B91.5L\\').',\n  `village_name` STRING COMMENT 'Categorical\
  \ column. Distinct values: \\'Village\\', \\'habitation the household resides in.\\\
  '. Village/habitation the household resides in.',\n  `mandal_id` STRING COMMENT\
  \ 'Foreign Key: References dim_mandal.mandal_id.',\n  `district_id` STRING COMMENT\
  \ 'Foreign Key: References dim_district.district_id.',\n  `latitude` DOUBLE COMMENT\
  \ 'Geocoded latitude of the household\\'s residence, where available.',\n  `longitude`\
  \ DOUBLE COMMENT 'Geocoded longitude of the household\\'s residence, where available.',\n\
  \  `pincode` STRING COMMENT 'Postal PIN code of the household\\'s residence.',\n\
  \  `address` STRING COMMENT 'Free-text household address.',\n  `dwelling_type` STRING\
  \ COMMENT 'Categorical column. Distinct values: \\'Household-level housing tenure\\\
  ', \\'quality, e.g. \\'Own House \u2013 Pucca\\'.\\'. Household-level housing tenure/quality,\
  \ e.g. \\'Own House \u2013 Pucca\\'. [Value Examples: \\'Own House \u2013 Pucca\\\
  ']',\n  `phone` STRING COMMENT 'Primary contact number for the household.',\n  `household_income_category`\
  \ STRING COMMENT 'BPL / APL classification \u2014 distinct from the ranged income_band,\
  \ used by schemes that key specifically on Below/Above Poverty Line status rather\
  \ than an income range.',\n  `updated_at` TIMESTAMP COMMENT 'Timestamp the household\
  \ record was last updated by any source.')\nROW FORMAT SERDE\n  'org.apache.iceberg.mr.hive.HiveIcebergSerDe'\n\
  STORED BY\n  'org.apache.iceberg.mr.hive.HiveIcebergStorageHandler'\n\nLOCATION\n\
  \  'hdfs://ap-datalake/CURATED/ap_citizen360/dim_household'"
