database: ap_citizen360
table: dim_scheme
department: ap_citizen360
description: "Canonical welfare/benefit scheme catalog \u2014 referenced by fact_entitlement,\
  \ fact_benefit_transaction, fact_scheme_disbursement, and the linked_scheme_ids\
  \ arrays on several dim_* tables."
table_format: ICEBERG
location: hdfs://ap-datalake/CURATED/ap_citizen360/dim_scheme
partitioned_by: null
tblproperties:
  engine.hive.enabled: 'true'
  external: 'true'
  parquet.compression: SNAPPY
  table_type: ICEBERG
  write.delete.mode: merge-on-read
  write.format.default: parquet
  write.merge.mode: merge-on-read
  write.update.mode: merge-on-read
source_file: citizen360_canonical_schema.json
raw_ddl: "CREATE EXTERNAL TABLE `ap_citizen360`.`dim_scheme`(\n  `scheme_id` STRING\
  \ COMMENT 'Primary Key: scheme code, e.g. \\'SCH-001\\'.',\n  `scheme_name` STRING\
  \ COMMENT 'Display name of the scheme, e.g. \\'Anna NTR\\', \\'PM-Kisan\\'. [Value\
  \ Examples: \\'Anna NTR\\', \\'PM-Kisan\\']',\n  `department_id` STRING COMMENT\
  \ 'Foreign Key: References dim_department.department_id. the department administering\
  \ this scheme.',\n  `benefit_type` STRING COMMENT 'Nature of the benefit, e.g. \\\
  'Cash Transfer\\', \\'In-kind\\', \\'Subsidy\\', \\'Insurance\\'. [Value Examples:\
  \ \\'Cash Transfer\\', \\'In-kind\\', \\'Subsidy\\', \\'Insurance\\']')\nROW FORMAT\
  \ SERDE\n  'org.apache.iceberg.mr.hive.HiveIcebergSerDe'\nSTORED BY\n  'org.apache.iceberg.mr.hive.HiveIcebergStorageHandler'\n\
  \nLOCATION\n  'hdfs://ap-datalake/CURATED/ap_citizen360/dim_scheme'"
columns:
- name: scheme_id
  type: STRING
  nullable: true
  description: 'Primary Key: scheme code, e.g. ''SCH-001''.'
- name: scheme_name
  type: STRING
  nullable: true
  description: 'Display name of the scheme, e.g. ''Anna NTR'', ''PM-Kisan''. [Value
    Examples: ''Anna NTR'', ''PM-Kisan'']'
  value_description: "['Anna NTR (PDS Free Rice)', 'Fishermen Pension', 'Pradhan Mantri\
    \ Awas Yojana \u2013 Urban', 'NTR Bharosa Pension (CKDU GOVT)', 'YSR Free Solar\
    \ Rooftop Scheme', 'NTR Bharosa Pension (Abhayahastam)', 'PM-YASASVI - Post-Matric\
    \ Scholarship for OBC, EBC & DNT [AP146]', 'Jagjeevan Jyothi', 'NTR Bharosa Pension\
    \ (Traditional Cobblers)', 'MEPMA Urban SHG Loan', 'Dr. B.R. Ambedkar Overseas\
    \ Vidya Nidhi', 'NTR Bharosa Pension (Old Age)', 'Kutir Jyoti (Free Electricity\
    \ Connection)', 'Bala Sanjeevani', 'NTR Bharosa Pension (DMHO)', 'Integrated Child\
    \ Development Services (ICDS)', 'Amma Vodi (School Dropout Prevention)', 'MGNREGS\
    \ (Mahatma Gandhi NREGS)', 'Janani Suraksha Yojana (JSY)', 'YSR Rythu Bharosa\
    \ \u2013 PM KISAN Topup', 'Post-Matric Scholarship to Others', 'Post-Matric Scholarship\
    \ to SCs [AP232]', 'Mid-Day Meal Scheme', 'Pradhan Mantri Matru Vandana Yojana',\
    \ 'Deepam-2 (3 Free LPG Cylinders)', 'Pradhan Mantri Awas Yojana \u2013 Gramin',\
    \ 'Chandranna Bima (Accidental Insurance)', 'Auto Driver Sevalo', 'AB-PMJAY (Ayushman\
    \ Bharat)', 'Rajiv Gandhi Vidyarthi Abhaya Hastham', 'Sumangali (Marriage Assistance)',\
    \ 'Annapurna Food Security Scheme', 'NTR Bharosa Pension (Pensions to artists)',\
    \ 'Post-Matriculation Scholarships (MTF)', 'PM Fasal Bima Yojana (PMFBY)', 'Rythu\
    \ Bandhu Pathakam', 'NTR Bharosa Pension (Widow)', 'NTR Bharosa Pension (Disabled)',\
    \ 'Minority Overseas Scholarship', 'NTR Vidya Deevena (Fee Reimbursement)']"
- name: department_id
  type: STRING
  nullable: true
  description: 'Foreign Key: References dim_department.department_id. the department
    administering this scheme.'
- name: benefit_type
  type: STRING
  nullable: true
  description: 'Nature of the benefit, e.g. ''Cash Transfer'', ''In-kind'', ''Subsidy'',
    ''Insurance''. [Value Examples: ''Cash Transfer'', ''In-kind'', ''Subsidy'', ''Insurance'']'
  value_description: '[''Direct Cash Transfer'', ''In-Kind'', ''Fee Reimbursement'',
    ''Insurance Coverage'', ''Credit / Loan'']'
primary_key:
- scheme_id
relationships:
- dim_scheme.department_id is a foreign key to dim_department.department_id.
business_terms:
- ap_citizen360
- schemes,_departments_and_governance
- dimension
- Hive
- Iceberg
- ICEBERG
common_operations:
- profile records in dim_scheme
- join dim_scheme to dim_person via person_id
- filter dim_scheme by district_id or mandal_id
