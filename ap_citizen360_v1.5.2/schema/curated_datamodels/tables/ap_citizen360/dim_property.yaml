database: ap_citizen360
table: dim_property
department: ap_citizen360
description: One row per built property owned — residential, commercial, or apartment units. Municipal tax status for each
  property lives separately in dim_property_tax, joined via ptin.
table_format: ICEBERG
location: hdfs://ap-datalake/CURATED/ap_citizen360/dim_property
tblproperties:
  engine.hive.enabled: 'true'
  external: 'true'
  parquet.compression: SNAPPY
  table_type: ICEBERG
  write.delete.mode: merge-on-read
  write.format.default: parquet
  write.merge.mode: merge-on-read
  write.update.mode: merge-on-read
source_file: citizen360_canonical_schema.json
raw_ddl: "CREATE EXTERNAL TABLE `ap_citizen360`.`dim_property`(\n  `property_id` STRING COMMENT 'Canonical property identifier.',\n\
  \  `person_id` STRING COMMENT 'Foreign key to dim_person.person_id — the owner.',\n  `property_type` STRING COMMENT 'Residential\
  \ / Commercial / Apartment classification. [Value Examples: \\'Individual\\', \\'Joint Property\\', \\'Government\\']',\n\
  \  `property_sub_type` STRING COMMENT 'Finer classification, e.g. \\'Independent House\\', \\'Flat\\', \\'Shop\\', \\'Commercial\
  \ Complex\\'.',\n  `door_no` STRING COMMENT 'Door number of the property.',\n  `ward_no` STRING COMMENT 'Municipal ward\
  \ number the property falls under.',\n  `block_no` STRING COMMENT 'Block number, in layouts organized by block.',\n  `plot_no`\
  \ STRING COMMENT 'Plot number within the layout/survey.',\n  `street_name` STRING COMMENT 'Street name of the property\\\
  's address.',\n  `locality` STRING COMMENT 'Locality/neighbourhood name.',\n  `location` STRING COMMENT 'Free-text location\
  \ description.',\n  `pincode` STRING COMMENT 'Postal PIN code.',\n  `district_id` STRING COMMENT 'Foreign key to dim_district.district_id.',\n\
  \  `area_sq_ft` INT COMMENT 'Total area of the property, in square feet. [Value Examples: \\'0\\']',\n  `built_up_area_sq_ft`\
  \ INT COMMENT 'Built-up (constructed) area, in square feet.',\n  `site_area_sq_ft` INT COMMENT 'Underlying site/plot area,\
  \ in square feet.',\n  `construction_type` STRING COMMENT 'Construction method, e.g. \\'RCC\\', \\'Load Bearing\\'.',\n\
  \  `roof_type` STRING COMMENT 'Type of roofing.',\n  `usage_type` STRING COMMENT 'Residential / Commercial usage classification\
  \ for tax/zoning purposes.',\n  `registration_no` STRING COMMENT 'Deed registration number for the property.',\n  `registration_date`\
  \ DATE COMMENT 'Date the property deed was registered.',\n  `market_value` DECIMAL(12,2) COMMENT 'Estimated market value\
  \ of the property, in INR.',\n  `guideline_value` DECIMAL(12,2) COMMENT 'Government guideline (registration) value of the\
  \ property, in INR.',\n  `ptin` STRING COMMENT 'Property Tax Identification Number — joins to dim_property_tax.ptin.',\n\
  \  `municipal_no` STRING COMMENT 'Municipal assessment/door number assigned by the local body.',\n  `municipal_body` STRING\
  \ COMMENT 'Name of the municipal corporation/council/panchayat administering the property.',\n  `sro_office` STRING COMMENT\
  \ 'Sub-Registrar Office where the property deed is registered.',\n  `construction_year` INT COMMENT 'Year the property was\
  \ constructed.',\n  `floor_count` INT COMMENT 'Number of floors.',\n  `assessment_no` STRING COMMENT 'Municipal tax assessment\
  \ number.',\n  `owner_name` STRING COMMENT 'Registered owner\\'s name (denormalized for display without a join to dim_person).',\n\
  \  `plinth_area_units` STRING COMMENT 'Unit of measure used for plinth area in source records, e.g. \\'sq.ft\\', \\'sq.m\\\
  '.',\n  `site_extent_units` STRING COMMENT 'Unit of measure used for site extent in source records.',\n  `updated_at` TIMESTAMP\
  \ COMMENT 'Timestamp this property record was last updated.',\n  `aadhaar_mapped` STRING COMMENT 'Whether the property record\
  \ is Aadhaar-mapped (Y/N). [Value Examples: \\'N\\', \\'Y\\']'\n)\nROW FORMAT SERDE\n  'org.apache.iceberg.mr.hive.HiveIcebergSerDe'\n\
  STORED BY\n  'org.apache.iceberg.mr.hive.HiveIcebergStorageHandler'\nLOCATION\n  'hdfs://ap-datalake/CURATED/ap_citizen360/dim_property'"
