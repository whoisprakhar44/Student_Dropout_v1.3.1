primary_key:
- property_id
relationships:
- dim_property.person_id is a foreign key to dim_person.person_id.
- dim_property.district_id is a foreign key to dim_district.district_id.
- dim_property.ptin joins to dim_property_tax.ptin.
- dim_property.owner_name joins to dim_person (via owner_name).
