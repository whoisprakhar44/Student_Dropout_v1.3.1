database: ap_citizen360
table: dim_scheme_main_mapping
department: ap_citizen360
description: Maps each leaf scheme_id to a main (parent) scheme_id so variants roll up together in counts, disbursement totals,
  and the Schemes UI. A scheme with no row here is treated as its own main scheme.
table_format: ICEBERG
location: hdfs://ap-datalake/CURATED/ap_citizen360/dim_scheme_main_mapping
partitioned_by: district_id
tblproperties:
  engine.hive.enabled: 'true'
  external: 'true'
  parquet.compression: SNAPPY
  table_type: ICEBERG
  write.delete.mode: merge-on-read
  write.format.default: parquet
  write.merge.mode: merge-on-read
  write.update.mode: merge-on-read
source_file: citizen360_canonical_schema.json
raw_ddl: "CREATE EXTERNAL TABLE `ap_citizen360`.`dim_scheme_main_mapping`(\n  `scheme_id` STRING COMMENT 'Leaf / actual scheme\
  \ id from dim_scheme.',\n  `main_scheme_id` STRING COMMENT 'Parent / main scheme id from dim_scheme that this leaf rolls\
  \ up under.',\n  `updated_at` TIMESTAMP COMMENT 'When this mapping row was last updated.'\n)\nROW FORMAT SERDE\n  'org.apache.iceberg.mr.hive.HiveIcebergSerDe'\n\
  STORED BY\n  'org.apache.iceberg.mr.hive.HiveIcebergStorageHandler'\nLOCATION\n  'hdfs://ap-datalake/CURATED/ap_citizen360/dim_scheme_main_mapping'\n\
  PARTITIONED BY (district_id)"
columns:
- name: scheme_id
  type: STRING
  nullable: true
  description: Leaf / actual scheme id from dim_scheme.
- name: main_scheme_id
  type: STRING
  nullable: true
  description: Parent / main scheme id from dim_scheme that this leaf rolls up under.
- name: updated_at
  type: TIMESTAMP
  nullable: true
  description: When this mapping row was last updated.
primary_key:
- scheme_id
relationships:
- dim_scheme_main_mapping.scheme_id is a foreign key to dim_scheme.scheme_id.
business_terms:
- ap_citizen360
- schemes,_departments___governance
- dimension
- Iceberg
- ICEBERG
common_operations:
- filter dim_scheme_main_mapping by scheme_id
- join dim_scheme_main_mapping with other entities via person_id or district_id
