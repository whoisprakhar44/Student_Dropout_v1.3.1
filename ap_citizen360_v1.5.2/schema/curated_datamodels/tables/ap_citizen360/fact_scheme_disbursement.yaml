database: ap_citizen360
table: fact_scheme_disbursement
department: ap_citizen360
description: Pre-aggregated scheme disbursement totals per geography per fiscal year, broken down by social category — backs
  the Budget Integrity / disbursement dashboards without having to aggregate fact_benefit_transaction at query time. Partitioned
  by geo_level and fiscal_year.
table_format: ICEBERG
location: hdfs://ap-datalake/CURATED/ap_citizen360/fact_scheme_disbursement
partitioned_by: geo_level, fiscal_year
tblproperties:
  engine.hive.enabled: 'true'
  external: 'true'
  parquet.compression: SNAPPY
  table_type: ICEBERG
  write.delete.mode: merge-on-read
  write.format.default: parquet
  write.merge.mode: merge-on-read
  write.update.mode: merge-on-read
source_file: citizen360_canonical_schema.json
raw_ddl: "CREATE EXTERNAL TABLE `ap_citizen360`.`fact_scheme_disbursement`(\n  `disbursement_id` STRING COMMENT 'Canonical\
  \ disbursement-aggregate identifier.',\n  `scheme_id` STRING COMMENT 'Foreign key to dim_scheme.scheme_id.',\n  `department_id`\
  \ STRING COMMENT 'Foreign key to dim_department.department_id.',\n  `geo_level` STRING COMMENT 'Geography level this aggregate\
  \ is rolled up to, e.g. \\'state\\', \\'district\\', \\'mandal\\'. [Value Examples: \\'VILLAGE\\', \\'MANDAL\\', \\'DISTRICT\\\
  ', \\'STATE\\']',\n  `geo_id` STRING COMMENT 'Identifier of the specific geography at geo_level (e.g. a district_id when\
  \ geo_level=\\'district\\').',\n  `fiscal_year` STRING COMMENT 'Fiscal year this aggregate covers.',\n  `total_crores` DECIMAL(12,2)\
  \ COMMENT 'Total disbursement amount, in INR crores.',\n  `beneficiaries` BIGINT COMMENT 'Total count of beneficiaries covered\
  \ by this aggregate.',\n  `amount_oc` DECIMAL(12,2) COMMENT 'Disbursement amount attributable to OC-category beneficiaries,\
  \ in INR crores.',\n  `amount_bc` DECIMAL(12,2) COMMENT 'Disbursement amount attributable to BC-category beneficiaries,\
  \ in INR crores.',\n  `amount_sc` DECIMAL(12,2) COMMENT 'Disbursement amount attributable to SC-category beneficiaries,\
  \ in INR crores.',\n  `amount_st` DECIMAL(12,2) COMMENT 'Disbursement amount attributable to ST-category beneficiaries,\
  \ in INR crores.',\n  `amount_others` DECIMAL(12,2) COMMENT 'Disbursement amount attributable to beneficiaries outside the\
  \ OC/BC/SC/ST categories, in INR crores.'\n)\nROW FORMAT SERDE\n  'org.apache.iceberg.mr.hive.HiveIcebergSerDe'\nSTORED\
  \ BY\n  'org.apache.iceberg.mr.hive.HiveIcebergStorageHandler'\nLOCATION\n  'hdfs://ap-datalake/CURATED/ap_citizen360/fact_scheme_disbursement'\n\
  PARTITIONED BY (geo_level, fiscal_year)"
