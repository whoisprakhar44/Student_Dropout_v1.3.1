database: ap_citizen360
table: dim_state
department: ap_citizen360
description: "One row per state per effective-dated period (slowly-changing dimension\
  \ via effective_from/effective_to/is_current) \u2014 currently only Andhra Pradesh.\
  \ Backs the State Profile view and top-of-hierarchy rollups."
table_format: ICEBERG
location: hdfs://ap-datalake/CURATED/ap_citizen360/dim_state
partitioned_by: null
tblproperties:
  engine.hive.enabled: 'true'
  external: 'true'
  parquet.compression: SNAPPY
  table_type: ICEBERG
  write.delete.mode: merge-on-read
  write.format.default: parquet
  write.merge.mode: merge-on-read
  write.update.mode: merge-on-read
source_file: citizen360_canonical_schema.json
raw_ddl: "CREATE EXTERNAL TABLE `ap_citizen360`.`dim_state`(\n  `state_id` STRING\
  \ COMMENT 'Primary Key: state code, e.g. \\'ap\\'.',\n  `state_name` STRING COMMENT\
  \ 'Full state name, e.g. \\'Andhra Pradesh\\'. [Value Examples: \\'Andhra Pradesh\\\
  ']',\n  `population` BIGINT COMMENT 'Categorical column. Distinct values: \\'Total\
  \ state population (census\\', \\'projected).\\'. Total state population (census/projected).',\n\
  \  `households` BIGINT COMMENT 'Total household count in the state.',\n  `literacy_rate`\
  \ DOUBLE COMMENT 'State literacy rate, percentage (0-100). Unit: percentage (0-100).',\n\
  \  `sex_ratio` INT COMMENT 'Females per 1000 males.',\n  `districts_count` INT COMMENT\
  \ 'Number of districts in the state.',\n  `mandals_count` INT COMMENT 'Number of\
  \ mandals across all districts.',\n  `villages_count` INT COMMENT 'Number of villages/habitations\
  \ across all mandals.',\n  `median_age` DOUBLE COMMENT 'Median age of the population,\
  \ in years.',\n  `urbanization_pct` DOUBLE COMMENT 'Percentage of population classified\
  \ urban. Unit: percentage (0-100).',\n  `gross_state_income_cr` BIGINT COMMENT 'Categorical\
  \ column. Distinct values: \\'Gross state income\\', \\'product, in INR crores.\\\
  '. Gross state income/product, in INR crores.',\n  `electricity_consumers` BIGINT\
  \ COMMENT 'Total registered electricity consumer connections.',\n  `avg_monthly_kwh`\
  \ INT COMMENT 'Average monthly electricity consumption per consumer, in kWh. Unit:\
  \ kWh.',\n  `property_tax_collected` BIGINT COMMENT 'Total property tax collected\
  \ statewide, in INR. Unit: INR.',\n  `agri_land_acres` BIGINT COMMENT 'Total agricultural\
  \ land extent, in acres. Unit: acres.',\n  `ration_cards_total` BIGINT COMMENT 'Total\
  \ NFSA ration cards issued statewide.',\n  `ration_aay` BIGINT COMMENT 'Ration cards\
  \ under the Antyodaya Anna Yojana (poorest-of-poor) category.',\n  `ration_phh`\
  \ BIGINT COMMENT 'Ration cards under the Priority Household category.',\n  `ration_nphh`\
  \ BIGINT COMMENT 'Ration cards under the Non-Priority Household category.',\n  `ration_others`\
  \ BIGINT COMMENT 'Categorical column. Distinct values: \\'Ration cards under other\\\
  ', \\'legacy categories not covered above.\\'. Ration cards under other/legacy categories\
  \ not covered above.',\n  `effective_from` DATE COMMENT 'Start date this snapshot\
  \ row is valid from (SCD2 versioning).',\n  `effective_to` DATE COMMENT 'End date\
  \ this snapshot row is valid until; null/open-ended for the current row.',\n  `is_current`\
  \ BOOLEAN COMMENT 'Boolean flag. True if this is the latest/active version of the\
  \ state snapshot.')\nROW FORMAT SERDE\n  'org.apache.iceberg.mr.hive.HiveIcebergSerDe'\n\
  STORED BY\n  'org.apache.iceberg.mr.hive.HiveIcebergStorageHandler'\n\nLOCATION\n\
  \  'hdfs://ap-datalake/CURATED/ap_citizen360/dim_state'"
columns:
- name: state_id
  type: STRING
  nullable: true
  description: 'Primary Key: state code, e.g. ''ap''.'
- name: state_name
  type: STRING
  nullable: true
  description: 'Full state name, e.g. ''Andhra Pradesh''. [Value Examples: ''Andhra
    Pradesh'']'
  value_description: '[''Andhra Pradesh'']'
- name: population
  type: BIGINT
  nullable: true
  description: 'Categorical column. Distinct values: ''Total state population (census'',
    ''projected).''. Total state population (census/projected).'
- name: households
  type: BIGINT
  nullable: true
  description: Total household count in the state.
- name: literacy_rate
  type: DOUBLE
  nullable: true
  description: 'State literacy rate, percentage (0-100). Unit: percentage (0-100).'
- name: sex_ratio
  type: INT
  nullable: true
  description: Females per 1000 males.
- name: districts_count
  type: INT
  nullable: true
  description: Number of districts in the state.
- name: mandals_count
  type: INT
  nullable: true
  description: Number of mandals across all districts.
- name: villages_count
  type: INT
  nullable: true
  description: Number of villages/habitations across all mandals.
- name: median_age
  type: DOUBLE
  nullable: true
  description: Median age of the population, in years.
- name: urbanization_pct
  type: DOUBLE
  nullable: true
  description: 'Percentage of population classified urban. Unit: percentage (0-100).'
- name: gross_state_income_cr
  type: BIGINT
  nullable: true
  description: 'Categorical column. Distinct values: ''Gross state income'', ''product,
    in INR crores.''. Gross state income/product, in INR crores.'
- name: electricity_consumers
  type: BIGINT
  nullable: true
  description: Total registered electricity consumer connections.
- name: avg_monthly_kwh
  type: INT
  nullable: true
  description: 'Average monthly electricity consumption per consumer, in kWh. Unit:
    kWh.'
- name: property_tax_collected
  type: BIGINT
  nullable: true
  description: 'Total property tax collected statewide, in INR. Unit: INR.'
- name: agri_land_acres
  type: BIGINT
  nullable: true
  description: 'Total agricultural land extent, in acres. Unit: acres.'
- name: ration_cards_total
  type: BIGINT
  nullable: true
  description: Total NFSA ration cards issued statewide.
- name: ration_aay
  type: BIGINT
  nullable: true
  description: Ration cards under the Antyodaya Anna Yojana (poorest-of-poor) category.
- name: ration_phh
  type: BIGINT
  nullable: true
  description: Ration cards under the Priority Household category.
- name: ration_nphh
  type: BIGINT
  nullable: true
  description: Ration cards under the Non-Priority Household category.
- name: ration_others
  type: BIGINT
  nullable: true
  description: 'Categorical column. Distinct values: ''Ration cards under other'',
    ''legacy categories not covered above.''. Ration cards under other/legacy categories
    not covered above.'
- name: effective_from
  type: DATE
  nullable: true
  description: Start date this snapshot row is valid from (SCD2 versioning).
- name: effective_to
  type: DATE
  nullable: true
  description: End date this snapshot row is valid until; null/open-ended for the
    current row.
- name: is_current
  type: BOOLEAN
  nullable: true
  description: Boolean flag. True if this is the latest/active version of the state
    snapshot.
  value_description: '[''True'']'
primary_key:
- state_id
relationships: []
business_terms:
- ap_citizen360
- geography
- dimension
- Hive
- Iceberg
- ICEBERG
common_operations:
- profile records in dim_state
- join dim_state to dim_person via person_id
- filter dim_state by district_id or mandal_id
