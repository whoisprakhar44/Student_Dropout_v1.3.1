<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AP Citizen 360° — RBAC Governance Login</title>
  <style>
    :root {
      --primary-color: #0b2545;
      --primary-hover: #132a4a;
      --primary-text: #ffffff;
      --accent-color: #d97706;
      --accent-hover: #b45309;
      --accent-glow: rgba(217, 119, 6, 0.25);
      --background-color: #09090b;
      --surface-color: #111827;
      --surface-hover: #1f2937;
      --border-color: #1f2937;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --status-online: #15803d;
      --danger-color: #dc2626;
      --shadow-color: rgba(0, 0, 0, 0.5);
      --ap-navy-dark: #0b2545;
      --ap-navy-alt: #132a4a;
      --ap-navy-light: #1e3a8a;
      --ap-gold-accent: #d97706;
      --ap-gold-glow: #f59e0b;
      --emerald-success: #15803d;
      --card-radius: 16px;
    }

    [data-theme="light"] {
      --background-color: #f8fafc;
      --surface-color: #ffffff;
      --surface-hover: #f1f5f9;
      --border-color: #cbd5e1;
      --text-color: #0f172a;
      --text-muted: #475569;
      --shadow-color: rgba(15, 23, 42, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    body {
      background-color: var(--background-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }

    .theme-toggle-fixed {
      position: absolute;
      top: 24px;
      right: 24px;
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px var(--shadow-color);
    }

    .theme-toggle-fixed:hover {
      background: var(--surface-hover);
    }

    .login-container {
      width: 100%;
      max-width: 440px;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .emblem-wrapper {
      width: 68px;
      height: 68px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--ap-navy-dark), var(--ap-navy-alt));
      border: 2px solid var(--ap-gold-accent);
      box-shadow: 0 8px 24px var(--accent-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      color: var(--ap-gold-accent);
    }

    .brand-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text-color);
      margin-bottom: 6px;
    }

    .brand-subtitle {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .card {
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: var(--card-radius);
      padding: 32px 28px;
      box-shadow: 0 20px 40px var(--shadow-color);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--primary-color), var(--accent-color), var(--emerald-success));
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      pointer-events: none;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      background: var(--surface-hover);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 14px 12px 42px;
      font-size: 14px;
      color: var(--text-color);
      outline: none;
      transition: all 0.2s;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: var(--ap-gold-accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, var(--ap-navy-dark), var(--ap-navy-light));
      color: #ffffff;
      border: 1px solid var(--ap-gold-accent);
      border-radius: 10px;
      padding: 13px;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 14px rgba(11, 37, 69, 0.4);
      margin-top: 10px;
      transition: transform 0.15s ease, background 0.2s ease;
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, var(--primary-hover), var(--ap-navy-dark));
      transform: translateY(-1px);
    }

    .btn-submit:active {
      transform: scale(0.99);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .alert {
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 10px;
    }

    .alert-error {
      background: rgba(220, 38, 38, 0.15);
      border: 1px solid rgba(220, 38, 38, 0.3);
      color: #f87171;
    }

    .alert-success {
      background: rgba(21, 128, 61, 0.15);
      border: 1px solid rgba(21, 128, 61, 0.3);
      color: #4ade80;
    }

    .hint-card {
      margin-top: 22px;
      padding: 12px 16px;
      background: rgba(217, 119, 6, 0.08);
      border: 1px solid rgba(217, 119, 6, 0.25);
      border-radius: 8px;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .hint-card strong {
      color: var(--ap-gold-accent);
    }

    .badge-code {
      background: var(--surface-hover);
      color: var(--text-color);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <button class="theme-toggle-fixed" id="themeBtn" title="Toggle Light/Dark Theme">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="5"/>
      <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
    </svg>
    <span id="themeLabel">Light Mode</span>
  </button>

  <div class="login-container">
    <div class="brand-header">
      <div class="emblem-wrapper">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
      </div>
      <h1 class="brand-title">AP Citizen 360°</h1>
      <p class="brand-subtitle">RBAC & SDUI Governance Control Center</p>
    </div>

    <div class="card">
      <div id="alertBox" class="alert alert-error">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="alertMsg">Invalid username or password.</span>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Administrator Username</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
            <input type="text" id="username" name="username" value="admin" placeholder="Enter admin username" required autofocus>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Security Password</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input type="password" id="password" name="password" value="admin" placeholder="Enter password" required>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          <span>Authenticate & Access Dashboard</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
          </svg>
        </button>
      </form>

      <div class="hint-card">
        🔒 <strong>Default Credentials:</strong> Username <span class="badge-code">admin</span> & Password <span class="badge-code">admin</span>. Authenticated with JWT session token.
      </div>
    </div>
  </div>

  <script>
    // Theme toggle logic
    const themeBtn = document.getElementById('themeBtn');
    const themeLabel = document.getElementById('themeLabel');
    const htmlEl = document.documentElement;

    const savedTheme = localStorage.getItem('rbac_dashboard_theme') || 'dark';
    htmlEl.setAttribute('data-theme', savedTheme);
    themeLabel.textContent = savedTheme === 'dark' ? 'Light Mode' : 'Dark Mode';

    themeBtn.addEventListener('click', () => {
      const current = htmlEl.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      htmlEl.setAttribute('data-theme', next);
      localStorage.setItem('rbac_dashboard_theme', next);
      themeLabel.textContent = next === 'dark' ? 'Light Mode' : 'Dark Mode';
    });

    // Login Form Submit
    const loginForm = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const alertBox = document.getElementById('alertBox');
    const alertMsg = document.getElementById('alertMsg');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>Verifying credentials...</span>';
      alertBox.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/dashboard/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (res.ok && data.status === 'success') {
          alertBox.className = 'alert alert-success';
          alertMsg.textContent = 'Authentication successful! Redirecting to RBAC Control Center...';
          alertBox.style.display = 'flex';
          setTimeout(() => {
            const params = new URLSearchParams(window.location.search);
            const next = params.get('next') || '/dashboard';
            window.location.href = next;
          }, 600);
        } else {
          alertBox.className = 'alert alert-error';
          alertMsg.textContent = data.detail || data.message || 'Invalid username or password.';
          alertBox.style.display = 'flex';
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Authenticate & Access Dashboard</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>';
        }
      } catch (err) {
        alertBox.className = 'alert alert-error';
        alertMsg.textContent = 'Server connection failed. Please ensure the backend is running.';
        alertBox.style.display = 'flex';
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Authenticate & Access Dashboard</span>';
      }
    });
  </script>
</body>
</html>
