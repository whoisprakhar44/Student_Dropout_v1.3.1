database: ap_citizen360
table: fact_event_details
department: ap_citizen360
description: The single unified events table — every row is either a LIFECYCLE_EVENT
  (e.g. BirthRegistered, DeathRegistered, SchemeEnrolled) or an ANOMALY_EVENT (e.g.
  DualLoanHousehold, PregnancyMismatch), distinguished by event_type with the specific
  sub-type in sub_event_type. Backs POST /datatransfer/request and GET /api/v1/events/*,
  and is department_id-scoped so each department only ever sees events routed to it.
  Replaces the older fact_lifecycle_event/fact_anomaly_event tables, which are no
  longer queried anywhere. Partitioned by month and district.
table_format: ICEBERG
location: hdfs://ap-datalake/CURATED/ap_citizen360/fact_event_details
tblproperties:
  engine.hive.enabled: 'true'
  external: 'true'
  parquet.compression: SNAPPY
  table_type: ICEBERG
  write.delete.mode: merge-on-read
  write.format.default: parquet
  write.merge.mode: merge-on-read
  write.update.mode: merge-on-read
source_file: citizen360_canonical_schema.json
raw_ddl: |
  CREATE EXTERNAL TABLE `ap_citizen360`.`fact_event_details`(
    `event_id` STRING,
    `person_id` STRING,
    `citizen_name` STRING,
    `event_type` STRING,
    `sub_event_type` STRING,
    `severity` STRING,
    `detected_at` TIMESTAMP,
    `district_id` STRING,
    `mandal_id` STRING,
    `village_name` STRING,
    `summary` STRING,
    `resolution_status` STRING,
    `household_id` STRING,
    `department_id` STRING,
    `eventdata` STRING,
    `linked_scheme_ids` STRING
  )
columns:
- name: event_id
  type: STRING
  nullable: true
  description: Canonical event identifier.
- name: person_id
  type: STRING
  nullable: true
  description: Foreign key to dim_person.person_id — the citizen this event concerns.
- name: citizen_name
  type: STRING
  nullable: true
  description: Citizen's name, denormalized for display without a join.
- name: event_type
  type: STRING
  nullable: true
  description: 'Broad event category — ''LIFECYCLE_EVENT'' or ''ANOMALY_EVENT''. [Value
    Examples: ''INFORMATION_EVENT'', ''INFORMATION-EVENT'', ''LIFECYCLE_EVENT'', ''ANOMALY_EVENT'']'
  distinct:
  - INFORMATION_EVENT
  - INFORMATION-EVENT
  - LIFECYCLE_EVENT
  - ANOMALY_EVENT
- name: sub_event_type
  type: STRING
  nullable: true
  description: 'Specific event type within the category, e.g. ''DeathRegistered''
    (lifecycle) or ''DualLoanHousehold'' (anomaly). [Value Examples: ''dc_wagepayorder_info'',
    ''biometric_aadhar_response'', ''sustainable_dev_goals_pregnantsperiodicaldata'',
    ''consistent_rythms_v2_gereducationsurveystudents'', ''consistent_rythms_v2_gereducationsurvey'',
