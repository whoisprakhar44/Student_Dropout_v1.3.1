- name: severity
  type: STRING
  nullable: true
  description: 'Severity rating for anomaly events (''High''/''Medium''/''Low'');
    null for lifecycle events, which don''t carry a severity dimension. [Value Examples:
    ''High'', ''Medium'', ''Low'']'
- name: detected_at
  type: TIMESTAMP
  nullable: true
  description: Timestamp the event was detected/occurred — partition key (by month).
- name: district_id
  type: STRING
  nullable: true
  description: 'Foreign key to dim_district.district_id — partition key. [Value Examples:
    ''511'', ''502'', ''504'', ''755'', ''515'', ''746'']'
- name: mandal_id
  type: STRING
  nullable: true
  description: 'Foreign key to dim_mandal.mandal_id. [Value Examples: ''1086'', ''1073'',
    ''1021'', ''1016'', ''1031'', ''1013'']'
- name: village_name
  type: STRING
  nullable: true
  description: Village associated with the event.
- name: summary
  type: STRING
  nullable: true
  description: Human-readable one-line summary of the event.
- name: resolution_status
  type: STRING
  nullable: true
  description: 'Current status — lifecycle events use ''Published''/''Processing''/''Failed'';
    anomaly events use ''Open''/''Under Review''/''Resolved''. [Value Examples: ''Under
    Review'', ''Published'', ''Resolved'']'
  distinct:
  - Under Review
  - Published
  - Resolved
- name: household_id
  type: STRING
  nullable: true
  description: Foreign key to dim_household.household_id, where the event is household-scoped
    (e.g. DualLoanHousehold anomalies).
- name: department_id
  type: STRING
  nullable: true
  description: 'Foreign key to dim_department_client.department_id — the department
    this event is routed to/owned by. [Value Examples: ''DEPT-RTGS'', ''DEPT-EDU'',
    ''DEPT-HEALTH'', ''DEPT-REV'', ''DEPT-HUD'', ''DEPT-FCS'']'
  distinct:
  - DEPT-RTGS
  - DEPT-EDU
  - DEPT-HEALTH
  - DEPT-REV
  - DEPT-HUD
  - DEPT-FCS
  - DEPT-ENE
  - DEPT-IND
  - DEPT-AGRI
  - DEPT-RD
  - DEPT-SW
  - DEPT-WCD
  - DEPT-PG
  - DEPT-RTA
  - DEPT-FISH
- name: eventdata
  type: STRING
  nullable: true
  description: Base64-encoded JSON blob of event-type-specific structured detail —
    e.g. for DualLoanHousehold/PregnancyMismatch anomalies, the per-event loans[]/pregnancyRecords[]
    arrays are folded in here rather than joined from separate tables.
- name: linked_scheme_ids
  type: STRING
  nullable: true
  description: Comma-separated dim_scheme.scheme_id values linked to this event (e.g.
    schemes affected by a DeathRegistered event's entitlement closure).
primary_key:
- event_id
relationships:
- fact_event_details.person_id is a foreign key to dim_person.person_id.
- fact_event_details.district_id is a foreign key to dim_district.district_id.
- fact_event_details.mandal_id is a foreign key to dim_mandal.mandal_id.
- fact_event_details.household_id is a foreign key to dim_household.household_id.
- fact_event_details.department_id is a foreign key to dim_department.department_id.
business_terms:
- ap_citizen360
- data_transfer_api___unified_events
- fact
- Iceberg
- ICEBERG
common_operations:
- aggregate measures in fact_event_details by geography and time period
- join fact_event_details with dimension tables via person_id or district_id
- filter fact_event_details by district_id or date
