database: ap_citizen360
table: dim_occupation
department: ap_citizen360
description: Occupation history and current occupation — one row per person per occupation,
  since a citizen can hold more than one concurrently (e.g. farmer + seasonal MGNREGA
  labourer). Source of truth for occupation_type (including current via is_current);
  not denormalized onto dim_person.
table_format: ICEBERG
location: hdfs://ap-datalake/CURATED/ap_citizen360/dim_occupation
tblproperties:
  engine.hive.enabled: 'true'
  external: 'true'
  parquet.compression: SNAPPY
  table_type: ICEBERG
  write.delete.mode: merge-on-read
  write.format.default: parquet
  write.merge.mode: merge-on-read
  write.update.mode: merge-on-read
source_file: citizen360_canonical_schema.json
raw_ddl: |
  CREATE EXTERNAL TABLE `ap_citizen360`.`dim_occupation`(
    `occupation_record_id` STRING,
    `person_id` STRING,
    `occupation_type` STRING,
    `occupation_sector` STRING,
    `employer_name` STRING,
    `designation` STRING,
    `employment_status` STRING,
    `source` STRING,
    `occupation_year` STRING,
    `is_current` BOOLEAN,
    `updated_at` TIMESTAMP
  )
