database: ap_citizen360
table: dim_department
department: ap_citizen360
description: Canonical government department lookup — the department_id namespace
  referenced by entitlement, tax, health, agriculture, and social-welfare records
  to attribute which department owns a piece of citizen data. Distinct from dim_department_client,
  which is the separate Data Transfer API client-registry namespace (e.g. 'DEPT-SWD-001')
  used for authentication rather than data ownership.
table_format: ICEBERG
location: hdfs://ap-datalake/CURATED/ap_citizen360/dim_department
partitioned_by: district_id
tblproperties:
  engine.hive.enabled: 'true'
  external: 'true'
  parquet.compression: SNAPPY
  table_type: ICEBERG
  write.delete.mode: merge-on-read
  write.format.default: parquet
  write.merge.mode: merge-on-read
  write.update.mode: merge-on-read
source_file: citizen360_canonical_schema.json
raw_ddl: |
  CREATE EXTERNAL TABLE `ap_citizen360`.`dim_department`(
    `department_id` STRING,
    `department_name` STRING
  )
columns:
- name: department_id
  type: STRING
  nullable: true
  description: 'Canonical department code, e.g. ''DEPT-HEALTH''. [Value Examples:
    ''DEPT-AGRI'', ''DEPT-GOI'', ''DEPT-SW'', ''DEPT-PG'', ''DEPT-HUD'', ''DEPT-APMB'']'
  distinct:
  - DEPT-AGRI
  - DEPT-GOI
  - DEPT-SW
  - DEPT-PG
  - DEPT-HUD
  - DEPT-APMB
  - DEPT-RTA
  - DEPT-FISH
  - DEPT-REV
  - DEPT-EDU
  - DEPT-LABOUR
  - DEPT-IND
  - DEPT-SDMA
  - DEPT-HE
  - DEPT-SERP
  - DEPT-MEPMA
  - DEPT-FCS
  - DEPT-MIN
  - DEPT-RD
  - DEPT-SASA
  - DEPT-WCD
  - DEPT-RTGS
  - DEPT-HEALTH
  - DEPT-BC
  - DEPT-FIN
  - DEPT-AILABS
  - DEPT-ENE
- name: department_name
  type: STRING
  nullable: true
  description: 'Full department name, e.g. ''Health, Medical & Family Welfare''. [Value
    Examples: ''Food & Civil Supplies'', ''Women & Child Development (ICDS)'', ''Department
    of Energy'', ''Agriculture & Cooperation'', ''Higher Education'', ''Housing &
    Urban Development'']'
  distinct:
  - Food & Civil Supplies
  - Women & Child Development (ICDS)
  - Department of Energy
  - Agriculture & Cooperation
  - Higher Education
  - Housing & Urban Development
  - MEPMA (Urban Poverty Alleviation)
  - Government of India (Central Schemes)
  - Regional Transport Authority
  - Labour, Employment & Training
  - Swarna Andhra - Swachha Andhra
  - Fisheries
  - RTGS
  - Finance & Planning
  - AP Maritime Board
  - Health, Medical & Family Welfare
  - AILABS
  - Social Welfare & Tribal Welfare
  - Rural Development & Panchayati Raj
  - Revenue & Disaster Management
  - Petroleum, Gas & Energy
  - SERP / Stree Nidhi (Rural SHG Credit)
  - School Education
  - Department of Industries
  - Minority Welfare
  - Backward Classes Welfare
  - State Disaster Management Authority
primary_key:
- department_id
relationships:
- dim_department.department_id is a foreign key to dim_department.department_id.
business_terms:
- ap_citizen360
- schemes,_departments_and_governance
- dimension
- Hive
- Iceberg
- ICEBERG
common_operations:
- profile records in dim_department
- join dim_department to dim_person via person_id
- filter dim_department by district_id or mandal_id
