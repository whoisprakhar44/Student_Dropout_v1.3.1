- name: seating_capacity
  type: INT
  nullable: true
  description: Number of seats.
- name: unladen_weight_kg
  type: INT
  nullable: true
  description: Unladen (kerb) weight of the vehicle, in kilograms.
- name: laden_weight_kg
  type: INT
  nullable: true
  description: Gross/loaded weight of the vehicle, in kilograms — the counterpart
    to unladen_weight_kg (empty weight).
- name: registration_date
  type: DATE
  nullable: true
  description: Date the vehicle was first registered.
- name: rto_office
  type: STRING
  nullable: true
  description: Regional Transport Office that registered the vehicle.
- name: owner_name
  type: STRING
  nullable: true
  description: Registered owner's name (denormalized for display without a join to
    dim_person).
- name: owner_mobile_number
  type: STRING
  nullable: true
  description: Registered owner's contact mobile number on file with the RTO.
- name: data_source
  type: STRING
  nullable: true
  description: 'Source system this vehicle record was sourced from, e.g. ''VAHAN''.
    [Value Examples: ''Vahan'']'
  distinct:
  - Vahan
- name: updated_at
  type: TIMESTAMP
  nullable: true
  description: Timestamp this vehicle record was last updated.
primary_key:
- vehicle_id
relationships:
- dim_vehicle.person_id is a foreign key to dim_person.person_id.
- dim_vehicle.owner_name joins to dim_person (via owner_name).
business_terms:
- ap_citizen360
- assets_—_vehicles
- dimension
- Hive
- Iceberg
- ICEBERG
common_operations:
- profile records in dim_vehicle
- join dim_vehicle to dim_person via person_id
- filter dim_vehicle by district_id or mandal_id
