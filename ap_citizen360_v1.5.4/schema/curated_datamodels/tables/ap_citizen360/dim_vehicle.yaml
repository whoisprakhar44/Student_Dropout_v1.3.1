database: ap_citizen360
table: dim_vehicle
department: ap_citizen360
description: One row per vehicle owned — identity/registration details. Compliance/regulatory
  status (insurance, fitness, permits, challans) is split out into dim_vehicle_compliance
  to keep slow-changing compliance data separate from largely-static identity data.
table_format: ICEBERG
location: hdfs://ap-datalake/CURATED/ap_citizen360/dim_vehicle
tblproperties:
  engine.hive.enabled: 'true'
  external: 'true'
  parquet.compression: SNAPPY
  table_type: ICEBERG
  write.delete.mode: merge-on-read
  write.format.default: parquet
  write.merge.mode: merge-on-read
  write.update.mode: merge-on-read
source_file: citizen360_canonical_schema.json
raw_ddl: |
  CREATE EXTERNAL TABLE `ap_citizen360`.`dim_vehicle`(
    `vehicle_id` STRING,
    `person_id` STRING,
    `vehicle_type` STRING,
    `vehicle_class` STRING,
    `reg_no` STRING,
    `make` STRING,
    `model` STRING,
    `year_of_manufacture` INT,
    `fuel_type` STRING,
    `chassis_no` STRING,
    `engine_no` STRING,
    `color` STRING,
    `seating_capacity` INT,
    `unladen_weight_kg` INT,
    `laden_weight_kg` INT,
    `registration_date` DATE,
    `rto_office` STRING,
    `owner_name` STRING,
    `owner_mobile_number` STRING,
    `data_source` STRING,
    `updated_at` TIMESTAMP
  )
columns:
- name: vehicle_id
  type: STRING
  nullable: true
  description: Canonical vehicle identifier.
- name: person_id
  type: STRING
  nullable: true
  description: Foreign key to dim_person.person_id — the registered owner.
- name: vehicle_type
  type: STRING
  nullable: true
  description: 'Type of vehicle, e.g. ''Car'', ''Motorcycle'', ''Tractor''. [Value
    Examples: ''Motor Car'', ''Three Wheeler (Passenger)'', ''Goods Carrier'', ''Agricultural
    Tractor'', ''Trailer (Commercial)'', ''Tractor (Commercial)'']'
  distinct:
  - Motor Car
  - Three Wheeler (Passenger)
  - Goods Carrier
  - Agricultural Tractor
  - Trailer (Commercial)
  - Tractor (Commercial)
  - Trailer (Agricultural)
  - Three Wheeler (Goods)
