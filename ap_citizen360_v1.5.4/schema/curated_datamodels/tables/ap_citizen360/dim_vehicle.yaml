  - MEDIUM PASSENGER VEHICLE
  - HEAVY MOTOR VEHICLE
  - TWO WHEELER(T)
  - TWO WHEELER (Invalid Carriage)
  - FOUR WHEELER (Invalid Carriage)
- name: reg_no
  type: STRING
  nullable: true
  description: Vehicle registration number plate.
- name: make
  type: STRING
  nullable: true
  description: Vehicle manufacturer/make.
- name: model
  type: STRING
  nullable: true
  description: Vehicle model name.
- name: year_of_manufacture
  type: INT
  nullable: true
  description: Year the vehicle was manufactured.
- name: fuel_type
  type: STRING
  nullable: true
  description: 'Fuel type, e.g. ''Petrol'', ''Diesel''. [Value Examples: ''PETROL'',
    ''DIESEL'', ''NOT APPLICABLE'', ''ELECTRIC(BOV)'', ''PETROL(E20)'', ''PETROL/LPG'']'
