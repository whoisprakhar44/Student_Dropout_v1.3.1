    `secretariat_code` STRING,
    `secretariat_name` STRING,
    `mandal_id` STRING
  )
columns:
- name: secretariat_code
  type: STRING
  nullable: true
  description: Secretariat code PK.
- name: secretariat_name
  type: STRING
  nullable: true
