- name: mandal_id
  type: STRING
  nullable: true
  description: FK to dim_mandal.
primary_key:
- secretariat_code
relationships:
- dim_secretariat.mandal_id is a foreign key to dim_mandal.mandal_id.
business_terms:
- ap_citizen360
- geography
- dimension
- Iceberg
- ICEBERG
common_operations:
- filter dim_secretariat by secretariat_code
- join dim_secretariat with other entities via person_id or district_id
