- name: land_classification
  type: STRING
  nullable: true
  description: 'Revenue classification of the land, e.g. ''Wet'', ''Dry'', ''Garden''.
    [Value Examples: ''Dry'', ''Wet'', ''Poramboke'', ''Irrigated Dry'']'
  distinct:
  - Dry
  - Wet
  - Poramboke
  - Irrigated Dry
- name: acres
  type: DOUBLE
  nullable: true
  description: Total extent of the parcel, in acres.
- name: survey_no
  type: STRING
  nullable: true
  description: Revenue survey number of the parcel.
- name: sub_survey_no
  type: STRING
  nullable: true
  description: Sub-division of the survey number, where the parcel is a subdivided
    plot.
- name: hissa_no
  type: STRING
  nullable: true
  description: Hissa (further subdivision) number, where applicable.
- name: khata_no
  type: STRING
  nullable: true
  description: Khata (revenue account) number the parcel is recorded under.
- name: location
  type: STRING
  nullable: true
  description: Free-text location description of the parcel.
- name: district_id
  type: STRING
  nullable: true
  description: Foreign key to dim_district.district_id.
- name: mandal_id
  type: STRING
  nullable: true
  description: Foreign key to dim_mandal.mandal_id.
- name: village_name
  type: STRING
  nullable: true
  description: Village the parcel is located in.
- name: revenue_circle
  type: STRING
  nullable: true
  description: Revenue administrative circle covering the parcel.
- name: sro_office
  type: STRING
  nullable: true
  description: Sub-Registrar Office where the parcel's deed is registered.
- name: registration_no
  type: STRING
  nullable: true
  description: Deed registration number.
- name: pattadar_passbook_no
  type: STRING
  nullable: true
  description: Pattadar passbook (title document) number for the parcel.
- name: registration_date
  type: DATE
  nullable: true
  description: Date the current deed was registered.
- name: mutation_date
  type: DATE
  nullable: true
  description: Date land-records mutation (ownership transfer reflected in revenue
    records) was completed.
- name: market_value
  type: DECIMAL(12,2)
  nullable: true
  description: Estimated market value of the parcel, in INR.
- name: guideline_value
  type: DECIMAL(12,2)
  nullable: true
  description: Government guideline (registration) value of the parcel, in INR.
- name: stamp_duty_paid
  type: DECIMAL(10,2)
  nullable: true
  description: Stamp duty paid on the most recent registration, in INR.
- name: soil_type
  type: STRING
  nullable: true
  description: Soil type of the parcel, e.g. 'Black', 'Red', 'Alluvial' — relevant
    for agricultural parcels.
- name: irrigation_type
  type: STRING
  nullable: true
  description: Irrigation source/type for the parcel, e.g. 'Canal', 'Borewell', 'Rain-fed'.
- name: encumbrance_status
  type: STRING
  nullable: true
  description: Whether the parcel is encumbered (e.g. under mortgage), per the Encumbrance
    Certificate.
- name: mortgage_bank
  type: STRING
  nullable: true
  description: Bank holding a mortgage on the parcel, where encumbered.
- name: mortgage_amount
  type: DECIMAL(12,2)
  nullable: true
  description: Outstanding mortgage amount against the parcel, in INR.
- name: is_assigned_land
  type: BOOLEAN
  nullable: true
  description: 'True if this is government-assigned land (allotted under a land-assignment
    scheme) rather than freehold. [Value Examples: ''False'']'
  distinct:
  - 'False'
- name: extent_wet_land
  type: DOUBLE
  nullable: true
  description: Portion of the parcel's extent classified as wet (irrigated) land,
    in acres.
- name: extent_dry_land
  type: DOUBLE
  nullable: true
  description: Portion of the parcel's extent classified as dry (unirrigated) land,
    in acres.
- name: updated_at
  type: TIMESTAMP
  nullable: true
  description: Timestamp this land record was last updated.
- name: aadhaar_mapped
  type: STRING
  nullable: true
  description: 'Whether the land record is Aadhaar-mapped (Y/N). [Value Examples:
    ''Y'', ''N'']'
  distinct:
  - Y
  - N
primary_key:
- land_id
relationships:
- dim_land.person_id is a foreign key to dim_person.person_id.
- dim_land.district_id is a foreign key to dim_district.district_id.
- dim_land.mandal_id is a foreign key to dim_mandal.mandal_id.
business_terms:
- ap_citizen360
- assets_—_land_and_property
- dimension
- Hive
- Iceberg
- ICEBERG
common_operations:
- profile records in dim_land
- join dim_land to dim_person via person_id
- filter dim_land by district_id or mandal_id
