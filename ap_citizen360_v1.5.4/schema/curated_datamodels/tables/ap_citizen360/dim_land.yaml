database: ap_citizen360
table: dim_land
department: ap_citizen360
description: One row per land parcel owned — agricultural, residential, or commercial.
  Carries revenue-record detail (survey numbers, registration, mutation) as well as
  agronomic detail (soil, irrigation) for parcels used for farming.
table_format: ICEBERG
location: hdfs://ap-datalake/CURATED/ap_citizen360/dim_land
tblproperties:
  engine.hive.enabled: 'true'
  external: 'true'
  parquet.compression: SNAPPY
  table_type: ICEBERG
  write.delete.mode: merge-on-read
  write.format.default: parquet
  write.merge.mode: merge-on-read
  write.update.mode: merge-on-read
source_file: citizen360_canonical_schema.json
raw_ddl: |
  CREATE EXTERNAL TABLE `ap_citizen360`.`dim_land`(
    `land_id` STRING,
    `person_id` STRING,
    `land_type` STRING,
    `land_classification` STRING,
    `acres` DOUBLE,
    `survey_no` STRING,
    `sub_survey_no` STRING,
    `hissa_no` STRING,
    `khata_no` STRING,
    `location` STRING,
    `district_id` STRING,
    `mandal_id` STRING,
    `village_name` STRING,
    `revenue_circle` STRING,
    `sro_office` STRING,
    `registration_no` STRING,
    `pattadar_passbook_no` STRING,
    `registration_date` DATE,
    `mutation_date` DATE,
    `market_value` DECIMAL(12,2),
    `guideline_value` DECIMAL(12,2),
    `stamp_duty_paid` DECIMAL(10,2),
    `soil_type` STRING,
    `irrigation_type` STRING,
    `encumbrance_status` STRING,
    `mortgage_bank` STRING,
    `mortgage_amount` DECIMAL(12,2),
    `is_assigned_land` BOOLEAN,
    `extent_wet_land` DOUBLE,
    `extent_dry_land` DOUBLE,
    `updated_at` TIMESTAMP,
    `aadhaar_mapped` STRING
  )
columns:
