  type: STRING
  nullable: true
  description: Canonical land-parcel identifier.
- name: person_id
  type: STRING
  nullable: true
  description: Foreign key to dim_person.person_id — the owner.
- name: land_type
  type: STRING
  nullable: true
  description: Agricultural / Residential / Commercial classification of the parcel.
