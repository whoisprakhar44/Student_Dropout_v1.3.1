database: ap_citizen360
table: dim_utility_connection
department: ap_citizen360
description: One row per person summarizing their domestic gas, electricity, and water
  connection status.
table_format: ICEBERG
location: hdfs://ap-datalake/CURATED/ap_citizen360/dim_utility_connection
tblproperties:
  engine.hive.enabled: 'true'
  external: 'true'
  parquet.compression: SNAPPY
  table_type: ICEBERG
  write.delete.mode: merge-on-read
  write.format.default: parquet
  write.merge.mode: merge-on-read
  write.update.mode: merge-on-read
source_file: citizen360_canonical_schema.json
raw_ddl: |
  CREATE EXTERNAL TABLE `ap_citizen360`.`dim_utility_connection`(
    `person_id` STRING,
    `gas_connection_status` STRING,
    `electricity_status` STRING,
    `avg_monthly_kwh` INT,
    `water_connection_status` STRING,
    `electricity_sc_no` STRING,
    `discom_name` STRING,
    `electricity_status_updated_on` DATE,
    `updated_at` TIMESTAMP,
    `lpg_consumer_id` STRING
  )
columns:
- name: person_id
  type: STRING
  nullable: true
  description: Foreign key to dim_person.person_id.
- name: gas_connection_status
  type: STRING
  nullable: true
  description: 'Status of the domestic LPG connection, e.g. ''Active'', ''Inactive''.
    [Value Examples: ''Active_gsws'', ''Active'', ''Inactive'']'
  distinct:
  - Active_gsws
  - Active
  - Inactive
- name: electricity_status
  type: STRING
  nullable: true
  description: 'Status of the electricity connection, e.g. ''Active'', ''Inactive''.
    [Value Examples: ''Inactive'', ''Active'']'
  distinct:
  - Inactive
  - Active
- name: avg_monthly_kwh
  type: INT
  nullable: true
  description: Average monthly electricity consumption, in kWh.
- name: water_connection_status
  type: STRING
  nullable: true
  description: 'Status of the piped water connection, e.g. ''Active'', ''Inactive''.
    [Value Examples: ''Active'', ''Inactive'']'
  distinct:
  - Active
  - Inactive
- name: electricity_sc_no
  type: STRING
  nullable: true
  description: DISCOM service connection (SC) number for the electricity connection.
- name: discom_name
  type: STRING
  nullable: true
  description: 'Name of the electricity distribution company (DISCOM) serving this
    connection. [Value Examples: ''SPDCL'', ''EPDCL'', ''CPDCL'']'
  distinct:
  - SPDCL
  - EPDCL
  - CPDCL
- name: electricity_status_updated_on
  type: DATE
  nullable: true
  description: Date the electricity connection status was last confirmed/updated by
    the DISCOM.
- name: updated_at
  type: TIMESTAMP
  nullable: true
  description: Timestamp this utility record was last updated.
- name: lpg_consumer_id
  type: STRING
  nullable: true
  description: LPG consumer identifier for the household gas connection.
primary_key:
- person_id
relationships:
- dim_utility_connection.person_id is a foreign key to dim_person.person_id.
business_terms:
- ap_citizen360
- utilities
- dimension
- Hive
- Iceberg
- ICEBERG
common_operations:
- profile records in dim_utility_connection
- join dim_utility_connection to dim_person via person_id
- filter dim_utility_connection by district_id or mandal_id
