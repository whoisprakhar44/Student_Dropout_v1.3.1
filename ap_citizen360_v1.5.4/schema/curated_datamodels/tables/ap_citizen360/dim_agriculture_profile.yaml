database: ap_citizen360
table: dim_agriculture_profile
department: ap_citizen360
description: One row per person who is a registered farmer — landholding summary,
  crop information, irrigation, credit, and agricultural welfare-scheme enrollment.
  Complements dim_land (which records individual parcels) with a farmer-level rollup
  and scheme/credit detail land records don't carry.
table_format: ICEBERG
location: hdfs://ap-datalake/CURATED/ap_citizen360/dim_agriculture_profile
tblproperties:
  engine.hive.enabled: 'true'
  external: 'true'
  parquet.compression: SNAPPY
  table_type: ICEBERG
  write.delete.mode: merge-on-read
  write.format.default: parquet
  write.merge.mode: merge-on-read
  write.update.mode: merge-on-read
source_file: citizen360_canonical_schema.json
raw_ddl: |
  CREATE EXTERNAL TABLE `ap_citizen360`.`dim_agriculture_profile`(
    `person_id` STRING,
    `farmer_id` STRING,
    `farmer_type` STRING,
    `total_land_acres` DOUBLE,
    `irrigated_land_acres` DOUBLE,
    `dry_land_acres` DOUBLE,
    `primary_crop` STRING,
    `secondary_crop` STRING,
    `crop_season` STRING,
    `soil_health_card_no` STRING,
    `irrigation_source` STRING,
    `pump_set_hp` DOUBLE,
    `kcc_bank` STRING,
    `kcc_account_no` STRING,
    `kcc_limit` DECIMAL(12,2),
    `pm_kisan_beneficiary` BOOLEAN,
    `rythu_bharosa_beneficiary` BOOLEAN,
    `pmfby_enrolled` BOOLEAN,
    `market_linkage` STRING,
    `fpo_name` STRING,
    `last_yield_qtl_acre` DOUBLE,
    `department_id` STRING,
    `updated_at` TIMESTAMP,
    `aadhaar_mapped` STRING
  )
columns:
- name: person_id
  type: STRING
  nullable: true
  description: Foreign key to dim_person.person_id.
- name: farmer_id
  type: STRING
  nullable: true
  description: Department-issued farmer registration ID.
- name: farmer_type
  type: STRING
  nullable: true
  description: 'Landholding-size classification, e.g. ''Small'', ''Semi-medium'',
    ''Medium'', ''Large''. [Value Examples: ''Medium'', ''Semi-medium'', ''Marginal'',
    ''Large'', ''Small'']'
  distinct:
  - Medium
  - Semi-medium
  - Marginal
  - Large
  - Small
- name: total_land_acres
  type: DOUBLE
  nullable: true
  description: Total land held by the farmer, in acres (across all parcels).
- name: irrigated_land_acres
  type: DOUBLE
  nullable: true
  description: Portion of total land that is irrigated, in acres.
- name: dry_land_acres
  type: DOUBLE
  nullable: true
  description: Portion of total land that is unirrigated (dry), in acres.
- name: primary_crop
