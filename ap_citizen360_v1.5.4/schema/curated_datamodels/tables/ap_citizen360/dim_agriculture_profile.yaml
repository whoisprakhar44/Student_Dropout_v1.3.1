- name: crop_season
  type: STRING
  nullable: true
  description: Cropping season this record reflects, e.g. 'Kharif', 'Rabi'.
- name: soil_health_card_no
  type: STRING
  nullable: true
  description: Soil Health Card scheme registration number.
- name: irrigation_source
  type: STRING
  nullable: true
  description: 'Primary irrigation source, e.g. ''Borewell'', ''Canal'', ''Drip''.
    [Value Examples: ''Conventional/ Flooding'', ''Rainfed'', ''NA'', ''Drip System'',
    ''Sprinkler System'']'
  distinct:
  - Conventional/ Flooding
  - Rainfed
  - Drip System
  - Sprinkler System
- name: pump_set_hp
  type: DOUBLE
  nullable: true
  description: Horsepower of the farmer's irrigation pump set, where applicable.
- name: kcc_bank
  type: STRING
  nullable: true
  description: Bank that issued the farmer's Kisan Credit Card.
- name: kcc_account_no
  type: STRING
  nullable: true
  description: Kisan Credit Card account number.
- name: kcc_limit
  type: DECIMAL(12,2)
  nullable: true
  description: Sanctioned credit limit on the Kisan Credit Card, in INR.
- name: pm_kisan_beneficiary
  type: BOOLEAN
  nullable: true
  description: 'True if enrolled in the PM-KISAN income-support scheme. [Value Examples:
    ''True'', ''False'']'
  distinct:
  - 'True'
  - 'False'
- name: rythu_bharosa_beneficiary
  type: BOOLEAN
  nullable: true
  description: 'True if enrolled in the AP Rythu Bharosa farmer-support scheme. [Value
    Examples: ''True'', ''False'']'
  distinct:
  - 'True'
  - 'False'
- name: pmfby_enrolled
  type: BOOLEAN
  nullable: true
  description: 'True if enrolled in the Pradhan Mantri Fasal Bima Yojana crop insurance
    scheme. [Value Examples: ''False'']'
  distinct:
  - 'False'
- name: market_linkage
  type: STRING
  nullable: true
  description: Market/procurement channel the farmer is linked to, e.g. a specific
    mandi or FPO marketing tie-up.
- name: fpo_name
  type: STRING
  nullable: true
  description: Name of the Farmer Producer Organisation the farmer belongs to, if
    any.
- name: last_yield_qtl_acre
  type: DOUBLE
  nullable: true
  description: Most recent recorded yield, in quintals per acre.
- name: department_id
  type: STRING
  nullable: true
  description: 'Foreign key to dim_department.department_id — the Agriculture department
    record owner. [Value Examples: ''DEPT-AGRI'']'
  distinct:
  - DEPT-AGRI
- name: updated_at
  type: TIMESTAMP
  nullable: true
  description: Timestamp this agriculture profile was last updated.
- name: aadhaar_mapped
  type: STRING
  nullable: true
  description: 'Whether the farmer profile is Aadhaar-mapped (Y/N). [Value Examples:
    ''Y'', ''N'']'
  distinct:
  - Y
  - N
primary_key:
- person_id
relationships:
- dim_agriculture_profile.person_id is a foreign key to dim_person.person_id.
- dim_agriculture_profile.department_id is a foreign key to dim_department.department_id.
business_terms:
- ap_citizen360
- agriculture
- dimension
- Hive
- Iceberg
- ICEBERG
common_operations:
- profile records in dim_agriculture_profile
- join dim_agriculture_profile to dim_person via person_id
- filter dim_agriculture_profile by district_id or mandal_id
