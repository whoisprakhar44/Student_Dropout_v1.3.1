database: ap_citizen360
table: dim_scheme_main_mapping
department: ap_citizen360
description: Maps each leaf scheme_id to a main (parent) scheme_id so variants roll
  up together in counts, disbursement totals, and the Schemes UI. A scheme with no
  row here is treated as its own main scheme.
table_format: ICEBERG
location: hdfs://ap-datalake/CURATED/ap_citizen360/dim_scheme_main_mapping
partitioned_by: district_id
tblproperties:
  engine.hive.enabled: 'true'
  external: 'true'
  parquet.compression: SNAPPY
  table_type: ICEBERG
  write.delete.mode: merge-on-read
  write.format.default: parquet
  write.merge.mode: merge-on-read
  write.update.mode: merge-on-read
source_file: citizen360_canonical_schema.json
raw_ddl: |
  CREATE EXTERNAL TABLE `ap_citizen360`.`dim_scheme_main_mapping`(
    `scheme_id` STRING,
    `main_scheme_id` STRING,
    `updated_at` TIMESTAMP
  )
columns:
- name: scheme_id
  type: STRING
  nullable: true
  description: 'Leaf / actual scheme id from dim_scheme. [Value Examples: ''SCH-055'',
    ''SCH-050'', ''SCH-024'', ''SCH-049'', ''SCH-057'', ''SCH-052'']'
  distinct:
  - SCH-055
  - SCH-050
  - SCH-024
  - SCH-049
  - SCH-057
  - SCH-052
  - SCH-051
  - SCH-056
  - SCH-025
  - SCH-054
  - SCH-062
  - SCH-047
  - SCH-053
  - SCH-046
  - SCH-048
  - SCH-023
- name: main_scheme_id
  type: STRING
  nullable: true
  description: 'Parent / main scheme id from dim_scheme that this leaf rolls up under.
    [Value Examples: ''SCH-062'']'
  distinct:
  - SCH-062
- name: updated_at
  type: TIMESTAMP
  nullable: true
  description: When this mapping row was last updated.
primary_key:
- scheme_id
relationships:
- dim_scheme_main_mapping.scheme_id is a foreign key to dim_scheme.scheme_id.
business_terms:
- ap_citizen360
- schemes,_departments___governance
- dimension
- Iceberg
- ICEBERG
common_operations:
- filter dim_scheme_main_mapping by scheme_id
- join dim_scheme_main_mapping with other entities via person_id or district_id
