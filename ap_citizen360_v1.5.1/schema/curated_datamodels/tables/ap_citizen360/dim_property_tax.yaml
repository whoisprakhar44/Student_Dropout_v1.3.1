database: ap_citizen360
table: dim_property_tax
department: ap_citizen360
description: One row per property per assessment year — municipal property tax demand, dues, and payment status. Joins back
  to dim_property via ptin.
table_format: ICEBERG
location: hdfs://ap-datalake/CURATED/ap_citizen360/dim_property_tax
partitioned_by: null
tblproperties:
  engine.hive.enabled: 'true'
  external: 'true'
  parquet.compression: SNAPPY
  table_type: ICEBERG
  write.delete.mode: merge-on-read
  write.format.default: parquet
  write.merge.mode: merge-on-read
  write.update.mode: merge-on-read
source_file: citizen360_canonical_schema.json
raw_ddl: "CREATE EXTERNAL TABLE `ap_citizen360`.`dim_property_tax`(\n  `person_id` STRING COMMENT 'Primary Key: Foreign key\
  \ to dim_person.person_id — the property owner liable for the tax.',\n  `ptin` STRING COMMENT 'Primary Key: Property Tax\
  \ Identification Number — joins to dim_property.ptin.',\n  `assessment_year` STRING COMMENT 'Primary Key: Financial/assessment\
  \ year this tax record covers.',\n  `annual_demand_rs` DECIMAL(12,2) COMMENT 'Annual property tax demand for this assessment\
  \ year, in INR. Unit: INR.',\n  `arrears_rs` DECIMAL(12,2) COMMENT 'Arrears carried over from prior assessment years, in\
  \ INR. Unit: INR.',\n  `total_due_rs` DECIMAL(12,2) COMMENT 'Total amount currently due (demand + arrears − paid), in INR.\
  \ Unit: INR.',\n  `amount_paid_rs` DECIMAL(12,2) COMMENT 'Amount paid against this assessment year\\'s demand, in INR. Unit:\
  \ INR.',\n  `tax_status` STRING COMMENT 'Current payment status, e.g. \\'Up-to-date\\', \\'Due\\'. [Value Examples: \\'Up-to-date\\\
  ', \\'Due\\']',\n  `last_paid_date` DATE COMMENT 'Date of the most recent payment.',\n  `payment_mode` STRING COMMENT 'Mode\
  \ of the most recent payment, e.g. \\'Online\\', \\'Counter\\'. [Value Examples: \\'Online\\', \\'Counter\\']',\n  `exemption_category`\
  \ STRING COMMENT 'Exemption category applied, if the property qualifies for a tax exemption/concession.',\n  `municipal_body`\
  \ STRING COMMENT 'Municipal body that raised this assessment.',\n  `department_id` STRING COMMENT 'Foreign Key: References\
  \ dim_department.department_id. the municipal/revenue department owning this tax record.',\n  `updated_at` TIMESTAMP COMMENT\
  \ 'Timestamp this tax record was last updated.')\nROW FORMAT SERDE\n  'org.apache.iceberg.mr.hive.HiveIcebergSerDe'\nSTORED\
  \ BY\n  'org.apache.iceberg.mr.hive.HiveIcebergStorageHandler'\n\nLOCATION\n  'hdfs://ap-datalake/CURATED/ap_citizen360/dim_property_tax'"
columns:
- name: person_id
  type: STRING
  nullable: true
  description: 'Primary Key: Foreign key to dim_person.person_id — the property owner liable for the tax.'
- name: ptin
  type: STRING
  nullable: true
  description: 'Primary Key: Property Tax Identification Number — joins to dim_property.ptin.'
- name: assessment_year
  type: STRING
  nullable: true
  description: 'Primary Key: Financial/assessment year this tax record covers.'
- name: annual_demand_rs
  type: DECIMAL(12,2)
  nullable: true
  description: 'Annual property tax demand for this assessment year, in INR. Unit: INR.'
- name: arrears_rs
  type: DECIMAL(12,2)
  nullable: true
  description: 'Arrears carried over from prior assessment years, in INR. Unit: INR.'
- name: total_due_rs
  type: DECIMAL(12,2)
  nullable: true
  description: 'Total amount currently due (demand + arrears − paid), in INR. Unit: INR.'
- name: amount_paid_rs
  type: DECIMAL(12,2)
  nullable: true
  description: 'Amount paid against this assessment year''s demand, in INR. Unit: INR.'
- name: tax_status
  type: STRING
  nullable: true
  description: 'Current payment status, e.g. ''Up-to-date'', ''Due''. [Value Examples: ''Up-to-date'', ''Due'']'
- name: last_paid_date
  type: DATE
  nullable: true
  description: Date of the most recent payment.
- name: payment_mode
  type: STRING
  nullable: true
  description: 'Mode of the most recent payment, e.g. ''Online'', ''Counter''. [Value Examples: ''Online'', ''Counter'']'
- name: exemption_category
  type: STRING
  nullable: true
  description: Exemption category applied, if the property qualifies for a tax exemption/concession.
- name: municipal_body
  type: STRING
  nullable: true
  description: Municipal body that raised this assessment.
- name: department_id
  type: STRING
  nullable: true
  description: 'Foreign Key: References dim_department.department_id. the municipal/revenue department owning this tax record.'
- name: updated_at
  type: TIMESTAMP
  nullable: true
  description: Timestamp this tax record was last updated.
primary_key:
- person_id
- ptin
- assessment_year
relationships:
- dim_property_tax.person_id is a foreign key to dim_person.person_id.
- dim_property_tax.ptin joins to dim_property.ptin.
- dim_property_tax.department_id is a foreign key to dim_department.department_id.
business_terms:
- ap_citizen360
- assets_—_land_and_property
- dimension
- Hive
- Iceberg
- ICEBERG
common_operations:
- profile records in dim_property_tax
- join dim_property_tax to dim_person via person_id
- filter dim_property_tax by district_id or mandal_id
