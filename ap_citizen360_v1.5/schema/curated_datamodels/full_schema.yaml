  source_file: ap_community360_canonical_schema.json
  raw_ddl: "CREATE EXTERNAL TABLE `ap_community360`.`dim_facility_identifier`(\n  `facility_identifier_id` BIGINT COMMENT\
    \ 'Primary Key: identifier row.',\n  `canonical_facility_id` STRING COMMENT 'FK to dim_facility.canonical_facility_id.',\n\
    \  `identifier_type` STRING COMMENT 'What kind of identifier this is, e.g. \\'UDISE_CODE\\', \\'HMIS_CODE\\', \\'AWC_CODE\\\
    '. [Value Examples: \\'UDISE_CODE\\', \\'HMIS_CODE\\', \\'AWC_CODE\\']',\n  `identifier_value_hash` STRING COMMENT 'Hashed\
    \ identifier value — stored hashed rather than plaintext since some source-system codes are treated as sensitive/internal.',\n\
    \  `id_class` STRING COMMENT 'Classification of the identifier, e.g. \\'govt\\' | \\'internal\\' — informs which consumers\
