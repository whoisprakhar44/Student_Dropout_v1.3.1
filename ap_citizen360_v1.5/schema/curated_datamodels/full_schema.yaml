    \ override — see dim_facility.ownership_type for the actual per-row value).',\n  `parent_type_id` INT COMMENT 'Self-referencing\
    \ FK to facility_type_id, for hierarchical types (e.g. a specialty clinic as a sub-type of Hospital). NULL for top-level\
    \ types.',\n  `subtype_table` STRING COMMENT 'Name of the ap_community360 table holding this type\\'s extra attributes\
    \ (e.g. \\'dim_facility_school\\'). NULL when a type has no subtype attributes yet (e.g. Govt Office). [Value Examples:\
