  source_file: citizen360_canonical_schema.json
  raw_ddl: "CREATE EXTERNAL TABLE `ap_citizen360`.`dim_agriculture_profile`(\n  `person_id` STRING COMMENT 'Primary Key: Foreign\
    \ key to dim_person.person_id.',\n  `farmer_id` STRING COMMENT 'Department-issued farmer registration ID.',\n  `farmer_type`\
    \ STRING COMMENT 'Landholding-size classification, e.g. \\'Small\\', \\'Semi-medium\\', \\'Medium\\', \\'Large\\'. [Value\
    \ Examples: \\'Small\\', \\'Semi-medium\\', \\'Medium\\', \\'Large\\']',\n  `total_land_acres` DOUBLE COMMENT 'Total land\
    \ held by the farmer, in acres (across all parcels). Unit: acres.',\n  `irrigated_land_acres` DOUBLE COMMENT 'Portion\
    \ of total land that is irrigated, in acres. Unit: acres.',\n  `dry_land_acres` DOUBLE COMMENT 'Portion of total land\
    \ that is unirrigated (dry), in acres. Unit: acres.',\n  `primary_crop` STRING COMMENT 'Primary crop grown.',\n  `secondary_crop`\
    \ STRING COMMENT 'Secondary crop grown, where applicable.',\n  `crop_season` STRING COMMENT 'Cropping season this record\
    \ reflects, e.g. \\'Kharif\\', \\'Rabi\\'. [Value Examples: \\'Kharif\\', \\'Rabi\\']',\n  `crop_types` ARRAY<STRING>\
    \ COMMENT 'ARRAY<STRING> column. Contains crop types grown by this farmer across seasons/parcels.',\n  `land_reg_nos`\
    \ ARRAY<STRING> COMMENT 'ARRAY<STRING> column. Contains registration numbers (cross-referencing dim_land.registration_no)\
    \ held by this farmer.',\n  `soil_health_card_no` STRING COMMENT 'Soil Health Card scheme registration number.',\n  `irrigation_source`\
    \ STRING COMMENT 'Primary irrigation source, e.g. \\'Borewell\\', \\'Canal\\', \\'Drip\\'. [Value Examples: \\'Borewell\\\
    ', \\'Canal\\', \\'Drip\\']',\n  `pump_set_hp` DOUBLE COMMENT 'Horsepower of the farmer\\'s irrigation pump set, where\
    \ applicable.',\n  `kcc_bank` STRING COMMENT 'Bank that issued the farmer\\'s Kisan Credit Card.',\n  `kcc_account_no`\
    \ STRING COMMENT 'Kisan Credit Card account number.',\n  `kcc_limit` DECIMAL(12,2) COMMENT 'Sanctioned credit limit on\
    \ the Kisan Credit Card, in INR. Unit: INR.',\n  `pm_kisan_beneficiary` BOOLEAN COMMENT 'Boolean flag. True if enrolled\
    \ in the pm-kisan income-support scheme.',\n  `rythu_bharosa_beneficiary` BOOLEAN COMMENT 'Boolean flag. True if enrolled\
    \ in the ap rythu bharosa farmer-support scheme.',\n  `pmfby_enrolled` BOOLEAN COMMENT 'Boolean flag. True if enrolled\
    \ in the pradhan mantri fasal bima yojana crop insurance scheme.',\n  `market_linkage` STRING COMMENT 'Market/procurement\
    \ channel the farmer is linked to, e.g. a specific mandi or FPO marketing tie-up.',\n  `fpo_name` STRING COMMENT 'Name\
    \ of the Farmer Producer Organisation the farmer belongs to, if any.',\n  `last_yield_qtl_acre` DOUBLE COMMENT 'Most recent\
    \ recorded yield, in quintals per acre.',\n  `linked_scheme_ids` ARRAY<STRING> COMMENT 'ARRAY<STRING> column. Contains\
    \ Array of dim_scheme.scheme_id values for every agriculture-related welfare scheme this farmer is linked to.',\n  `department_id`\
    \ STRING COMMENT 'Foreign Key: References dim_department.department_id. the Agriculture department record owner.',\n \
    \ `updated_at` TIMESTAMP COMMENT 'Timestamp this agriculture profile was last updated.')\nROW FORMAT SERDE\n  'org.apache.iceberg.mr.hive.HiveIcebergSerDe'\n\
    STORED BY\n  'org.apache.iceberg.mr.hive.HiveIcebergStorageHandler'\n\nLOCATION\n  'hdfs://ap-datalake/CURATED/ap_citizen360/dim_agriculture_profile'"
