    \ in INR. Unit: INR.',\n  `amount_paid_rs` DECIMAL(12,2) COMMENT 'Amount paid against this assessment year\\'s demand,\
    \ in INR. Unit: INR.',\n  `tax_status` STRING COMMENT 'Current payment status, e.g. \\'Up-to-date\\', \\'Due\\'. [Value\
