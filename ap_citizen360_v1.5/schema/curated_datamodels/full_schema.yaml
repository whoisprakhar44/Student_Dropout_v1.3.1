    \ system this identifier came from.',\n  `match_method` STRING COMMENT 'How this identifier was linked to the facility,\
    \ e.g. \\'exact\\' | \\'fuzzy\\' | \\'manual\\' — the entity-resolution method used. [Value Examples: \\'exact\\', \\\
    'fuzzy\\', \\'manual\\']',\n  `confidence_score` DECIMAL(4,3) COMMENT 'Confidence (0-1) that this identifier genuinely\
    \ belongs to this facility, from the match_method\\'s resolution process.',\n  `valid_from` TIMESTAMP COMMENT 'Start of\
    \ this identifier mapping\\'s validity.',\n  `valid_to` TIMESTAMP COMMENT 'End of this identifier mapping\\'s validity;\
    \ NULL while active.',\n  `is_active` BOOLEAN COMMENT 'Boolean flag. True if this identifier mapping is currently active.',\n\
