    \ STRING COMMENT 'Categorical column. Distinct values: \\'Row lifecycle flag, e.g. \\'ACTIVE\\', \\'RETIRED\\'.\\'. Row\
    \ lifecycle flag, e.g. \\'ACTIVE\\' | \\'RETIRED\\'. [Value Examples: \\'ACTIVE\\', \\'RETIRED\\']')\nROW FORMAT SERDE\n\
    \  'org.apache.iceberg.mr.hive.HiveIcebergSerDe'\nSTORED BY\n  'org.apache.iceberg.mr.hive.HiveIcebergStorageHandler'\n\
    \nLOCATION\n  'hdfs://ap-datalake/CURATED/ap_community360/dim_facility_identifier'"
