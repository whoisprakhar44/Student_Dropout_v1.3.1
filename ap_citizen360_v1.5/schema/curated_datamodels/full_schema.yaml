title: AP Citizen 360 + AP Community 360 — Combined Canonical Schema
description: All RAG-indexed tables from ap_citizen360 and ap_community360.
databases:
- ap_community360
- ap_citizen360
tables:
- database: ap_citizen360
  table: dim_state
  department: ap_citizen360
  description: One row per state per effective-dated period (slowly-changing dimension via effective_from/effective_to/is_current)
    — currently only Andhra Pradesh. Backs the State Profile view and top-of-hierarchy rollups.
  table_format: ICEBERG
  location: hdfs://ap-datalake/CURATED/ap_citizen360/dim_state
  partitioned_by: null
  tblproperties:
    engine.hive.enabled: 'true'
    external: 'true'
    parquet.compression: SNAPPY
    table_type: ICEBERG
    write.delete.mode: merge-on-read
    write.format.default: parquet
    write.merge.mode: merge-on-read
    write.update.mode: merge-on-read
  source_file: citizen360_canonical_schema.json
  raw_ddl: "CREATE EXTERNAL TABLE `ap_citizen360`.`dim_state`(\n  `state_id` STRING COMMENT 'Primary Key: state code, e.g.\
    \ \\'ap\\'.',\n  `state_name` STRING COMMENT 'Full state name, e.g. \\'Andhra Pradesh\\'. [Value Examples: \\'Andhra Pradesh\\\
    ']',\n  `population` BIGINT COMMENT 'Categorical column. Distinct values: \\'Total state population (census\\', \\'projected).\\\
    '. Total state population (census/projected).',\n  `households` BIGINT COMMENT 'Total household count in the state.',\n\
    \  `literacy_rate` DOUBLE COMMENT 'State literacy rate, percentage (0-100). Unit: percentage (0-100).',\n  `sex_ratio`\
    \ INT COMMENT 'Females per 1000 males.',\n  `districts_count` INT COMMENT 'Number of districts in the state.',\n  `mandals_count`\
    \ INT COMMENT 'Number of mandals across all districts.',\n  `villages_count` INT COMMENT 'Number of villages/habitations\
    \ across all mandals.',\n  `median_age` DOUBLE COMMENT 'Median age of the population, in years.',\n  `urbanization_pct`\
    \ DOUBLE COMMENT 'Percentage of population classified urban. Unit: percentage (0-100).',\n  `gross_state_income_cr` BIGINT\
    \ COMMENT 'Categorical column. Distinct values: \\'Gross state income\\', \\'product, in INR crores.\\'. Gross state income/product,\
    \ in INR crores.',\n  `electricity_consumers` BIGINT COMMENT 'Total registered electricity consumer connections.',\n \
    \ `avg_monthly_kwh` INT COMMENT 'Average monthly electricity consumption per consumer, in kWh. Unit: kWh.',\n  `property_tax_collected`\
    \ BIGINT COMMENT 'Total property tax collected statewide, in INR. Unit: INR.',\n  `agri_land_acres` BIGINT COMMENT 'Total\
    \ agricultural land extent, in acres. Unit: acres.',\n  `ration_cards_total` BIGINT COMMENT 'Total NFSA ration cards issued\
    \ statewide.',\n  `ration_aay` BIGINT COMMENT 'Ration cards under the Antyodaya Anna Yojana (poorest-of-poor) category.',\n\
    \  `ration_phh` BIGINT COMMENT 'Ration cards under the Priority Household category.',\n  `ration_nphh` BIGINT COMMENT\
    \ 'Ration cards under the Non-Priority Household category.',\n  `ration_others` BIGINT COMMENT 'Categorical column. Distinct\
    \ values: \\'Ration cards under other\\', \\'legacy categories not covered above.\\'. Ration cards under other/legacy\
    \ categories not covered above.',\n  `effective_from` DATE COMMENT 'Start date this snapshot row is valid from (SCD2 versioning).',\n\
    \  `effective_to` DATE COMMENT 'End date this snapshot row is valid until; null/open-ended for the current row.',\n  `is_current`\
    \ BOOLEAN COMMENT 'Boolean flag. True if this is the latest/active version of the state snapshot.')\nROW FORMAT SERDE\n\
    \  'org.apache.iceberg.mr.hive.HiveIcebergSerDe'\nSTORED BY\n  'org.apache.iceberg.mr.hive.HiveIcebergStorageHandler'\n\
    \nLOCATION\n  'hdfs://ap-datalake/CURATED/ap_citizen360/dim_state'"
  columns:
  - name: state_id
    type: STRING
    nullable: true
    description: 'Primary Key: state code, e.g. ''ap''.'
  - name: state_name
    type: STRING
    nullable: true
    description: 'Full state name, e.g. ''Andhra Pradesh''. [Value Examples: ''Andhra Pradesh'']'
  - name: population
