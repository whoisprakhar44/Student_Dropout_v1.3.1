  source_file: citizen360_canonical_schema.json
  raw_ddl: "CREATE EXTERNAL TABLE `ap_citizen360`.`dim_health_profile`(\n  `person_id` STRING COMMENT 'Primary Key: Foreign\
    \ key to dim_person.person_id.',\n  `abdm_id` STRING COMMENT 'Ayushman Bharat Digital Mission health ID.',\n  `abha_address`\
    \ STRING COMMENT 'Ayushman Bharat Health Account address (the ABDM health-ID\\'s human-readable handle).',\n  `aarogyasri_card_no`\
    \ STRING COMMENT 'NTR Vaidya Seva (Aarogyasri) health insurance card number.',\n  `aarogyasri_status` STRING COMMENT 'Enrollment\
    \ status under Aarogyasri, e.g. \\'Active\\', \\'Not Enrolled\\'. [Value Examples: \\'Active\\', \\'Not Enrolled\\']',\n\
    \  `pmjay_beneficiary_id` STRING COMMENT 'Ayushman Bharat PM-JAY beneficiary ID.',\n  `pmjay_family_id` STRING COMMENT\
    \ 'Ayushman Bharat PM-JAY family unit ID.',\n  `blood_group` STRING COMMENT 'Blood group, e.g. \\'O+\\', \\'AB-\\'. [Value\
    \ Examples: \\'O+\\', \\'AB-\\']',\n  `height_cm` INT COMMENT 'Height in centimetres, from the most recent recorded measurement.',\n\
    \  `weight_kg` DOUBLE COMMENT 'Weight in kilograms, from the most recent recorded measurement.',\n  `bmi` DOUBLE COMMENT\
    \ 'Body mass index, computed from the most recent height/weight.',\n  `conditions` ARRAY<STRING> COMMENT 'ARRAY<STRING>\
    \ column. Contains chronic conditions/diagnoses on file, beyond the specific boolean flags below.',\n  `has_diabetes`\
    \ BOOLEAN COMMENT 'Boolean flag. True if diagnosed with diabetes.',\n  `has_hypertension` BOOLEAN COMMENT 'Boolean flag.\
    \ True if diagnosed with hypertension.',\n  `has_tuberculosis` BOOLEAN COMMENT 'Boolean flag. True if diagnosed with active\
    \ or treated tuberculosis.',\n  `has_hiv` BOOLEAN COMMENT 'Boolean flag. True if hiv-positive per health records.',\n\
    \  `has_cancer` BOOLEAN COMMENT 'Boolean flag. True if diagnosed with cancer (any type).',\n  `registered_phc` STRING\
    \ COMMENT 'Primary Health Centre the person is registered with.',\n  `assigned_asha_worker` STRING COMMENT 'Name/ID of\
    \ the assigned ASHA (community health) worker.',\n  `is_pregnant` BOOLEAN COMMENT 'Boolean flag. True if currently pregnant\
    \ per the latest anc record.',\n  `lmp_date` DATE COMMENT 'Last menstrual period date, for current/recent pregnancies.',\n\
    \  `edd_date` DATE COMMENT 'Expected date of delivery, for current pregnancies.',\n  `anc_registrations` INT COMMENT 'Count\
    \ of antenatal care check-up registrations for the current/most recent pregnancy.',\n  `institutional_delivery` BOOLEAN\
    \ COMMENT 'Boolean flag. True if the most recent delivery took place in a healthcare institution rather than at home.',\n\
    \  `covid_vaccinated` BOOLEAN COMMENT 'Boolean flag. True if the person has received at least one covid-19 vaccine dose.',\n\
    \  `covid_doses` INT COMMENT 'Total number of COVID-19 vaccine doses received.',\n  `esi_covered` BOOLEAN COMMENT 'Boolean\
    \ flag. True if covered under employee state insurance.',\n  `cghs_covered` BOOLEAN COMMENT 'Boolean flag. True if covered\
    \ under the central government health scheme.',\n  `rsby_covered` BOOLEAN COMMENT 'Boolean flag. True if covered under\
    \ the rashtriya swasthya bima yojana.',\n  `has_mental_health_condition` BOOLEAN COMMENT 'Boolean flag. True if a mental\
    \ health condition is on file.',\n  `mental_health_type` STRING COMMENT 'Type of mental health condition, where has_mental_health_condition\
    \ is true.',\n  `last_encounter_date` DATE COMMENT 'Date of the most recent recorded healthcare encounter of any kind.',\n\
    \  `linked_scheme_ids` ARRAY<STRING> COMMENT 'ARRAY<STRING> column. Contains Array of dim_scheme.scheme_id values for\
    \ every health-related welfare scheme this person is linked to.',\n  `department_id` STRING COMMENT 'Foreign Key: References\
    \ dim_department.department_id. the Health department record owner.',\n  `updated_at` TIMESTAMP COMMENT 'Timestamp this\
    \ health profile was last updated.')\nROW FORMAT SERDE\n  'org.apache.iceberg.mr.hive.HiveIcebergSerDe'\nSTORED BY\n \
    \ 'org.apache.iceberg.mr.hive.HiveIcebergStorageHandler'\n\nLOCATION\n  'hdfs://ap-datalake/CURATED/ap_citizen360/dim_health_profile'"
