    nullable: true
    description: 'Categorical column. Distinct values: ''District ration cards under other'', ''legacy categories.''. District
      ration cards under other/legacy categories.'
  - name: vehicles
    type: BIGINT
    nullable: true
    description: Total registered vehicles in the district.
  - name: land_acres
    type: BIGINT
    nullable: true
    description: 'Total land extent recorded in the district, in acres. Unit: acres.'
  - name: agri_land_acres
    type: BIGINT
    nullable: true
    description: 'Total agricultural land extent in the district, in acres. Unit: acres.'
  - name: properties
    type: BIGINT
    nullable: true
    description: 'Categorical column. Distinct values: ''Total registered properties (residential'', ''commercial) in the
      district.''. Total registered properties (residential/commercial) in the district.'
  - name: gas_connections
    type: BIGINT
    nullable: true
    description: Total registered domestic gas connections in the district.
  - name: electricity_consumers
    type: BIGINT
    nullable: true
    description: Total registered electricity consumer connections in the district.
  - name: avg_monthly_kwh
    type: INT
    nullable: true
    description: 'Average monthly electricity consumption per consumer, in kWh. Unit: kWh.'
  - name: property_tax_coverage
    type: INT
    nullable: true
    description: 'Percentage of assessed properties that are current on property tax. Unit: percentage (0-100).'
  - name: effective_from
    type: DATE
    nullable: true
    description: Start date this snapshot row is valid from (SCD2 versioning).
  - name: effective_to
    type: DATE
    nullable: true
    description: End date this snapshot row is valid until; null/open-ended for the current row.
  - name: is_current
