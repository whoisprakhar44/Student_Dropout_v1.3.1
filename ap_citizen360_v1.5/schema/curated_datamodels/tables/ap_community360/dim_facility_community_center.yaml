database: ap_community360
table: dim_facility_community_center
department: ap_community360
description: Community hall / Kalyana Mandapam-specific attributes — capacity, amenities, and rental terms. One row per facility
  where dim_facility.facility_type_id resolves to the COMMUNITY_CENTER type.
table_format: ICEBERG
location: hdfs://ap-datalake/CURATED/ap_community360/dim_facility_community_center
partitioned_by: null
tblproperties:
  engine.hive.enabled: 'true'
  external: 'true'
  parquet.compression: SNAPPY
  table_type: ICEBERG
  write.delete.mode: merge-on-read
  write.format.default: parquet
  write.merge.mode: merge-on-read
  write.update.mode: merge-on-read
source_file: ap_community360_canonical_schema.json
raw_ddl: "CREATE EXTERNAL TABLE `ap_community360`.`dim_facility_community_center`(\n  `canonical_facility_id` STRING COMMENT\
  \ 'Primary Key: FK to dim_facility.canonical_facility_id.',\n  `center_type` STRING COMMENT 'Type of venue, e.g. \\'Kalyana\
  \ Mandapam\\' (marriage hall) | \\'Community Hall\\'. [Value Examples: \\'Kalyana Mandapam\\', \\'Community Hall\\']',\n\
  \  `managing_authority` STRING COMMENT 'Categorical column. Distinct values: \\'Body managing bookings\\', \\'upkeep of\
  \ this center.\\'. Body managing bookings/upkeep of this center.',\n  `seating_capacity` INT COMMENT 'Maximum seating capacity.',\n\
  \  `hall_area_sqft` DECIMAL(10,2) COMMENT 'Hall floor area in square feet.',\n  `has_stage` BOOLEAN COMMENT 'Boolean flag.\
  \ True if a stage is present.',\n  `has_kitchen` BOOLEAN COMMENT 'Boolean flag. True if a kitchen/catering area is present.',\n\
  \  `has_ac` BOOLEAN COMMENT 'Boolean flag. True if the hall is air-conditioned.',\n  `has_power_backup` BOOLEAN COMMENT\
  \ 'Boolean flag. True if generator/power backup is available.',\n  `has_parking` BOOLEAN COMMENT 'Boolean flag. True if\
  \ dedicated parking is available.',\n  `has_toilets` BOOLEAN COMMENT 'Boolean flag. True if toilet facilities are available.',\n\
  \  `is_disabled_friendly` BOOLEAN COMMENT 'Boolean flag. True if the venue has step-free/accessible access.',\n  `amenities`\
  \ ARRAY<STRING> COMMENT 'ARRAY<STRING> column. Contains Additional amenities available, e.g. [\\'Sound System\\', \\'Generator\\\
  '].',\n  `rental_available` BOOLEAN COMMENT 'Boolean flag. True if the venue can be booked by the public.',\n  `rental_rate_per_day`\
  \ DECIMAL(10,2) COMMENT 'Daily rental rate in INR, when rental_available is true. Unit: INR.',\n  `source_system` STRING\
  \ COMMENT 'Upstream system this row was loaded from, e.g. \\'udise_plus\\', \\'hmis\\', \\'seed\\'. [Value Examples: \\\
  'udise_plus\\', \\'hmis\\', \\'seed\\']',\n  `batch_id` STRING COMMENT 'Load batch identifier — groups every row written\
  \ by the same ingestion run, for reprocessing/rollback.',\n  `load_ts` TIMESTAMP COMMENT 'When this row was first written\
  \ to the canonical table.',\n  `updated_ts` TIMESTAMP COMMENT 'Categorical column. Distinct values: \\'When this row was\
  \ last updated (upsert\\', \\'merge timestamp).\\'. When this row was last updated (upsert/merge timestamp).',\n  `record_status`\
  \ STRING COMMENT 'Row lifecycle flag, e.g. \\'ACTIVE\\' | \\'RETIRED\\' — soft-delete marker; rows are never hard-deleted.\
  \ [Value Examples: \\'ACTIVE\\', \\'RETIRED\\']')\nROW FORMAT SERDE\n  'org.apache.iceberg.mr.hive.HiveIcebergSerDe'\nSTORED\
  \ BY\n  'org.apache.iceberg.mr.hive.HiveIcebergStorageHandler'\n\nLOCATION\n  'hdfs://ap-datalake/CURATED/ap_community360/dim_facility_community_center'"
columns:
- name: canonical_facility_id
  type: STRING
  nullable: true
  description: 'Primary Key: FK to dim_facility.canonical_facility_id.'
- name: center_type
  type: STRING
  nullable: true
  description: 'Type of venue, e.g. ''Kalyana Mandapam'' (marriage hall) | ''Community Hall''. [Value Examples: ''Kalyana
    Mandapam'', ''Community Hall'']'
- name: managing_authority
  type: STRING
  nullable: true
  description: 'Categorical column. Distinct values: ''Body managing bookings'', ''upkeep of this center.''. Body managing
    bookings/upkeep of this center.'
- name: seating_capacity
  type: INT
  nullable: true
  description: Maximum seating capacity.
- name: hall_area_sqft
  type: DECIMAL(10,2)
  nullable: true
  description: Hall floor area in square feet.
- name: has_stage
  type: BOOLEAN
  nullable: true
  description: Boolean flag. True if a stage is present.
- name: has_kitchen
  type: BOOLEAN
  nullable: true
  description: Boolean flag. True if a kitchen/catering area is present.
- name: has_ac
  type: BOOLEAN
  nullable: true
  description: Boolean flag. True if the hall is air-conditioned.
- name: has_power_backup
  type: BOOLEAN
  nullable: true
  description: Boolean flag. True if generator/power backup is available.
- name: has_parking
  type: BOOLEAN
  nullable: true
  description: Boolean flag. True if dedicated parking is available.
- name: has_toilets
  type: BOOLEAN
  nullable: true
  description: Boolean flag. True if toilet facilities are available.
- name: is_disabled_friendly
  type: BOOLEAN
  nullable: true
  description: Boolean flag. True if the venue has step-free/accessible access.
- name: amenities
  type: ARRAY<STRING>
  nullable: true
  description: ARRAY<STRING> column. Contains Additional amenities available, e.g. ['Sound System', 'Generator'].
- name: rental_available
  type: BOOLEAN
  nullable: true
  description: Boolean flag. True if the venue can be booked by the public.
- name: rental_rate_per_day
  type: DECIMAL(10,2)
  nullable: true
  description: 'Daily rental rate in INR, when rental_available is true. Unit: INR.'
- name: source_system
  type: STRING
  nullable: true
  description: 'Upstream system this row was loaded from, e.g. ''udise_plus'', ''hmis'', ''seed''. [Value Examples: ''udise_plus'',
    ''hmis'', ''seed'']'
- name: batch_id
  type: STRING
  nullable: true
  description: Load batch identifier — groups every row written by the same ingestion run, for reprocessing/rollback.
- name: load_ts
  type: TIMESTAMP
  nullable: true
  description: When this row was first written to the canonical table.
- name: updated_ts
  type: TIMESTAMP
  nullable: true
  description: 'Categorical column. Distinct values: ''When this row was last updated (upsert'', ''merge timestamp).''. When
    this row was last updated (upsert/merge timestamp).'
- name: record_status
  type: STRING
  nullable: true
  description: 'Row lifecycle flag, e.g. ''ACTIVE'' | ''RETIRED'' — soft-delete marker; rows are never hard-deleted. [Value
    Examples: ''ACTIVE'', ''RETIRED'']'
primary_key:
- canonical_facility_id
relationships: []
business_terms:
- ap_community360
- facility_subtypes
- dimension
- Hive
- Iceberg
- ICEBERG
common_operations:
