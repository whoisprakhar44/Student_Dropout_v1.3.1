database: ap_community360
table: fact_facility_access
department: ap_community360
description: 'The catchment/access bridge: for a given geography, how far away and how well-served is it by a given facility.
  This is the table that turns ''a facility exists somewhere'' into ''this village is/isn''t within reach of a hospital''
  — it''s what powers the district access-rate, gap-count, and citizens-in-linked-geographies numbers in the Community 360
  overview, all computed relative to dim_facility_type.service_norm_radius_km. Partitioned by facility_type_id since access
  analysis is almost always scoped to one facility type at a time (e.g. ''hospital access'' vs. ''school access'').'
table_format: ICEBERG
location: hdfs://ap-datalake/CURATED/ap_community360/fact_facility_access
partitioned_by: facility_type_id
tblproperties:
  engine.hive.enabled: 'true'
  external: 'true'
  parquet.compression: SNAPPY
  table_type: ICEBERG
  write.delete.mode: merge-on-read
  write.format.default: parquet
  write.merge.mode: merge-on-read
  write.update.mode: merge-on-read
source_file: ap_community360_canonical_schema.json
raw_ddl: "CREATE EXTERNAL TABLE `ap_community360`.`fact_facility_access`(\n  `facility_access_id` BIGINT COMMENT 'Primary\
  \ Key: access-bridge row.',\n  `geography_id` BIGINT COMMENT 'FK to dim_geography.geography_id — the geography this row\
  \ measures access FROM.',\n  `canonical_facility_id` STRING COMMENT 'FK to dim_facility.canonical_facility_id — the facility\
  \ this row measures access TO.',\n  `facility_type_id` INT COMMENT 'Denormalized FK to dim_facility_type.facility_type_id.\
  \ Partition key.',\n  `distance_km` DECIMAL(7,3) COMMENT 'Distance in kilometers from the geography\\'s centroid to the\
  \ facility.',\n  `travel_time_min` DECIMAL(7,2) COMMENT 'Estimated travel time in minutes.',\n  `is_nearest_of_type` BOOLEAN\
  \ COMMENT 'Boolean flag. True if this facility is the nearest one of its type to this geography (as opposed to just one\
  \ of several within range).',\n  `within_norm_distance` BOOLEAN COMMENT 'Boolean flag. True if distance_km is within dim_facility_type.service_norm_radius_km\
  \ for this facility\\'s type — the pass/fail flag behind district access-rate and gap-count.',\n  `population_served` BIGINT\
  \ COMMENT 'Population of this geography attributed to this facility for service-planning purposes.',\n  `households_served`\
  \ BIGINT COMMENT 'Households of this geography attributed to this facility.',\n  `computed_date` DATE COMMENT 'Date this\
  \ access computation was last run (distances are recomputed periodically, not stored as a live calculation).',\n  `source_system`\
  \ STRING COMMENT 'Upstream system this row was loaded from, e.g. \\'udise_plus\\', \\'hmis\\', \\'seed\\'. [Value Examples:\
  \ \\'udise_plus\\', \\'hmis\\', \\'seed\\']',\n  `batch_id` STRING COMMENT 'Load batch identifier — groups every row written\
  \ by the same ingestion run, for reprocessing/rollback.',\n  `load_ts` TIMESTAMP COMMENT 'When this row was first written\
  \ to the canonical table.')\nROW FORMAT SERDE\n  'org.apache.iceberg.mr.hive.HiveIcebergSerDe'\nSTORED BY\n  'org.apache.iceberg.mr.hive.HiveIcebergStorageHandler'\n\
  \nLOCATION\n  'hdfs://ap-datalake/CURATED/ap_community360/fact_facility_access'\nPARTITIONED BY (facility_type_id)"
columns:
- name: facility_access_id
  type: BIGINT
  nullable: true
  description: 'Primary Key: access-bridge row.'
- name: geography_id
  type: BIGINT
  nullable: true
  description: FK to dim_geography.geography_id — the geography this row measures access FROM.
- name: canonical_facility_id
  type: STRING
  nullable: true
  description: FK to dim_facility.canonical_facility_id — the facility this row measures access TO.
- name: facility_type_id
  type: INT
  nullable: true
  description: Denormalized FK to dim_facility_type.facility_type_id. Partition key.
- name: distance_km
  type: DECIMAL(7,3)
  nullable: true
  description: Distance in kilometers from the geography's centroid to the facility.
- name: travel_time_min
  type: DECIMAL(7,2)
  nullable: true
  description: Estimated travel time in minutes.
- name: is_nearest_of_type
  type: BOOLEAN
  nullable: true
  description: Boolean flag. True if this facility is the nearest one of its type to this geography (as opposed to just one
    of several within range).
- name: within_norm_distance
  type: BOOLEAN
  nullable: true
  description: Boolean flag. True if distance_km is within dim_facility_type.service_norm_radius_km for this facility's type
    — the pass/fail flag behind district access-rate and gap-count.
- name: population_served
  type: BIGINT
  nullable: true
  description: Population of this geography attributed to this facility for service-planning purposes.
- name: households_served
  type: BIGINT
  nullable: true
  description: Households of this geography attributed to this facility.
- name: computed_date
  type: DATE
  nullable: true
  description: Date this access computation was last run (distances are recomputed periodically, not stored as a live calculation).
- name: source_system
  type: STRING
  nullable: true
  description: 'Upstream system this row was loaded from, e.g. ''udise_plus'', ''hmis'', ''seed''. [Value Examples: ''udise_plus'',
    ''hmis'', ''seed'']'
- name: batch_id
  type: STRING
  nullable: true
  description: Load batch identifier — groups every row written by the same ingestion run, for reprocessing/rollback.
- name: load_ts
  type: TIMESTAMP
  nullable: true
  description: When this row was first written to the canonical table.
primary_key:
- facility_access_id
relationships: []
business_terms:
- ap_community360
- facts_—_service_and_access
- fact
- Hive
- Iceberg
- ICEBERG
common_operations:
- aggregate measures in fact_facility_access by geography and time period
- join fact_facility_access with dimension tables via facility_id or person_id
- filter fact_facility_access by district_id or period_date
