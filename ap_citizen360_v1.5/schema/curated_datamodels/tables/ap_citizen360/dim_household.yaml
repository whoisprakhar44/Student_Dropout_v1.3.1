primary_key:
- household_id
relationships:
- dim_household.head_person_id is a foreign key to dim_person.person_id.
- dim_household.mandal_id is a foreign key to dim_mandal.mandal_id.
- dim_household.district_id is a foreign key to dim_district.district_id.
business_terms:
- ap_citizen360
- person___household___identity
- dimension
- Hive
- Iceberg
- ICEBERG
common_operations:
- profile records in dim_household
- join dim_household to dim_person via person_id
- filter dim_household by district_id or mandal_id
