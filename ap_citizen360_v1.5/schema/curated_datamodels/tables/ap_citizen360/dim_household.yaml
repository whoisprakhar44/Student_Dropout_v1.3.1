- name: address
  type: STRING
  nullable: true
  description: Free-text household address.
- name: dwelling_type
  type: STRING
  nullable: true
  description: 'Categorical column. Distinct values: ''Household-level housing tenure'', ''quality, e.g. ''Own House – Pucca''.''.
    Household-level housing tenure/quality, e.g. ''Own House – Pucca''. [Value Examples: ''Own House – Pucca'']'
- name: phone
  type: STRING
  nullable: true
  description: Primary contact number for the household.
- name: household_income_category
  type: STRING
  nullable: true
