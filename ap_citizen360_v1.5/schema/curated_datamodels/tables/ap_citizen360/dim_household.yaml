  type: STRING
  nullable: true
  description: 'Primary Key: household identifier.'
- name: head_person_id
  type: STRING
  nullable: true
  description: 'Foreign Key: References dim_person.person_id. for the head of household.'
- name: head_name
  type: STRING
  nullable: true
  description: Name of the head of household (denormalized for display without a join).
- name: head_gender
  type: STRING
  nullable: true
  description: Gender of the head of household.
- name: members_count
  type: INT
  nullable: true
  description: Total number of members in the household.
- name: social_category
  type: STRING
  nullable: true
  description: Household-level social category (typically the head's), used for some household-targeted welfare schemes.
- name: ration_card_no
  type: STRING
  nullable: true
  description: NFSA ration card number issued to this household.
- name: ration_card_type
  type: STRING
  nullable: true
  description: 'Categorical column. Distinct values: ''AAY'', ''PHH'', ''NPHH — ration card priority category.''. AAY / PHH
    / NPHH — ration card priority category.'
- name: income_band
  type: STRING
  nullable: true
  description: Household income bracket (ranged, e.g. 'Below ₹1.5L').
- name: village_name
  type: STRING
  nullable: true
  description: 'Categorical column. Distinct values: ''Village'', ''habitation the household resides in.''. Village/habitation
    the household resides in.'
- name: mandal_id
  type: STRING
  nullable: true
  description: 'Foreign Key: References dim_mandal.mandal_id.'
- name: district_id
