database: ap_citizen360
table: fact_p4_citizen_score
department: ap_citizen360
description: One row per person per scoring period — their individual P4 scores across the five thematic areas plus a composite
  score, and whether they're flagged as part of the Bangaru Kutumbam (uplift-priority household) cohort.
table_format: ICEBERG
location: hdfs://ap-datalake/CURATED/ap_citizen360/fact_p4_citizen_score
partitioned_by: null
tblproperties:
  engine.hive.enabled: 'true'
  external: 'true'
  parquet.compression: SNAPPY
  table_type: ICEBERG
  write.delete.mode: merge-on-read
  write.format.default: parquet
  write.merge.mode: merge-on-read
  write.update.mode: merge-on-read
source_file: citizen360_canonical_schema.json
raw_ddl: "CREATE EXTERNAL TABLE `ap_citizen360`.`fact_p4_citizen_score`(\n  `citizen_score_id` STRING COMMENT 'Primary Key:\
  \ score-record identifier.',\n  `person_id` STRING COMMENT 'Foreign Key: References dim_person.person_id.',\n  `household_id`\
  \ STRING COMMENT 'Foreign Key: References dim_household.household_id.',\n  `district_id` STRING COMMENT 'Foreign Key: References\
  \ dim_district.district_id.',\n  `mandal_id` STRING COMMENT 'Foreign Key: References dim_mandal.mandal_id.',\n  `village_name`\
  \ STRING COMMENT 'Village this score record pertains to.',\n  `period` STRING COMMENT 'Scoring period this row covers, e.g.\
  \ a year-month.',\n  `is_bangaru_kutumbam` BOOLEAN COMMENT 'Boolean flag. True if this person\\'s household is flagged as\
  \ a priority-uplift (bangaru kutumbam) household for this period.',\n  `health_nutrition_score` DOUBLE COMMENT 'Health &\
  \ Nutrition thematic score for this period.',\n  `education_score` DOUBLE COMMENT 'Education thematic score for this period.',\n\
  \  `agriculture_livelihood_score` DOUBLE COMMENT 'Agriculture & Livelihood thematic score for this period.',\n  `financial_inclusion_score`\
  \ DOUBLE COMMENT 'Financial Inclusion thematic score for this period.',\n  `infrastructure_living_score` DOUBLE COMMENT\
  \ 'Infrastructure & Living thematic score for this period.',\n  `composite_score` DOUBLE COMMENT 'Weighted composite of\
  \ the five thematic scores for this period.',\n  `upliftment_status` STRING COMMENT 'Trend classification of this citizen\\\
  's progress, e.g. \\'Improving\\', \\'Stagnant\\', \\'Declining\\'. [Value Examples: \\'Improving\\', \\'Stagnant\\', \\\
  'Declining\\']',\n  `created_at` TIMESTAMP COMMENT 'Categorical column. Distinct values: \\'Timestamp this score record\
  \ was computed\\', \\'created.\\'. Timestamp this score record was computed/created.')\nROW FORMAT SERDE\n  'org.apache.iceberg.mr.hive.HiveIcebergSerDe'\n\
  STORED BY\n  'org.apache.iceberg.mr.hive.HiveIcebergStorageHandler'\n\nLOCATION\n  'hdfs://ap-datalake/CURATED/ap_citizen360/fact_p4_citizen_score'"
columns:
- name: citizen_score_id
  type: STRING
  nullable: true
  description: 'Primary Key: score-record identifier.'
- name: person_id
  type: STRING
  nullable: true
  description: 'Foreign Key: References dim_person.person_id.'
- name: household_id
  type: STRING
  nullable: true
  description: 'Foreign Key: References dim_household.household_id.'
- name: district_id
  type: STRING
  nullable: true
  description: 'Foreign Key: References dim_district.district_id.'
- name: mandal_id
  type: STRING
  nullable: true
  description: 'Foreign Key: References dim_mandal.mandal_id.'
- name: village_name
  type: STRING
  nullable: true
  description: Village this score record pertains to.
- name: period
  type: STRING
  nullable: true
  description: Scoring period this row covers, e.g. a year-month.
- name: is_bangaru_kutumbam
  type: BOOLEAN
  nullable: true
  description: Boolean flag. True if this person's household is flagged as a priority-uplift (bangaru kutumbam) household
    for this period.
- name: health_nutrition_score
  type: DOUBLE
  nullable: true
  description: Health & Nutrition thematic score for this period.
- name: education_score
  type: DOUBLE
  nullable: true
  description: Education thematic score for this period.
- name: agriculture_livelihood_score
  type: DOUBLE
  nullable: true
  description: Agriculture & Livelihood thematic score for this period.
- name: financial_inclusion_score
  type: DOUBLE
  nullable: true
  description: Financial Inclusion thematic score for this period.
- name: infrastructure_living_score
  type: DOUBLE
  nullable: true
  description: Infrastructure & Living thematic score for this period.
- name: composite_score
  type: DOUBLE
  nullable: true
  description: Weighted composite of the five thematic scores for this period.
- name: upliftment_status
  type: STRING
  nullable: true
  description: 'Trend classification of this citizen''s progress, e.g. ''Improving'', ''Stagnant'', ''Declining''. [Value
    Examples: ''Improving'', ''Stagnant'', ''Declining'']'
- name: created_at
  type: TIMESTAMP
  nullable: true
  description: 'Categorical column. Distinct values: ''Timestamp this score record was computed'', ''created.''. Timestamp
    this score record was computed/created.'
primary_key:
- citizen_score_id
relationships:
- fact_p4_citizen_score.person_id is a foreign key to dim_person.person_id.
- fact_p4_citizen_score.household_id is a foreign key to dim_household.household_id.
- fact_p4_citizen_score.district_id is a foreign key to dim_district.district_id.
- fact_p4_citizen_score.mandal_id is a foreign key to dim_mandal.mandal_id.
business_terms:
- ap_citizen360
- p4_(people-public_policy_performance)_scoring
- fact
- Hive
- Iceberg
- ICEBERG
common_operations:
- aggregate measures in fact_p4_citizen_score by geography and time period
- join fact_p4_citizen_score with dimension tables via facility_id or person_id
- filter fact_p4_citizen_score by district_id or period_date
