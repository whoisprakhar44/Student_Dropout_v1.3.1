database: ap_citizen360
table: dim_land
department: ap_citizen360
description: "One row per land parcel owned \u2014 agricultural, residential, or commercial.\
  \ Carries revenue-record detail (survey numbers, registration, mutation) as well\
  \ as agronomic detail (soil, irrigation) for parcels used for farming."
table_format: ICEBERG
location: hdfs://ap-datalake/CURATED/ap_citizen360/dim_land
partitioned_by: null
tblproperties:
  engine.hive.enabled: 'true'
  external: 'true'
  parquet.compression: SNAPPY
  table_type: ICEBERG
  write.delete.mode: merge-on-read
  write.format.default: parquet
  write.merge.mode: merge-on-read
  write.update.mode: merge-on-read
source_file: citizen360_canonical_schema.json
raw_ddl: "CREATE EXTERNAL TABLE `ap_citizen360`.`dim_land`(\n  `land_id` STRING COMMENT\
  \ 'Primary Key: land-parcel identifier.',\n  `person_id` STRING COMMENT 'Foreign\
  \ Key: References dim_person.person_id. the owner.',\n  `land_type` STRING COMMENT\
  \ 'Categorical column. Distinct values: \\'Agricultural\\', \\'Residential\\', \\\
  'Commercial classification of the parcel.\\'. Agricultural / Residential / Commercial\
  \ classification of the parcel.',\n  `land_classification` STRING COMMENT 'Revenue\
  \ classification of the land, e.g. \\'Wet\\', \\'Dry\\', \\'Garden\\'. [Value Examples:\
  \ \\'Wet\\', \\'Dry\\', \\'Garden\\']',\n  `acres` DOUBLE COMMENT 'Total extent\
  \ of the parcel, in acres. Unit: acres.',\n  `survey_no` STRING COMMENT 'Revenue\
  \ survey number of the parcel.',\n  `sub_survey_no` STRING COMMENT 'Sub-division\
  \ of the survey number, where the parcel is a subdivided plot.',\n  `hissa_no` STRING\
  \ COMMENT 'Hissa (further subdivision) number, where applicable.',\n  `khata_no`\
  \ STRING COMMENT 'Khata (revenue account) number the parcel is recorded under.',\n\
  \  `location` STRING COMMENT 'Free-text location description of the parcel.',\n\
  \  `district_id` STRING COMMENT 'Foreign Key: References dim_district.district_id.',\n\
  \  `mandal_id` STRING COMMENT 'Foreign Key: References dim_mandal.mandal_id.',\n\
  \  `village_name` STRING COMMENT 'Village the parcel is located in.',\n  `revenue_circle`\
  \ STRING COMMENT 'Revenue administrative circle covering the parcel.',\n  `sro_office`\
  \ STRING COMMENT 'Sub-Registrar Office where the parcel\\'s deed is registered.',\n\
  \  `registration_no` STRING COMMENT 'Deed registration number.',\n  `pattadar_passbook_no`\
  \ STRING COMMENT 'Pattadar passbook (title document) number for the parcel.',\n\
  \  `registration_date` DATE COMMENT 'Date the current deed was registered.',\n \
  \ `mutation_date` DATE COMMENT 'Date land-records mutation (ownership transfer reflected\
  \ in revenue records) was completed.',\n  `market_value` DECIMAL(12,2) COMMENT 'Estimated\
  \ market value of the parcel, in INR. Unit: INR.',\n  `guideline_value` DECIMAL(12,2)\
  \ COMMENT 'Government guideline (registration) value of the parcel, in INR. Unit:\
  \ INR.',\n  `stamp_duty_paid` DECIMAL(10,2) COMMENT 'Stamp duty paid on the most\
  \ recent registration, in INR. Unit: INR.',\n  `soil_type` STRING COMMENT 'Soil\
  \ type of the parcel, e.g. \\'Black\\', \\'Red\\', \\'Alluvial\\' \u2014 relevant\
  \ for agricultural parcels. [Value Examples: \\'Black\\', \\'Red\\', \\'Alluvial\\\
  ']',\n  `irrigation_type` STRING COMMENT 'Irrigation source/type for the parcel,\
  \ e.g. \\'Canal\\', \\'Borewell\\', \\'Rain-fed\\'. [Value Examples: \\'Canal\\\
  ', \\'Borewell\\', \\'Rain-fed\\']',\n  `encumbrance_status` STRING COMMENT 'Whether\
  \ the parcel is encumbered (e.g. under mortgage), per the Encumbrance Certificate.',\n\
  \  `mortgage_bank` STRING COMMENT 'Bank holding a mortgage on the parcel, where\
  \ encumbered.',\n  `mortgage_amount` DECIMAL(12,2) COMMENT 'Outstanding mortgage\
  \ amount against the parcel, in INR. Unit: INR.',\n  `is_assigned_land` BOOLEAN\
  \ COMMENT 'Boolean flag. True if this is government-assigned land (allotted under\
  \ a land-assignment scheme) rather than freehold.',\n  `extent_wet_land` DOUBLE\
  \ COMMENT 'Portion of the parcel\\'s extent classified as wet (irrigated) land,\
  \ in acres. Unit: acres.',\n  `extent_dry_land` DOUBLE COMMENT 'Portion of the parcel\\\
  's extent classified as dry (unirrigated) land, in acres. Unit: acres.',\n  `updated_at`\
  \ TIMESTAMP COMMENT 'Timestamp this land record was last updated.')\nROW FORMAT\
  \ SERDE\n  'org.apache.iceberg.mr.hive.HiveIcebergSerDe'\nSTORED BY\n  'org.apache.iceberg.mr.hive.HiveIcebergStorageHandler'\n\
  \nLOCATION\n  'hdfs://ap-datalake/CURATED/ap_citizen360/dim_land'"
columns:
