  type: STRING
  nullable: true
  description: 'Primary Key: land-parcel identifier.'
- name: person_id
  type: STRING
  nullable: true
  description: 'Foreign Key: References dim_person.person_id. the owner.'
- name: land_type
  type: STRING
  nullable: true
  description: 'Categorical column. Distinct values: ''Agricultural'', ''Residential'',
    ''Commercial classification of the parcel.''. Agricultural / Residential / Commercial
    classification of the parcel.'
- name: land_classification
  type: STRING
  nullable: true
  description: 'Revenue classification of the land, e.g. ''Wet'', ''Dry'', ''Garden''.
    [Value Examples: ''Wet'', ''Dry'', ''Garden'']'
- name: acres
  type: DOUBLE
  nullable: true
