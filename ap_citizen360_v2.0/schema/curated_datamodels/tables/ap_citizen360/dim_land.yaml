- name: extent_wet_land
  type: DOUBLE
  nullable: true
  description: 'Portion of the parcel''s extent classified as wet (irrigated) land,
    in acres. Unit: acres.'
- name: extent_dry_land
  type: DOUBLE
  nullable: true
  description: 'Portion of the parcel''s extent classified as dry (unirrigated) land,
    in acres. Unit: acres.'
  distinct:
