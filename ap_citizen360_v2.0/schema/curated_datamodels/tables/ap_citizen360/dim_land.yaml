- name: mortgage_bank
  type: STRING
  nullable: true
  description: Bank holding a mortgage on the parcel, where encumbered.
  distinct:
  - 'NULL'
- name: mortgage_amount
  type: DECIMAL(12,2)
  nullable: true
  description: 'Outstanding mortgage amount against the parcel, in INR. Unit: INR.'
- name: is_assigned_land
  type: BOOLEAN
  nullable: true
  description: Boolean flag. True if this is government-assigned land (allotted under
