  distinct:
  - 'NULL'
- name: irrigation_type
  type: STRING
  nullable: true
  description: 'Irrigation source/type for the parcel, e.g. ''Canal'', ''Borewell'',
    ''Rain-fed''. [Value Examples: ''Canal'', ''Borewell'', ''Rain-fed'']'
  distinct:
  - 'NULL'
- name: encumbrance_status
  type: STRING
  nullable: true
