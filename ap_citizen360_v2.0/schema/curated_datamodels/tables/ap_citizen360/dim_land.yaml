- name: updated_at
  type: TIMESTAMP
  nullable: true
  description: Timestamp this land record was last updated.
primary_key:
- land_id
relationships:
- dim_land.person_id is a foreign key to dim_person.person_id.
- dim_land.district_id is a foreign key to dim_district.district_id.
- dim_land.mandal_id is a foreign key to dim_mandal.mandal_id.
business_terms:
- ap_citizen360
- "assets_\u2014_land_and_property"
- dimension
- Hive
- Iceberg
- ICEBERG
common_operations:
- profile records in dim_land
- join dim_land to dim_person via person_id
- filter dim_land by district_id or mandal_id
- name: aadhaar_mapped
  type: STRING
  nullable: true
  description: Added from metadata.
