database: ap_citizen360
table: fact_scheme_disbursement
department: ap_citizen360
description: "Pre-aggregated scheme disbursement totals per geography per fiscal year,\
  \ broken down by social category \u2014 backs the Budget Integrity / disbursement\
  \ dashboards without having to aggregate fact_benefit_transaction at query time.\
  \ Partitioned by geo_level and fiscal_year."
table_format: ICEBERG
location: hdfs://ap-datalake/CURATED/ap_citizen360/fact_scheme_disbursement
partitioned_by: geo_level, fiscal_year
tblproperties:
  engine.hive.enabled: 'true'
  external: 'true'
  parquet.compression: SNAPPY
  table_type: ICEBERG
  write.delete.mode: merge-on-read
  write.format.default: parquet
  write.merge.mode: merge-on-read
  write.update.mode: merge-on-read
source_file: citizen360_canonical_schema.json
raw_ddl: "CREATE EXTERNAL TABLE `ap_citizen360`.`fact_scheme_disbursement`(\n  `disbursement_id`\
  \ STRING COMMENT 'Primary Key: disbursement-aggregate identifier.',\n  `scheme_id`\
  \ STRING COMMENT 'Foreign Key: References dim_scheme.scheme_id.',\n  `department_id`\
  \ STRING COMMENT 'Foreign Key: References dim_department.department_id.',\n  `geo_level`\
  \ STRING COMMENT 'Geography level this aggregate is rolled up to, e.g. \\'state\\\
  ', \\'district\\', \\'mandal\\'. [Value Examples: \\'state\\', \\'district\\', \\\
  'mandal\\']',\n  `geo_id` STRING COMMENT 'Identifier of the specific geography at\
  \ geo_level (e.g. a district_id when geo_level=\\'district\\'). [Value Examples:\
  \ \\'district\\']',\n  `fiscal_year` STRING COMMENT 'Fiscal year this aggregate\
  \ covers. Partition key.',\n  `total_crores` DECIMAL(12,2) COMMENT 'Total disbursement\
  \ amount, in INR crores. Unit: INR.',\n  `beneficiaries` BIGINT COMMENT 'Total count\
  \ of beneficiaries covered by this aggregate.',\n  `amount_oc` DECIMAL(12,2) COMMENT\
  \ 'Disbursement amount attributable to OC-category beneficiaries, in INR crores.\
  \ Unit: INR.',\n  `amount_bc` DECIMAL(12,2) COMMENT 'Disbursement amount attributable\
  \ to BC-category beneficiaries, in INR crores. Unit: INR.',\n  `amount_sc` DECIMAL(12,2)\
  \ COMMENT 'Disbursement amount attributable to SC-category beneficiaries, in INR\
  \ crores. Unit: INR.',\n  `amount_st` DECIMAL(12,2) COMMENT 'Disbursement amount\
  \ attributable to ST-category beneficiaries, in INR crores. Unit: INR.',\n  `amount_others`\
  \ DECIMAL(12,2) COMMENT 'Disbursement amount attributable to beneficiaries outside\
  \ the OC/BC/SC/ST categories, in INR crores. Unit: INR.')\nROW FORMAT SERDE\n  'org.apache.iceberg.mr.hive.HiveIcebergSerDe'\n\
  STORED BY\n  'org.apache.iceberg.mr.hive.HiveIcebergStorageHandler'\n\nLOCATION\n\
  \  'hdfs://ap-datalake/CURATED/ap_citizen360/fact_scheme_disbursement'\nPARTITIONED\
  \ BY (geo_level, fiscal_year)"
columns:
- name: disbursement_id
  type: STRING
  nullable: true
  description: 'Primary Key: disbursement-aggregate identifier.'
- name: scheme_id
  type: STRING
  nullable: true
  description: 'Foreign Key: References dim_scheme.scheme_id.'
- name: department_id
  type: STRING
  nullable: true
  description: 'Foreign Key: References dim_department.department_id.'
- name: geo_level
  type: STRING
  nullable: true
  description: 'Geography level this aggregate is rolled up to, e.g. ''state'', ''district'',
    ''mandal''. [Value Examples: ''state'', ''district'', ''mandal'']'
  distinct:
  - village
  - mandal
  - district
- name: geo_id
  type: STRING
  nullable: true
  description: 'Identifier of the specific geography at geo_level (e.g. a district_id
    when geo_level=''district''). [Value Examples: ''district'']'
- name: fiscal_year
  type: STRING
  nullable: true
  description: Fiscal year this aggregate covers. Partition key.
  distinct:
  - 2025-2026
  - 2026-2027
  - 2023-2024
  - 2024-2025
  - 2022-2023
  - 2021-2022
  - 2019-2020
  - 2020-2021
  - 'NULL'
  - 2018-2019
  - 2017-2018
  - 2016-2017
  - 2015-2016
  - 2014-2015
  - 2013-2014
  - 2012-2013
  - 2011-2012
  - 2010-2011
  - 2009-2010
  - 2008-2009
  - 1899-1900
  - 2000-2001
  - 1954-1955
  - 2005-2006
  - 2007-2008
  - 2001-2002
  - 2006-2007
  - 2003-2004
- name: total_crores
  type: DECIMAL(12,2)
  nullable: true
  description: 'Total disbursement amount, in INR crores. Unit: INR.'
- name: beneficiaries
  type: BIGINT
  nullable: true
  description: Total count of beneficiaries covered by this aggregate.
- name: amount_oc
  type: DECIMAL(12,2)
  nullable: true
  description: 'Disbursement amount attributable to OC-category beneficiaries, in
    INR crores. Unit: INR.'
- name: amount_bc
  type: DECIMAL(12,2)
  nullable: true
  description: 'Disbursement amount attributable to BC-category beneficiaries, in
    INR crores. Unit: INR.'
- name: amount_sc
  type: DECIMAL(12,2)
  nullable: true
  description: 'Disbursement amount attributable to SC-category beneficiaries, in
    INR crores. Unit: INR.'
- name: amount_st
  type: DECIMAL(12,2)
  nullable: true
  description: 'Disbursement amount attributable to ST-category beneficiaries, in
    INR crores. Unit: INR.'
- name: amount_others
  type: DECIMAL(12,2)
  nullable: true
  description: 'Disbursement amount attributable to beneficiaries outside the OC/BC/SC/ST
    categories, in INR crores. Unit: INR.'
primary_key:
- disbursement_id
relationships:
- fact_scheme_disbursement.scheme_id is a foreign key to dim_scheme.scheme_id.
- fact_scheme_disbursement.department_id is a foreign key to dim_department.department_id.
business_terms:
- ap_citizen360
- "data_transfer_api_\u2014_entitlements,_transactions,_disbursements"
- fact
- Hive
- Iceberg
- ICEBERG
common_operations:
- aggregate measures in fact_scheme_disbursement by geography and time period
- join fact_scheme_disbursement with dimension tables via facility_id or person_id
- filter fact_scheme_disbursement by district_id or period_date
