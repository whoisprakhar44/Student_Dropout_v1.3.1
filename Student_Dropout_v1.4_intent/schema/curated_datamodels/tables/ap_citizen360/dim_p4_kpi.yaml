database: ap_citizen360
table: dim_p4_kpi
department: ap_citizen360
description: Canonical catalog of P4/Bangaru Kutumbam KPIs — the indicators rolled up into the five thematic scores (health
  & nutrition, education, agriculture & livelihood, financial inclusion, infrastructure & living) used throughout the P4 scoring
  system. KPI forecasts are computed on the fly from this and the score facts below — there is no stored forecast table.
table_format: ICEBERG
location: hdfs://ap-datalake/CURATED/ap_citizen360/dim_p4_kpi
partitioned_by: null
tblproperties:
  engine.hive.enabled: 'true'
  external: 'true'
  parquet.compression: SNAPPY
  table_type: ICEBERG
  write.delete.mode: merge-on-read
  write.format.default: parquet
  write.merge.mode: merge-on-read
  write.update.mode: merge-on-read
source_file: citizen360_canonical_schema.json
raw_ddl: "CREATE EXTERNAL TABLE `ap_citizen360`.`dim_p4_kpi`(\n  `kpi_id` STRING COMMENT 'Primary Key: KPI code, e.g. \\'HN01\\\
  '.',\n  `thematic_area` STRING COMMENT 'Which of the five P4 thematic areas this KPI belongs to.',\n  `area_weightage` DOUBLE\
  \ COMMENT 'Weight this thematic area contributes to the overall composite score (0-1).',\n  `kpi_name` STRING COMMENT 'Display\
  \ name of the KPI.',\n  `description` STRING COMMENT 'Explanation of what this KPI measures and how.',\n  `unit` STRING\
  \ COMMENT 'Unit of measure for the KPI\\'s value, e.g. \\'%\\', \\'per 1000\\'. [Value Examples: \\'%\\', \\'per 1000\\\
  ']',\n  `target_value` DOUBLE COMMENT 'Target value policy aims to reach for this KPI.',\n  `is_inverse` BOOLEAN COMMENT\
  \ 'Boolean flag. True if lower values are better for this kpi (e.g. a mortality rate), so achievement % is computed inversely\
  \ against the target.')\nROW FORMAT SERDE\n  'org.apache.iceberg.mr.hive.HiveIcebergSerDe'\nSTORED BY\n  'org.apache.iceberg.mr.hive.HiveIcebergStorageHandler'\n\
  \nLOCATION\n  'hdfs://ap-datalake/CURATED/ap_citizen360/dim_p4_kpi'"
columns:
- name: kpi_id
  type: STRING
  nullable: true
  description: 'Primary Key: KPI code, e.g. ''HN01''.'
- name: thematic_area
  type: STRING
  nullable: true
  description: Which of the five P4 thematic areas this KPI belongs to.
- name: area_weightage
  type: DOUBLE
  nullable: true
  description: Weight this thematic area contributes to the overall composite score (0-1).
- name: kpi_name
  type: STRING
  nullable: true
  description: Display name of the KPI.
- name: description
  type: STRING
  nullable: true
  description: Explanation of what this KPI measures and how.
- name: unit
  type: STRING
  nullable: true
  description: 'Unit of measure for the KPI''s value, e.g. ''%'', ''per 1000''. [Value Examples: ''%'', ''per 1000'']'
- name: target_value
  type: DOUBLE
  nullable: true
  description: Target value policy aims to reach for this KPI.
- name: is_inverse
  type: BOOLEAN
  nullable: true
  description: Boolean flag. True if lower values are better for this kpi (e.g. a mortality rate), so achievement % is computed
    inversely against the target.
primary_key:
- kpi_id
relationships: []
business_terms:
- ap_citizen360
- p4_(people-public_policy_performance)_scoring
- dimension
- Hive
- Iceberg
- ICEBERG
common_operations:
- profile records in dim_p4_kpi
- join dim_p4_kpi to dim_person via person_id
- filter dim_p4_kpi by district_id or mandal_id
