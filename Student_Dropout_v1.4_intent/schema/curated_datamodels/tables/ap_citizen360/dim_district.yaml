  type: STRING
  nullable: true
  description: 'Primary Key: district code, e.g. ''guntur''.'
- name: district_name
  type: STRING
  nullable: true
  description: Display name of the district.
- name: state_id
  type: STRING
  nullable: true
  description: 'Foreign Key: References dim_state.state_id.'
- name: population
  type: BIGINT
  nullable: true
  description: Total district population.
- name: households
  type: BIGINT
  nullable: true
  description: Total household count in the district.
- name: literacy_rate
  type: DOUBLE
  nullable: true
  description: 'District literacy rate, percentage (0-100). Unit: percentage (0-100).'
- name: sex_ratio
  type: INT
  nullable: true
  description: Females per 1000 males in the district.
- name: urbanization_pct
  type: DOUBLE
  nullable: true
  description: 'Percentage of the district''s population classified urban. Unit: percentage (0-100).'
- name: ration_cards_total
  type: BIGINT
  nullable: true
  description: Total NFSA ration cards issued in the district.
- name: ration_aay
  type: BIGINT
  nullable: true
  description: District ration cards under the Antyodaya Anna Yojana category.
- name: ration_phh
  type: BIGINT
  nullable: true
  description: District ration cards under the Priority Household category.
- name: ration_nphh
  type: BIGINT
  nullable: true
  description: District ration cards under the Non-Priority Household category.
- name: ration_others
  type: BIGINT
  nullable: true
  description: 'Categorical column. Distinct values: ''District ration cards under other'', ''legacy categories.''. District
    ration cards under other/legacy categories.'
- name: vehicles
  type: BIGINT
  nullable: true
  description: Total registered vehicles in the district.
- name: land_acres
  type: BIGINT
  nullable: true
  description: 'Total land extent recorded in the district, in acres. Unit: acres.'
- name: agri_land_acres
  type: BIGINT
  nullable: true
  description: 'Total agricultural land extent in the district, in acres. Unit: acres.'
- name: properties
  type: BIGINT
  nullable: true
  description: 'Categorical column. Distinct values: ''Total registered properties (residential'', ''commercial) in the district.''.
    Total registered properties (residential/commercial) in the district.'
- name: gas_connections
  type: BIGINT
  nullable: true
  description: Total registered domestic gas connections in the district.
- name: electricity_consumers
  type: BIGINT
  nullable: true
