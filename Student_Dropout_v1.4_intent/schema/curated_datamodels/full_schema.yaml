    and government health-scheme coverage. The aggregation point for everything the Health department tracks about a citizen.
  table_format: ICEBERG
  location: hdfs://ap-datalake/CURATED/ap_citizen360/dim_health_profile
  partitioned_by: null
  tblproperties:
