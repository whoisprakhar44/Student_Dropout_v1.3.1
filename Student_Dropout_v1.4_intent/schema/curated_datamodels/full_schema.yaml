    \ 'Foreign Key: References dim_state.state_id.',\n  `population` BIGINT COMMENT 'Total district population.',\n  `households`\
    \ BIGINT COMMENT 'Total household count in the district.',\n  `literacy_rate` DOUBLE COMMENT 'District literacy rate,\
    \ percentage (0-100). Unit: percentage (0-100).',\n  `sex_ratio` INT COMMENT 'Females per 1000 males in the district.',\n\
    \  `urbanization_pct` DOUBLE COMMENT 'Percentage of the district\\'s population classified urban. Unit: percentage (0-100).',\n\
    \  `ration_cards_total` BIGINT COMMENT 'Total NFSA ration cards issued in the district.',\n  `ration_aay` BIGINT COMMENT\
    \ 'District ration cards under the Antyodaya Anna Yojana category.',\n  `ration_phh` BIGINT COMMENT 'District ration cards\
    \ under the Priority Household category.',\n  `ration_nphh` BIGINT COMMENT 'District ration cards under the Non-Priority\
    \ Household category.',\n  `ration_others` BIGINT COMMENT 'Categorical column. Distinct values: \\'District ration cards\
    \ under other\\', \\'legacy categories.\\'. District ration cards under other/legacy categories.',\n  `vehicles` BIGINT\
    \ COMMENT 'Total registered vehicles in the district.',\n  `land_acres` BIGINT COMMENT 'Total land extent recorded in\
    \ the district, in acres. Unit: acres.',\n  `agri_land_acres` BIGINT COMMENT 'Total agricultural land extent in the district,\
    \ in acres. Unit: acres.',\n  `properties` BIGINT COMMENT 'Categorical column. Distinct values: \\'Total registered properties\
    \ (residential\\', \\'commercial) in the district.\\'. Total registered properties (residential/commercial) in the district.',\n\
    \  `gas_connections` BIGINT COMMENT 'Total registered domestic gas connections in the district.',\n  `electricity_consumers`\
    \ BIGINT COMMENT 'Total registered electricity consumer connections in the district.',\n  `avg_monthly_kwh` INT COMMENT\
    \ 'Average monthly electricity consumption per consumer, in kWh. Unit: kWh.',\n  `property_tax_coverage` INT COMMENT 'Percentage\
    \ of assessed properties that are current on property tax. Unit: percentage (0-100).',\n  `effective_from` DATE COMMENT\
    \ 'Start date this snapshot row is valid from (SCD2 versioning).',\n  `effective_to` DATE COMMENT 'End date this snapshot\
    \ row is valid until; null/open-ended for the current row.',\n  `is_current` BOOLEAN COMMENT 'Boolean flag. True if this\
    \ is the latest/active version of the district snapshot.')\nROW FORMAT SERDE\n  'org.apache.iceberg.mr.hive.HiveIcebergSerDe'\n\
    STORED BY\n  'org.apache.iceberg.mr.hive.HiveIcebergStorageHandler'\n\nLOCATION\n  'hdfs://ap-datalake/CURATED/ap_citizen360/dim_district'"
