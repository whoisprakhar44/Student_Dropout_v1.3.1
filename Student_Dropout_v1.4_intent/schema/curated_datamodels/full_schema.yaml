  raw_ddl: "CREATE EXTERNAL TABLE `ap_citizen360`.`dim_vehicle_compliance`(\n  `person_id` STRING COMMENT 'Primary Key: Foreign\
    \ key to dim_person.person_id — the vehicle owner.',\n  `reg_no` STRING COMMENT 'Primary Key: Vehicle registration number\
    \ — joins back to dim_vehicle.reg_no.',\n  `insurance_valid_to` DATE COMMENT 'Date the current insurance policy expires.',\n\
    \  `insurance_company` STRING COMMENT 'Name of the insurer.',\n  `policy_no` STRING COMMENT 'Insurance policy number.',\n\
    \  `fitness_valid_to` DATE COMMENT 'Date the vehicle\\'s fitness certificate expires.',\n  `registration_valid_to` DATE\
    \ COMMENT 'Date the vehicle\\'s registration itself expires/needs renewal.',\n  `puc_valid_to` DATE COMMENT 'Date the\
    \ Pollution Under Control certificate expires.',\n  `permit_type` STRING COMMENT 'Type of transport permit held, where\
    \ applicable (e.g. commercial vehicles).',\n  `permit_valid_to` DATE COMMENT 'Date the transport permit expires.',\n \
    \ `tax_paid_upto` DATE COMMENT 'Date through which road tax has been paid.',\n  `green_tax_due` BOOLEAN COMMENT 'Boolean\
    \ flag. True if a green tax (for older vehicles) is currently due.',\n  `financer_name` STRING COMMENT 'Name of the financing\
    \ bank/NBFC, if the vehicle is under loan.',\n  `hypothecation_status` STRING COMMENT 'Hypothecation (loan lien) status\
    \ with the financer, e.g. \\'Active\\', \\'Terminated\\'. [Value Examples: \\'Active\\', \\'Terminated\\']',\n  `loan_outstanding`\
    \ DECIMAL(12,2) COMMENT 'Outstanding loan amount against the vehicle, in INR. Unit: INR.',\n  `hsrp_issued` BOOLEAN COMMENT\
    \ 'Boolean flag. True if a high security registration plate has been issued for this vehicle.',\n  `challan_pending` BOOLEAN\
    \ COMMENT 'Boolean flag. True if there is at least one unpaid traffic challan against this vehicle.',\n  `updated_at`\
    \ TIMESTAMP COMMENT 'Timestamp this compliance record was last updated.')\nROW FORMAT SERDE\n  'org.apache.iceberg.mr.hive.HiveIcebergSerDe'\n\
    STORED BY\n  'org.apache.iceberg.mr.hive.HiveIcebergStorageHandler'\n\nLOCATION\n  'hdfs://ap-datalake/CURATED/ap_citizen360/dim_vehicle_compliance'"
