    \ Tax Identification Number — joins to dim_property.ptin.',\n  `assessment_year` STRING COMMENT 'Primary Key: Financial/assessment\
    \ year this tax record covers.',\n  `annual_demand_rs` DECIMAL(12,2) COMMENT 'Annual property tax demand for this assessment\
